name: Bullwerk 500 Stock Capacity Test

on:
  workflow_dispatch:
    inputs:
      validate_only:
        description: "Validate stock symbols only (no chart scan)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install yfinance pandas requests lxml pytickersymbols
      - name: Validate universe or run benchmark
        env:
          VALIDATE_ONLY: ${{ inputs.validate_only }}
        run: |
          if [ "$VALIDATE_ONLY" = "true" ]; then
            python tests/pullback_capacity_500.py --validate-universe
          else
            python tests/pullback_capacity_500.py
          fi
