name: Bullwerk 500 Stock Capacity Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install yfinance pandas requests lxml pytickersymbols
      - name: Benchmark 500 stocks without changing detection
        run: python tests/pullback_capacity_500.py
