name: Bullwerk 300 Stock Capacity Test (private)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install yfinance pandas requests lxml
      - name: Benchmark 300 stocks without changing pattern logic
        run: python tests/pullback_capacity_300.py
