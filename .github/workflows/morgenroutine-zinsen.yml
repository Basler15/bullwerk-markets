
name: Bullwerk Morgenroutine - US-Zinsen

on:
  workflow_dispatch:
  schedule:
    # 07:30 Uhr in Deutschland, Sommer- und Winterzeit
    - cron: "30 5 * * 1-5"
    - cron: "30 6 * * 1-5"

permissions:
  contents: write

jobs:
  update-zinsen:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Deutsche Uhrzeit prüfen
        id: zeit
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          jetzt = datetime.now(ZoneInfo("Europe/Berlin"))
          erlaubt = (
              os.environ["EVENT_NAME"] == "workflow_dispatch"
              or (jetzt.weekday() < 5 and jetzt.hour == 7)
          )
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"ausfuehren={str(erlaubt).lower()}\n")
          print("Deutsche Uhrzeit:", jetzt.isoformat())
          print("Abruf ausführen:", erlaubt)
          PY

      - name: FRED-Zinsdaten abrufen
        if: steps.zeit.outputs.ausfuehren == 'true'
        run: |
          python3 - <<'PY'
          import csv
          import io
          import json
          import time
          import urllib.request
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          datei = Path("morgenroutine-data.json")
          daten = json.loads(datei.read_text(encoding="utf-8"))

          def abrufen(serie):
              url = f"https://fred.stlouisfed.org/graph/fredgraph.csv?id={serie}"
              for versuch in range(3):
                  try:
                      anfrage = urllib.request.Request(
                          url,
                          headers={"User-Agent": "BullwerkMarkets/1.0"}
                      )
                      with urllib.request.urlopen(anfrage, timeout=30) as antwort:
                          inhalt = antwort.read().decode("utf-8-sig")

                      zeilen = csv.DictReader(io.StringIO(inhalt))
                      letzter = None
                      for zeile in zeilen:
                          wert = zeile.get(serie, "").strip()
                          datum = zeile.get("observation_date") or zeile.get("DATE")
                          if wert and wert != "." and datum:
                              letzter = {
                                  "wert": float(wert),
                                  "einheit": "Prozent",
                                  "datum": datum,
                                  "quelle": f"FRED/{serie}"
                              }

                      if letzter is None:
                          raise ValueError(f"Keine gültigen Werte für {serie}")
                      return letzter
                  except Exception:
                      if versuch == 2:
                          raise
                      time.sleep(5)

          zins10 = abrufen("DGS10")
          zins2 = abrufen("DGS2")

          daten["zinsen"]["us_10y"] = zins10
          daten["zinsen"]["us_2y"] = zins2
          daten["zinsen"]["zinsdifferenz_10y_2y"] = {
              "wert": round(zins10["wert"] - zins2["wert"], 3),
              "einheit": "Prozentpunkte",
              "hinweis": "Differenz der jeweils letzten verfügbaren Beobachtungen"
          }

          daten["datenstand"] = datetime.now(
              ZoneInfo("Europe/Berlin")
          ).isoformat(timespec="seconds")
          daten["status"] = "teilweise_aktualisiert"
          daten["hinweis"] = (
              "US-Zinsen automatisch abgerufen. "
              "Weitere Marktindikatoren noch nicht angebunden."
          )

          datei.write_text(
              json.dumps(daten, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )

          print("10-jährige US-Zinsen:", zins10)
          print("2-jährige US-Zinsen:", zins2)
          PY

      - name: Daten speichern
        if: steps.zeit.outputs.ausfuehren == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add morgenroutine-data.json
          if ! git diff --cached --quiet; then
            git commit -m "Morgenroutine: US-Zinsen aktualisieren"
            git push
          fi
