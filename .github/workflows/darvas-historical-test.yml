
name: Bullwerk Darvas Historical Test

on:
  workflow_dispatch:

jobs:
  darvas-test:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pakete installieren
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance

      - name: Darvas V3 historisch testen
        shell: bash
        run: |
          python - <<'PY'
          import pandas as pd
          import yfinance as yf

          WINDOWS = [10, 15, 20, 30, 40, 60, 90, 120]

          TOUCH_TOLERANCE = 0.025
          MIN_TOUCH_GAP = 3
          BREAKOUT_BUFFER = 0.005

          MAX_WIDTH = 0.35
          MAX_NET_CHANGE = 0.12

          # Nach einem Ausbruch bleibt das Ereignis
          # sichtbar. Eine neue Box braucht neue Daten.
          BREAKOUT_HOLD_DAYS = 10
          MIN_NEW_BARS = 10

          TESTS = {
              "AMD": {
                  "start": "2024-01-01",
                  "end": "2024-03-15",
                  "reference": "2024-02-29",
              },
              "NVDA": {
                  "start": "2024-03-01",
                  "end": "2024-06-07",
                  "reference": "2024-05-23",
              },
          }

          def separated_touches(values, level):
              indices = [
                  i for i, value in enumerate(values)
                  if abs(float(value) / level - 1)
                  <= TOUCH_TOLERANCE
              ]

              count = 0
              last = -MIN_TOUCH_GAP

              for index in indices:
                  if index - last >= MIN_TOUCH_GAP:
                      count += 1
                      last = index

              return count

          def find_candidates(history):
              candidates = []

              for length in WINDOWS:
                  if len(history) < length:
                      continue

                  part = history.iloc[-length:]

                  upper = float(part["high"].max())
                  lower = float(part["low"].min())

                  if lower <= 0:
                      continue

                  width = upper / lower - 1

                  net_change = abs(
                      float(part["close"].iloc[-1])
                      / float(part["close"].iloc[0])
                      - 1
                  )

                  if width > MAX_WIDTH:
                      continue

                  if net_change > MAX_NET_CHANGE:
                      continue

                  upper_hits = separated_touches(
                      part["high"], upper
                  )

                  lower_hits = separated_touches(
                      part["low"], lower
                  )

                  if upper_hits < 1 or lower_hits < 1:
                      continue

                  confirmed = (
                      upper_hits >= 2
                      and lower_hits >= 2
                  )

                  candidates.append({
                      "score": 20 if confirmed else 10,
                      "length": length,
                      "upper": upper,
                      "lower": lower,
                      "width": width * 100,
                      "upper_hits": upper_hits,
                      "lower_hits": lower_hits,
                  })

              return candidates

          def select_boxes(candidates):
              confirmed = [
                  box for box in candidates
                  if box["score"] == 20
              ]

              if confirmed:
                  short = min(
                      confirmed,
                      key=lambda b: b["length"],
                  )

                  long = max(
                      confirmed,
                      key=lambda b: b["length"],
                  )

                  return short, long

              if candidates:
                  emerging = min(
                      candidates,
                      key=lambda b: b["length"],
                  )
                  return emerging, None

              return None, None

          def breakout(close, box):
              return close > (
                  box["upper"]
                  * (1 + BREAKOUT_BUFFER)
              )

          def failed(close, box):
              return close < (
                  box["lower"]
                  * (1 - BREAKOUT_BUFFER)
              )

          def box_text(box):
              if box is None:
                  return "keine"

              return (
                  f"{box['length']}T "
                  f"[{box['lower']:.2f} - "
                  f"{box['upper']:.2f}]"
                  f" Tests "
                  f"{box['lower_hits']}/"
                  f"{box['upper_hits']}"
              )

          def run_test(ticker, config):
              data = yf.download(
                  ticker,
                  start="2023-06-01",
                  end="2024-06-15",
                  auto_adjust=True,
                  progress=False,
                  threads=False,
              )

              if data.empty:
                  raise RuntimeError(
                      f"Keine Daten fuer {ticker}"
                  )

              if isinstance(data.columns, pd.MultiIndex):
                  data.columns = (
                      data.columns.get_level_values(0)
                  )

              data.columns = [
                  str(c).lower()
                  for c in data.columns
              ]

              data = data.dropna(
                  subset=["high", "low", "close"]
              )

              start = pd.Timestamp(config["start"])
              end = pd.Timestamp(config["end"])

              small_box = None
              large_box = None

              breakout_events = []
              failed_events = []

              last_breakout_index = -999999
              breakout_until = -1

              previous_signature = None
              events = []

              for i in range(len(data)):
                  day = data.index[i]

                  if day < start:
                      continue

                  if day > end:
                      break

                  close = float(
                      data["close"].iloc[i]
                  )

                  # 1. Bestehende Boxen zuerst
                  # gegen den aktuellen Schluss
                  # pruefen.
                  current_boxes = [
                      ("KLEIN", small_box),
                      ("GROSS", large_box),
                  ]

                  triggered = []
                  invalidated = []

                  for label, box in current_boxes:
                      if box is None:
                          continue

                      if breakout(close, box):
                          triggered.append(
                              (label, box.copy())
                          )
                      elif failed(close, box):
                          invalidated.append(
                              (label, box.copy())
                          )

                  for label, box in triggered:
                      breakout_events.append({
                          "date": str(day.date()),
                          "type": label,
                          "box": box.copy(),
                      })

                      if label == "KLEIN":
                          small_box = None
                      else:
                          large_box = None

                  for label, box in invalidated:
                      failed_events.append({
                          "date": str(day.date()),
                          "type": label,
                          "box": box.copy(),
                      })

                      if label == "KLEIN":
                          small_box = None
                      else:
                          large_box = None

                  if triggered:
                      last_breakout_index = i
                      breakout_until = (
                          i + BREAKOUT_HOLD_DAYS - 1
                      )

                  # 2. Neue Boxen nur nach
                  # ausreichend neuen Kerzen.
                  can_scan = (
                      i - last_breakout_index
                      >= MIN_NEW_BARS
                  )

                  if (
                      can_scan
                      and not triggered
                      and not invalidated
                  ):
                      # Nur abgeschlossene Vortage.
                      history = data.iloc[:i]

                      candidates = find_candidates(
                          history
                      )

                      candidate_small, candidate_large = (
                          select_boxes(candidates)
                      )

                      # Bestehende Grenzen nicht
                      # nachtraeglich veraendern.
                      if small_box is None:
                          if candidate_small is not None:
                              small_box = (
                                  candidate_small.copy()
                              )

                      if large_box is None:
                          if candidate_large is not None:
                              # Nur wirklich groessere
                              # Formation separat halten.
                              if (
                                  small_box is None
                                  or candidate_large["length"]
                                  > small_box["length"]
                              ):
                                  large_box = (
                                      candidate_large.copy()
                                  )

                  # 3. Status und Punkte.
                  if i <= breakout_until:
                      status = "BREAKOUT"
                      score = 20
                  elif (
                      small_box is not None
                      and small_box["score"] == 20
                  ) or (
                      large_box is not None
                      and large_box["score"] == 20
                  ):
                      status = "BOX ERKANNT"
                      score = 20
                  elif (
                      small_box is not None
                      or large_box is not None
                  ):
                      status = "BOX ENTSTEHT"
                      score = 10
                  elif invalidated:
                      status = "BOX GESCHEITERT"
                      score = 0
                  else:
                      status = "KEINE BOX"
                      score = 0

                  # Bei gleichem Status auch
                  # Boxwechsel protokollieren.
                  signature = (
                      status,
                      None if small_box is None else (
                          small_box["length"],
                          round(small_box["upper"], 2),
                          round(small_box["lower"], 2),
                      ),
                      None if large_box is None else (
                          large_box["length"],
                          round(large_box["upper"], 2),
                          round(large_box["lower"], 2),
                      ),
                  )

                  if (
                      signature != previous_signature
                      or triggered
                      or invalidated
                  ):
                      events.append({
                          "date": str(day.date()),
                          "status": status,
                          "score": score,
                          "small": (
                              small_box.copy()
                              if small_box else None
                          ),
                          "large": (
                              large_box.copy()
                              if large_box else None
                          ),
                          "triggered": triggered,
                          "invalidated": invalidated,
                      })

                  previous_signature = signature

              print("\n" + "=" * 75)
              print(f"BULLWERK DARVAS V3: {ticker}")
              print(
                  "REFERENZAUSBRUCH:",
                  config["reference"]
              )
              print("=" * 75)

              for event in events:
                  print(
                      f"{event['date']} | "
                      f"{event['status']:18} | "
                      f"{event['score']:2}/20"
                  )

                  print(
                      "   Kleine Box:",
                      box_text(event["small"])
                  )

                  print(
                      "   Grosse Box:",
                      box_text(event["large"])
                  )

                  for label, box in event["triggered"]:
                      print(
                          f"   >>> BREAKOUT {label}: "
                          f"{box_text(box)}"
                      )

                  for label, box in event["invalidated"]:
                      print(
                          f"   >>> GESCHEITERT {label}: "
                          f"{box_text(box)}"
                      )

              print("\nBREAKOUT-EREIGNISSE:")
              if not breakout_events:
                  print("Keine Breakouts erkannt.")

              for event in breakout_events:
                  print(
                      event["date"],
                      event["type"],
                      box_text(event["box"]),
                  )

              print("\nGESCH EITERTE BOXEN:")
              if not failed_events:
                  print("Keine gescheiterten Boxen.")

              for event in failed_events:
                  print(
                      event["date"],
                      event["type"],
                      box_text(event["box"]),
                  )

              print("\nREFERENZPRUEFUNG:")
              reference = config["reference"]

              matched = [
                  event
                  for event in breakout_events
                  if event["date"] == reference
              ]

              if matched:
                  print(
                      "Breakout am Referenztag erkannt:",
                      reference
                  )
              else:
                  print(
                      "Kein Breakout am Referenztag:",
                      reference
                  )

              print(
                  "Hinweis: V3 ist ein "
                  "historischer Prototyp."
              )

          for ticker, config in TESTS.items():
              run_test(ticker, config)

          print("\nDARVAS V3 TEST ABGESCHLOSSEN")
          PY
