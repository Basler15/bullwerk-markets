
name: Bullwerk Darvas Historical Test

on:
  workflow_dispatch:

jobs:
  darvas-test:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pakete installieren
        run: |
          python -m pip install pandas yfinance

      - name: Darvas V2 historisch testen
        shell: bash
        run: |
          python - <<'PY'
          import pandas as pd
          import yfinance as yf

          WINDOWS = [10, 15, 20, 30, 40, 60, 90]
          TOUCH_TOLERANCE = 0.025
          BREAKOUT_BUFFER = 0.005
          MAX_WIDTH = 0.30
          MAX_NET_CHANGE = 0.12
          MIN_TOUCH_GAP = 3
          BREAKOUT_HOLD_DAYS = 10

          TESTS = {
              "AMD": {
                  "start": "2024-01-01",
                  "end": "2024-03-15",
                  "reference": "2024-02-29",
              },
              "NVDA": {
                  "start": "2024-03-01",
                  "end": "2024-06-07",
                  "reference": "2024-05-23",
              },
          }

          def separated_touches(values, level):
              indices = [
                  i for i, value in enumerate(values)
                  if abs(float(value) / level - 1)
                  <= TOUCH_TOLERANCE
              ]

              count = 0
              last = -MIN_TOUCH_GAP

              for index in indices:
                  if index - last >= MIN_TOUCH_GAP:
                      count += 1
                      last = index

              return count

          def find_box(history):
              candidates = []

              for length in WINDOWS:
                  if len(history) < length:
                      continue

                  part = history.iloc[-length:]
                  upper = float(part["high"].max())
                  lower = float(part["low"].min())

                  if lower <= 0:
                      continue

                  width = upper / lower - 1
                  net_change = abs(
                      float(part["close"].iloc[-1])
                      / float(part["close"].iloc[0])
                      - 1
                  )

                  # Kein stark laufender Trend.
                  if width > MAX_WIDTH:
                      continue
                  if net_change > MAX_NET_CHANGE:
                      continue

                  upper_hits = separated_touches(
                      part["high"], upper
                  )
                  lower_hits = separated_touches(
                      part["low"], lower
                  )

                  if upper_hits < 1 or lower_hits < 1:
                      continue

                  confirmed = (
                      upper_hits >= 2
                      and lower_hits >= 2
                  )

                  candidates.append({
                      "score": 20 if confirmed else 10,
                      "length": length,
                      "upper": upper,
                      "lower": lower,
                      "width": width * 100,
                      "net_change": net_change * 100,
                      "upper_hits": upper_hits,
                      "lower_hits": lower_hits,
                  })

              if not candidates:
                  return None

              # Bestaetigte Grenzen zuerst,
              # danach mehr getrennte Beruehrungen.
              return max(
                  candidates,
                  key=lambda b: (
                      b["score"],
                      min(b["upper_hits"], 4)
                      + min(b["lower_hits"], 4),
                      b["length"],
                  ),
              )

          def run_test(ticker, config):
              data = yf.download(
                  ticker,
                  start="2023-06-01",
                  end="2024-06-15",
                  auto_adjust=True,
                  progress=False,
                  threads=False,
              )

              if data.empty:
                  raise RuntimeError(
                      f"Keine Daten fuer {ticker}"
                  )

              if isinstance(data.columns, pd.MultiIndex):
                  data.columns = (
                      data.columns.get_level_values(0)
                  )

              data.columns = [
                  str(c).lower() for c in data.columns
              ]

              data = data.dropna(
                  subset=["high", "low", "close"]
              )

              active_box = None
              breakout_until = None
              breakout_box = None
              previous_status = None
              events = []

              start = pd.Timestamp(config["start"])
              end = pd.Timestamp(config["end"])

              for i in range(len(data)):
                  day = data.index[i]

                  if day < start:
                      continue
                  if day > end:
                      break

                  close = float(
                      data["close"].iloc[i]
                  )

                  status = "KEINE BOX"
                  score = 0
                  box = None

                  # Bereits erkannter Ausbruch
                  # bleibt fuer 10 Handelstage
                  # sichtbar.
                  if breakout_until is not None:
                      if i <= breakout_until:
                          status = "BREAKOUT"
                          score = 20
                          box = breakout_box
                      else:
                          breakout_until = None
                          breakout_box = None

                  # Bestehende Box pruefen.
                  elif active_box is not None:
                      box = active_box

                      if close > (
                          box["upper"]
                          * (1 + BREAKOUT_BUFFER)
                      ):
                          status = "BREAKOUT"
                          score = 20
                          breakout_box = box.copy()
                          breakout_until = (
                              i + BREAKOUT_HOLD_DAYS - 1
                          )
                          active_box = None

                      elif close < (
                          box["lower"]
                          * (1 - BREAKOUT_BUFFER)
                      ):
                          status = "BOX GESCHEITERT"
                          score = 0
                          active_box = None

                      else:
                          status = "BOX ERKANNT"
                          score = 20

                  # Neue Box nur suchen, wenn
                  # weder aktive Box noch
                  # Breakout-Sperre besteht.
                  if (
                      active_box is None
                      and breakout_until is None
                      and status not in (
                          "BREAKOUT",
                          "BOX GESCHEITERT",
                      )
                  ):
                      # Nur abgeschlossene
                      # Vortage verwenden.
                      candidate = find_box(
                          data.iloc[:i]
                      )

                      if candidate is not None:
                          box = candidate

                          if candidate["score"] == 20:
                              active_box = (
                                  candidate.copy()
                              )
                              status = "BOX ERKANNT"
                              score = 20
                          else:
                              status = "BOX ENTSTEHT"
                              score = 10

                  if status != previous_status:
                      events.append({
                          "date": str(day.date()),
                          "status": status,
                          "score": score,
                          "box": box.copy()
                          if box else None,
                      })

                  previous_status = status

              print("\n" + "=" * 72)
              print(f"BULLWERK DARVAS V2: {ticker}")
              print(
                  "REFERENZAUSBRUCH:",
                  config["reference"]
              )
              print("=" * 72)

              for event in events:
                  box = event["box"]
                  detail = ""

                  if box:
                      detail = (
                          f" | {box['length']} Tage"
                          f" | Unten {box['lower']:.2f}"
                          f" | Oben {box['upper']:.2f}"
                          f" | Breite {box['width']:.1f}%"
                          f" | Tests "
                          f"{box['lower_hits']}/"
                          f"{box['upper_hits']}"
                      )

                  print(
                      f"{event['date']} | "
                      f"{event['status']:18} | "
                      f"{event['score']:2}/20"
                      f"{detail}"
                  )

              reference = config["reference"]

              before = [
                  event for event in events
                  if event["status"] == "BOX ERKANNT"
                  and event["date"] < reference
              ]

              print("\nERGEBNIS:")
              if before:
                  print(
                      "Erste bestaetigte Box:",
                      before[0]["date"]
                  )
              else:
                  print(
                      "Keine bestaetigte Box "
                      "vor Referenzausbruch."
                  )

              print(
                  "Hinweis: Historischer "
                  "Prototyp, keine validierten "
                  "Handelssignale."
              )

          for ticker, config in TESTS.items():
              run_test(ticker, config)

          print("\nDARVAS V2 TEST ABGESCHLOSSEN")
          PY
