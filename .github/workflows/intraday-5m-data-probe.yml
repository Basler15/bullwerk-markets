name: Bullwerk 5m Data Probe (isolated)

on:
  workflow_dispatch:
  # One-time intended test: 20 Oct 2026 at 16:00 Europe/Berlin (14:00 UTC).
  # GitHub scheduled jobs may start late. The date gate below prevents later runs.
  schedule:
    - cron: "0 14 * * *"

permissions:
  contents: read

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 14 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Only run scheduled probe on 20 October 2026
        id: date_gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$(date -u +%Y-%m-%d)" = "2026-10-20" ]; then
            echo "run_probe=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_probe=false" >> "$GITHUB_OUTPUT"
            echo "One-time test date has passed; no data requests."
          fi
      - name: Checkout repository
        if: steps.date_gate.outputs.run_probe == 'true'
        uses: actions/checkout@v4
      - name: Set up Python
        if: steps.date_gate.outputs.run_probe == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        if: steps.date_gate.outputs.run_probe == 'true'
        run: python -m pip install yfinance pandas
      - name: Check 5-minute OHLCV for PLTR and NVDA
        if: steps.date_gate.outputs.run_probe == 'true'
        run: python tests/intraday_5m_data_probe.py
