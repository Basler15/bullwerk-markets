
name: Bullwerk Gesamtscanner V1.1

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bullwerk-score-history
  cancel-in-progress: false

jobs:
  gesamtscanner:
    name: Bullwerk Aktien pruefen
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pakete installieren
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests yfinance

      - name: Scanner-Dateien pruefen
        run: |
          python -m compileall -q main.py scanner
          python -c "from scanner.fundamental import get_fundamental_data; from scanner.price_momentum import calculate_price_momentum; from scanner.trend import calculate_trend_quality; from scanner.darvas import detect_darvas_box; from scanner.breakout import detect_breakout; from scanner.score_history import record_scores, get_score_change; print('Alle Scanner-Module importiert')"

      - name: Bullwerk Gesamtscanner starten
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          python main.py

      - name: Ergebnisse kontrollieren
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/scanner_results.json")
          assert path.exists(), "Ergebnisdatei fehlt"

          history_path = Path("data/score_history.json")
          assert history_path.exists(), "Score-Historie fehlt"

          data = json.loads(
              path.read_text(encoding="utf-8")
          )

          history = json.loads(
              history_path.read_text(encoding="utf-8")
          )

          stocks = data.get("stocks", [])
          errors = data.get("errors", [])

          print("\nBULLWERK ERGEBNISKONTROLLE")
          print("=" * 55)

          for stock in stocks:
              symbol = stock["symbol"]
              score = stock["quality_score"]
              status = stock["classification"]
              early = stock.get(
                  "early_bull_status"
              )

              print(
                  f"{symbol:6} "
                  f"Score: {str(score):6} "
                  f"Status: {status:15} "
                  f"Fruehbulle: {early}"
              )

              if score is not None:
                  assert 0 <= score <= 100
                  assert symbol in history
                  assert (
                      stock["as_of"]
                      in history[symbol]
                  )

          print("\nErfolgreich:", len(stocks))
          print("Fehler:", len(errors))

          for error in errors:
              print("FEHLER:", error)

          assert len(stocks) > 0, (
              "Keine Aktie erfolgreich ausgewertet"
          )

          print("\nERGEBNISKONTROLLE BESTANDEN")
          PY

      - name: Score-Historie dauerhaft speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/score_history.json

          if git diff --cached --quiet; then
            echo "Keine neue Score-Historie vorhanden."
          else
            git commit -m "Update Bullwerk score history"
            git push
            echo "Score-Historie dauerhaft gespeichert."
          fi

      - name: Scanner-Ergebnisse bereitstellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bullwerk-scanner-ergebnisse
          path: |
            data/scanner_results.json
            data/score_history.json
          if-no-files-found: warn
          retention-days: 7
