name: Bullwerk Orders Backlog Test V4

on:
  workflow_dispatch:

jobs:
  orders-backlog-test:
    runs-on: ubuntu-latest

    steps:
      - name: Test Orders and Backlog V4
        shell: python
        run: |
          import requests
          import re
          import time
          from html import unescape

          # ============================================================
          # BULLWERK MARKETS
          # ORDERS / BACKLOG TEST V4
          #
          # V4:
          # - sucht spezifische Backlog-/RPO-Kennzahlen
          # - extrahiert absolute Geldwerte
          # - vergleicht neuere mit älteren SEC-Filings
          # - keine Bewertung aus allgemeinen positiven Wörtern
          #
          # 3/3 = starke Verbesserung
          # 2/3 = stabil / moderat positiv
          # 1/3 = moderate Verschlechterung
          # 0/3 = starke Verschlechterung
          # N/A = keine belastbare Vergleichsbasis
          # ============================================================

          COMPANIES = {
              "NVDA": "0001045810",
              "MSFT": "0000789019",
              "AVGO": "0001730168",
              "MU":   "0000723125",
              "ORCL": "0001341439",
              "AAPL": "0000320193",
          }

          HEADERS = {
              "User-Agent":
                  "Bullwerk Markets contact: bullwerkmarkets@gmail.com",
              "Accept-Encoding": "gzip, deflate",
          }

          # ------------------------------------------------------------
          # Nur konkrete Kennzahlen
          # ------------------------------------------------------------

          METRICS = {
              "RPO": [
                  "remaining performance obligations",
                  "remaining performance obligation",
              ],

              "BACKLOG": [
                  "order backlog",
                  "contracted backlog",
                  "backlog",
              ],

              "BOOKINGS": [
                  "bookings",
              ],
          }

          # ============================================================
          # HTML -> TEXT
          # ============================================================

          def clean_html(html):

              html = re.sub(
                  r"(?is)<script.*?>.*?</script>",
                  " ",
                  html
              )

              html = re.sub(
                  r"(?is)<style.*?>.*?</style>",
                  " ",
                  html
              )

              html = re.sub(
                  r"(?i)<br\s*/?>",
                  ". ",
                  html
              )

              html = re.sub(
                  r"(?i)</(?:p|div|tr|li|h1|h2|h3|td)>",
                  ". ",
                  html
              )

              html = re.sub(
                  r"(?is)<[^>]+>",
                  " ",
                  html
              )

              text = unescape(html)

              text = text.replace(
                  "\xa0",
                  " "
              )

              text = re.sub(
                  r"\s+",
                  " ",
                  text
              )

              return text.strip()

          # ============================================================
          # ZAHLEN NORMALISIEREN
          # ============================================================

          def money_to_billions(
              number,
              unit
          ):

              try:
                  value = float(
                      number.replace(",", "")
                  )

              except:
                  return None

              unit = unit.lower()

              if unit in (
                  "billion",
                  "billions"
              ):
                  return value

              if unit in (
                  "million",
                  "millions"
              ):
                  return value / 1000.0

              if unit in (
                  "trillion",
                  "trillions"
              ):
                  return value * 1000.0

              return None

          # ============================================================
          # PASSAGEN FINDEN
          # ============================================================

          def find_metric_passages(text):

              sentences = re.split(
                  r"(?<=[.!?])\s+",
                  text
              )

              results = []

              for i, sentence in enumerate(sentences):

                  lower = sentence.lower()

                  found_metric = None

                  for metric, terms in METRICS.items():

                      if any(
                          term in lower
                          for term in terms
                      ):
                          found_metric = metric
                          break

                  if not found_metric:
                      continue

                  start = max(
                      0,
                      i - 1
                  )

                  end = min(
                      len(sentences),
                      i + 2
                  )

                  passage = " ".join(
                      sentences[start:end]
                  ).strip()

                  if (
                      len(passage) >= 40
                      and
                      len(passage) <= 3000
                  ):

                      results.append({
                          "metric":
                              found_metric,
                          "text":
                              passage
                      })

              return results

          # ============================================================
          # GELDWERTE EXTRAHIEREN
          # ============================================================

          def extract_money_values(passage):

              text = passage["text"]

              values = []

              patterns = [

                  # $12.3 billion
                  r"\$\s*([0-9]+(?:\.[0-9]+)?)\s*"
                  r"(billion|billions|million|millions|"
                  r"trillion|trillions)",

                  # 12.3 billion dollars
                  r"([0-9]+(?:\.[0-9]+)?)\s*"
                  r"(billion|billions|million|millions|"
                  r"trillion|trillions)\s+"
                  r"(?:U\.S\.\s*)?dollars",
              ]

              for pattern in patterns:

                  for match in re.finditer(
                      pattern,
                      text,
                      flags=re.I
                  ):

                      number = match.group(1)
                      unit = match.group(2)

                      value = money_to_billions(
                          number,
                          unit
                      )

                      if value is None:
                          continue

                      values.append({
                          "value_bn":
                              value,
                          "raw":
                              match.group(0)
                      })

              return values

          # ============================================================
          # BESTEN METRIK-WERT AUS PASSAGE WÄHLEN
          # ============================================================

          def choose_metric_value(
              metric,
              passage_text,
              values
          ):

              if not values:
                  return None

              lower = passage_text.lower()

              # --------------------------------------------------------
              # Schutz vor häufigen RPO-Fehlern:
              #
              # SEC-Texte nennen oft:
              # - gesamten RPO
              # - davon erwartete Recognition in 12 Monaten
              #
              # Wir wollen möglichst den GESAMTWERT.
              # --------------------------------------------------------

              filtered = []

              for item in values:

                  raw_lower = item[
                      "raw"
                  ].lower()

                  pos = lower.find(
                      raw_lower
                  )

                  if pos == -1:
                      filtered.append(
                          item
                      )
                      continue

                  context_start = max(
                      0,
                      pos - 180
                  )

                  context_end = min(
                      len(lower),
                      pos + 180
                  )

                  context = lower[
                      context_start:
                      context_end
                  ]

                  recognition_words = [
                      "recognized",
                      "recognize",
                      "recognition",
                      "next twelve months",
                      "next 12 months",
                      "over the next",
                  ]

                  if any(
                      word in context
                      for word in recognition_words
                  ):
                      # Nicht sofort löschen:
                      # nur schwächer priorisieren.
                      item = dict(item)
                      item[
                          "recognition_context"
                      ] = True

                  else:
                      item = dict(item)
                      item[
                          "recognition_context"
                      ] = False

                  filtered.append(
                      item
                  )

              preferred = [
                  item
                  for item in filtered
                  if not item.get(
                      "recognition_context",
                      False
                  )
              ]

              if preferred:
                  candidates = preferred

              else:
                  candidates = filtered

              if not candidates:
                  return None

              # Bei mehreren Werten nehmen wir zunächst
              # den größten plausiblen Gesamtwert.
              # Das verhindert häufig, dass ein Teilbetrag
              # statt Gesamt-RPO gewählt wird.
              best = max(
                  candidates,
                  key=lambda x:
                      x["value_bn"]
              )

              return best

          # ============================================================
          # FILING ANALYSIEREN
          # ============================================================

          def analyse_text(text):

              passages = (
                  find_metric_passages(
                      text
                  )
              )

              candidates = []

              for passage in passages:

                  values = (
                      extract_money_values(
                          passage
                      )
                  )

                  chosen = (
                      choose_metric_value(
                          passage[
                              "metric"
                          ],
                          passage[
                              "text"
                          ],
                          values
                      )
                  )

                  if chosen:

                      candidates.append({
                          "metric":
                              passage[
                                  "metric"
                              ],
                          "value_bn":
                              chosen[
                                  "value_bn"
                              ],
                          "raw":
                              chosen[
                                  "raw"
                              ],
                          "passage":
                              passage[
                                  "text"
                              ]
                      })

              # --------------------------------------------------------
              # Pro Metrik nur einen Wert verwenden.
              # --------------------------------------------------------

              best_by_metric = {}

              for candidate in candidates:

                  metric = candidate[
                      "metric"
                  ]

                  if metric not in best_by_metric:

                      best_by_metric[
                          metric
                      ] = candidate

                  else:

                      # Größeren Wert bevorzugen,
                      # weil Gesamt-RPO/Backlog oft größer
                      # als Teilbeträge ist.
                      if (
                          candidate[
                              "value_bn"
                          ]
                          >
                          best_by_metric[
                              metric
                          ][
                              "value_bn"
                          ]
                      ):
                          best_by_metric[
                              metric
                          ] = candidate

              return best_by_metric

          # ============================================================
          # SEC SUBMISSIONS
          # ============================================================

          def load_submissions(cik):

              url = (
                  "https://data.sec.gov/"
                  f"submissions/CIK{cik}.json"
              )

              response = requests.get(
                  url,
                  headers=HEADERS,
                  timeout=30
              )

              print(
                  "SEC Submissions HTTP:",
                  response.status_code
              )

              if response.status_code != 200:
                  return []

              data = response.json()

              recent = (
                  data
                  .get("filings", {})
                  .get("recent", {})
              )

              forms = recent.get(
                  "form",
                  []
              )

              accessions = recent.get(
                  "accessionNumber",
                  []
              )

              documents = recent.get(
                  "primaryDocument",
                  []
              )

              dates = recent.get(
                  "filingDate",
                  []
              )

              filings = []

              # --------------------------------------------------------
              # V4 konzentriert sich auf 10-Q / 10-K.
              #
              # 8-K lassen wir bewusst weg.
              # Dort hatten V2/V3 zu viel Rauschen.
              # --------------------------------------------------------

              for (
                  form,
                  accession,
                  document,
                  filing_date
              ) in zip(
                  forms,
                  accessions,
                  documents,
                  dates
              ):

                  if form not in (
                      "10-Q",
                      "10-K"
                  ):
                      continue

                  filings.append({
                      "form":
                          form,
                      "accession":
                          accession,
                      "document":
                          document,
                      "filing_date":
                          filing_date
                  })

                  # Mehrere Quartale nötig,
                  # damit ein Vergleich möglich ist.
                  if len(filings) >= 8:
                      break

              return filings

          # ============================================================
          # SEC DOKUMENT LADEN
          # ============================================================

          def load_document(
              cik,
              filing
          ):

              accession = (
                  filing[
                      "accession"
                  ].replace(
                      "-",
                      ""
                  )
              )

              cik_number = str(
                  int(cik)
              )

              url = (
                  "https://www.sec.gov/"
                  "Archives/edgar/data/"
                  f"{cik_number}/"
                  f"{accession}/"
                  f"{filing['document']}"
              )

              response = requests.get(
                  url,
                  headers=HEADERS,
                  timeout=30
              )

              print(
                  filing[
                      "filing_date"
                  ],
                  "|",
                  filing[
                      "form"
                  ],
                  "| HTTP",
                  response.status_code
              )

              if response.status_code != 200:
                  return None

              text = clean_html(
                  response.text
              )

              metrics = analyse_text(
                  text
              )

              return {
                  "filing_date":
                      filing[
                          "filing_date"
                      ],
                  "form":
                      filing[
                          "form"
                      ],
                  "metrics":
                      metrics
              }

          # ============================================================
          # VERGLEICH ZWEIER WERTE
          # ============================================================

          def compare_values(
              current,
              previous
          ):

              if (
                  current is None
                  or previous is None
                  or previous <= 0
              ):
                  return None

              change = (
                  (
                      current
                      / previous
                  )
                  - 1
              ) * 100

              return change

          # ============================================================
          # BULLWERK SCORE
          # ============================================================

          def bullwerk_score(change):

              if change is None:

                  return {
                      "score":
                          None,
                      "status":
                          "N/A"
                  }

              # Starkes Wachstum
              if change >= 15:

                  return {
                      "score":
                          3,
                      "status":
                          "STRONG_POSITIVE"
                  }

              # Moderates Wachstum
              if change >= 5:

                  return {
                      "score":
                          3,
                      "status":
                          "POSITIVE"
                  }

              # Stabil / leicht positiv
              if change >= -5:

                  return {
                      "score":
                          2,
                      "status":
                          "STABLE"
                  }

              # Moderate Verschlechterung
              if change >= -15:

                  return {
                      "score":
                          1,
                      "status":
                          "CAUTIOUS"
                  }

              # Deutliche Verschlechterung
              return {
                  "score":
                      0,
                  "status":
                      "WEAKER"
              }

          # ============================================================
          # HAUPTLAUF
          # ============================================================

          for ticker, cik in COMPANIES.items():

              print("")
              print("=" * 90)

              print(
                  "BULLWERK ORDERS/BACKLOG V4:",
                  ticker
              )

              print("=" * 90)

              try:

                  filings = (
                      load_submissions(
                          cik
                      )
                  )

                  results = []

                  for filing in filings:

                      result = (
                          load_document(
                              cik,
                              filing
                          )
                      )

                      if result is None:
                          continue

                      results.append(
                          result
                      )

                      print(
                          "Gefundene Kennzahlen:"
                      )

                      if not result[
                          "metrics"
                      ]:

                          print(
                              "  keine"
                          )

                      for (
                          metric,
                          data
                      ) in result[
                          "metrics"
                      ].items():

                          print(
                              " ",
                              metric,
                              "=",
                              round(
                                  data[
                                      "value_bn"
                                  ],
                                  3
                              ),
                              "Mrd. USD",
                              "|",
                              data[
                                  "raw"
                              ]
                          )

                      time.sleep(0.2)

                  print("")
                  print(
                      "--- BULLWERK ERGEBNIS ---"
                  )

                  # ----------------------------------------------------
                  # Für jede Metrik chronologisch nach zwei
                  # vergleichbaren Werten suchen.
                  # ----------------------------------------------------

                  comparisons = []

                  for metric in (
                      "RPO",
                      "BACKLOG",
                      "BOOKINGS"
                  ):

                      observations = []

                      for result in results:

                          if (
                              metric
                              in result[
                                  "metrics"
                              ]
                          ):

                              observations.append({
                                  "date":
                                      result[
                                          "filing_date"
                                      ],
                                  "form":
                                      result[
                                          "form"
                                      ],
                                  "value":
                                      result[
                                          "metrics"
                                      ][
                                          metric
                                      ][
                                          "value_bn"
                                      ]
                              })

                      # Results kommen neu -> alt.
                      if len(
                          observations
                      ) >= 2:

                          current = (
                              observations[0]
                          )

                          previous = (
                              observations[1]
                          )

                          change = (
                              compare_values(
                                  current[
                                      "value"
                                  ],
                                  previous[
                                      "value"
                                  ]
                              )
                          )

                          if change is not None:

                              score_data = (
                                  bullwerk_score(
                                      change
                                  )
                              )

                              comparisons.append({
                                  "metric":
                                      metric,
                                  "current":
                                      current,
                                  "previous":
                                      previous,
                                  "change":
                                      change,
                                  "score":
                                      score_data[
                                          "score"
                                      ],
                                  "status":
                                      score_data[
                                          "status"
                                      ]
                              })

                  if not comparisons:

                      print(
                          "ORDERS/BACKLOG SCORE: N/A"
                      )

                      print(
                          "STATUS: N/A"
                      )

                      print(
                          "GRUND: Keine zwei "
                          "vergleichbaren Backlog-, "
                          "RPO- oder Bookings-Werte "
                          "gefunden."
                      )

                  else:

                      # ------------------------------------------------
                      # Priorität:
                      # BACKLOG > BOOKINGS > RPO
                      #
                      # Backlog/Bookings sind für unsere
                      # Fundamental-Momentum-Idee meist direkter.
                      # RPO bleibt wertvoll, aber ist bei Software-
                      # Unternehmen etwas anders zu interpretieren.
                      # ------------------------------------------------

                      priority = {
                          "BACKLOG": 3,
                          "BOOKINGS": 2,
                          "RPO": 1,
                      }

                      comparisons.sort(
                          key=lambda x:
                              priority[
                                  x[
                                      "metric"
                                  ]
                              ],
                          reverse=True
                      )

                      best = comparisons[0]

                      print(
                          "METRIK:",
                          best[
                              "metric"
                          ]
                      )

                      print(
                          "AKTUELL:",
                          round(
                              best[
                                  "current"
                              ][
                                  "value"
                              ],
                              3
                          ),
                          "Mrd. USD",
                          "| Filing:",
                          best[
                              "current"
                          ][
                              "date"
                          ]
                      )

                      print(
                          "VORHER:",
                          round(
                              best[
                                  "previous"
                              ][
                                  "value"
                              ],
                              3
                          ),
                          "Mrd. USD",
                          "| Filing:",
                          best[
                              "previous"
                          ][
                              "date"
                          ]
                      )

                      print(
                          "VERÄNDERUNG:",
                          f"{best['change']:+.1f}%"
                      )

                      print(
                          "ORDERS/BACKLOG SCORE:",
                          f"{best['score']}/3"
                      )

                      print(
                          "STATUS:",
                          best[
                              "status"
                          ]
                      )

                      print("")
                      print(
                          "ALLE VERGLEICHE:"
                      )

                      for comp in comparisons:

                          print(
                              comp[
                                  "metric"
                              ],
                              "|",
                              f"{comp['change']:+.1f}%",
                              "|",
                              f"{comp['score']}/3",
                              "|",
                              comp[
                                  "status"
                              ]
                          )

              except Exception as error:

                  print(
                      "FEHLER:",
                      repr(error)
                  )

              print("")
              print(
                  ticker,
                  "abgeschlossen."
              )

              time.sleep(0.5)

          print("")
          print("=" * 90)
          print(
              "Bullwerk Orders/Backlog Test V4 beendet."
          )
          print(
              "V4 vergleicht konkrete Kennzahlen "
              "zwischen SEC-Filings."
          )
          print(
              "Keine belastbare Vergleichsbasis = N/A."
          )
          print("=" * 90)
