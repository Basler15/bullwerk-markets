name: Bullwerk Orders Backlog Test V3

on:
  workflow_dispatch:

jobs:
  orders-backlog-test:
    runs-on: ubuntu-latest

    steps:
      - name: Test Orders and Backlog V3
        shell: python
        run: |
          import requests
          import re
          import time
          from html import unescape

          # ============================================================
          # BULLWERK MARKETS
          # ORDERS / BACKLOG TEST V3
          #
          # Ziel:
          # Nur belastbare Orders-/Backlog-Signale aus SEC-Unterlagen.
          #
          # 3/3 = deutlich positiv
          # 2/3 = stabil / moderat positiv
          # 1/3 = leichter Gegenwind
          # 0/3 = klar negativ
          # N/A = nicht zuverlässig bewertbar
          #
          # WICHTIG:
          # N/A wird NICHT als 0 gewertet.
          # ============================================================

          COMPANIES = {
              "NVDA": "0001045810",
              "MSFT": "0000789019",
              "AVGO": "0001730168",
              "MU":   "0000723125",
              "ORCL": "0001341439",
              "AAPL": "0000320193",
          }

          HEADERS = {
              "User-Agent":
                  "Bullwerk Markets contact: bullwerkmarkets@gmail.com",
              "Accept-Encoding": "gzip, deflate",
          }

          # ------------------------------------------------------------
          # V3: NUR SPEZIFISCHE BEGRIFFE
          #
          # Das allgemeine Wort "orders" ist bewusst NICHT enthalten.
          # ------------------------------------------------------------

          METRICS = [
              "order backlog",
              "backlog",
              "bookings",
              "book-to-bill",
              "remaining performance obligations",
              "remaining performance obligation",
              "contracted backlog",
          ]

          # ============================================================
          # HTML -> TEXT
          # ============================================================

          def clean_html(html):

              html = re.sub(
                  r"(?is)<script.*?>.*?</script>",
                  " ",
                  html
              )

              html = re.sub(
                  r"(?is)<style.*?>.*?</style>",
                  " ",
                  html
              )

              html = re.sub(
                  r"(?i)<br\s*/?>",
                  ". ",
                  html
              )

              html = re.sub(
                  r"(?i)</(?:p|div|tr|li|h1|h2|h3)>",
                  ". ",
                  html
              )

              html = re.sub(
                  r"(?is)<[^>]+>",
                  " ",
                  html
              )

              text = unescape(html)

              text = text.replace(
                  "\xa0",
                  " "
              )

              text = re.sub(
                  r"\s+",
                  " ",
                  text
              )

              return text.strip()

          # ============================================================
          # RELEVANTE PASSAGEN
          # ============================================================

          def find_relevant_passages(text):

              passages = []

              # Etwas größere Textstücke als nur einzelne Sätze.
              chunks = re.split(
                  r"(?<=[.!?])\s+",
                  text
              )

              for i, sentence in enumerate(chunks):

                  lower = sentence.lower()

                  if not any(
                      metric in lower
                      for metric in METRICS
                  ):
                      continue

                  # Vorheriger + aktueller + nächster Satz
                  start = max(
                      0,
                      i - 1
                  )

                  end = min(
                      len(chunks),
                      i + 2
                  )

                  passage = " ".join(
                      chunks[start:end]
                  ).strip()

                  if (
                      40
                      <= len(passage)
                      <= 2500
                  ):
                      passages.append(
                          passage
                      )

              # Duplikate entfernen
              unique = []
              seen = set()

              for passage in passages:

                  key = passage.lower()

                  if key not in seen:

                      seen.add(key)
                      unique.append(
                          passage
                      )

              return unique[:15]

          # ============================================================
          # DIREKTE VERÄNDERUNGEN
          # ============================================================

          def extract_direction(passage):

              lower = passage.lower()

              signals = []

              # --------------------------------------------------------
              # Prozentuale Veränderungen
              # --------------------------------------------------------

              positive_patterns = [
                  r"(?:backlog|bookings|remaining performance obligations)"
                  r".{0,180}?"
                  r"(?:increased|grew|rose|were up|was up)"
                  r".{0,80}?"
                  r"(\d+(?:\.\d+)?)\s*%",

                  r"(?:increased|grew|rose)"
                  r".{0,80}?"
                  r"(\d+(?:\.\d+)?)\s*%"
                  r".{0,180}?"
                  r"(?:backlog|bookings|remaining performance obligations)"
              ]

              negative_patterns = [
                  r"(?:backlog|bookings|remaining performance obligations)"
                  r".{0,180}?"
                  r"(?:decreased|declined|fell|were down|was down)"
                  r".{0,80}?"
                  r"(\d+(?:\.\d+)?)\s*%",

                  r"(?:decreased|declined|fell)"
                  r".{0,80}?"
                  r"(\d+(?:\.\d+)?)\s*%"
                  r".{0,180}?"
                  r"(?:backlog|bookings|remaining performance obligations)"
              ]

              for pattern in positive_patterns:

                  match = re.search(
                      pattern,
                      passage,
                      flags=re.I
                  )

                  if match:

                      value = float(
                          match.group(1)
                      )

                      signals.append({
                          "type":
                              "PERCENT_CHANGE",
                          "direction":
                              "POSITIVE",
                          "change":
                              value,
                          "strength":
                              score_change(value)
                      })

              for pattern in negative_patterns:

                  match = re.search(
                      pattern,
                      passage,
                      flags=re.I
                  )

                  if match:

                      value = float(
                          match.group(1)
                      )

                      signals.append({
                          "type":
                              "PERCENT_CHANGE",
                          "direction":
                              "NEGATIVE",
                          "change":
                              -value,
                          "strength":
                              -score_change(value)
                      })

              # --------------------------------------------------------
              # Explizite YoY / year-over-year Formulierungen
              # --------------------------------------------------------

              yoy_patterns = [
                  (
                      "POSITIVE",
                      r"(?:backlog|bookings|remaining performance obligations)"
                      r".{0,200}?"
                      r"(?:year.over.year|year over year|yoy)"
                      r".{0,100}?"
                      r"(?:increased|grew|rose|up)"
                      r".{0,60}?"
                      r"(\d+(?:\.\d+)?)\s*%"
                  ),

                  (
                      "NEGATIVE",
                      r"(?:backlog|bookings|remaining performance obligations)"
                      r".{0,200}?"
                      r"(?:year.over.year|year over year|yoy)"
                      r".{0,100}?"
                      r"(?:decreased|declined|fell|down)"
                      r".{0,60}?"
                      r"(\d+(?:\.\d+)?)\s*%"
                  )
              ]

              for direction, pattern in yoy_patterns:

                  match = re.search(
                      pattern,
                      passage,
                      flags=re.I
                  )

                  if match:

                      value = float(
                          match.group(1)
                      )

                      signed = (
                          value
                          if direction == "POSITIVE"
                          else -value
                      )

                      strength = (
                          score_change(value)
                          if direction == "POSITIVE"
                          else -score_change(value)
                      )

                      signals.append({
                          "type":
                              "YOY_CHANGE",
                          "direction":
                              direction,
                          "change":
                              signed,
                          "strength":
                              strength
                      })

              return signals

          # ============================================================
          # STÄRKE DER VERÄNDERUNG
          # ============================================================

          def score_change(value):

              if value >= 15:
                  return 3

              if value >= 5:
                  return 2

              if value > 0:
                  return 1

              return 0

          # ============================================================
          # TEXTUELLE RICHTUNG
          #
          # Nur verwenden, wenn der relevante Begriff UND eine
          # eindeutige Entwicklungsformulierung eng zusammenstehen.
          # ============================================================

          def textual_signal(passage):

              lower = passage.lower()

              positive_patterns = [
                  r"(?:record|strong|growing|increased|higher|expanded)"
                  r".{0,80}?"
                  r"(?:backlog|bookings)",

                  r"(?:backlog|bookings)"
                  r".{0,80}?"
                  r"(?:record|strong|growing|increased|higher|expanded)",

                  r"(?:remaining performance obligations)"
                  r".{0,80}?"
                  r"(?:increased|grew|higher|expanded)"
              ]

              negative_patterns = [
                  r"(?:declining|decreased|lower|weaker|reduced)"
                  r".{0,80}?"
                  r"(?:backlog|bookings)",

                  r"(?:backlog|bookings)"
                  r".{0,80}?"
                  r"(?:declining|decreased|lower|weaker|reduced)",

                  r"(?:remaining performance obligations)"
                  r".{0,80}?"
                  r"(?:declined|decreased|lower|reduced)"
              ]

              positive = any(
                  re.search(
                      pattern,
                      lower
                  )
                  for pattern
                  in positive_patterns
              )

              negative = any(
                  re.search(
                      pattern,
                      lower
                  )
                  for pattern
                  in negative_patterns
              )

              if positive and not negative:

                  return {
                      "type":
                          "TEXT_DIRECTION",
                      "direction":
                          "POSITIVE",
                      "change":
                          None,
                      "strength":
                          1
                  }

              if negative and not positive:

                  return {
                      "type":
                          "TEXT_DIRECTION",
                      "direction":
                          "NEGATIVE",
                      "change":
                          None,
                      "strength":
                          -1
                  }

              return None

          # ============================================================
          # FILING BEWERTEN
          # ============================================================

          def evaluate_passages(passages):

              signals = []

              for passage in passages:

                  numeric = (
                      extract_direction(
                          passage
                      )
                  )

                  signals.extend(
                      numeric
                  )

                  # Textsignal nur ergänzen, wenn
                  # keine numerische Aussage erkannt wurde.
                  if not numeric:

                      text_signal = (
                          textual_signal(
                              passage
                          )
                      )

                      if text_signal:

                          signals.append(
                              text_signal
                          )

              if not signals:

                  return {
                      "score":
                          None,
                      "status":
                          "N/A",
                      "reason":
                          "Keine belastbare Veränderung von "
                          "Orders/Backlog/RPO gefunden.",
                      "signals":
                          []
                  }

              positive = [
                  s
                  for s in signals
                  if s["strength"] > 0
              ]

              negative = [
                  s
                  for s in signals
                  if s["strength"] < 0
              ]

              strongest_positive = max(
                  [
                      s["strength"]
                      for s in positive
                  ],
                  default=0
              )

              strongest_negative = min(
                  [
                      s["strength"]
                      for s in negative
                  ],
                  default=0
              )

              # --------------------------------------------------------
              # Konfliktprüfung
              # --------------------------------------------------------

              if positive and negative:

                  raw = (
                      strongest_positive
                      + strongest_negative
                  )

                  if raw >= 2:

                      return {
                          "score":
                              3,
                          "status":
                              "STRONG_POSITIVE",
                          "reason":
                              "Positive Orders-/Backlog-Signale "
                              "überwiegen deutlich.",
                          "signals":
                              signals
                      }

                  if raw >= 0:

                      return {
                          "score":
                              2,
                          "status":
                              "MIXED_TO_POSITIVE",
                          "reason":
                              "Gemischte Signale, insgesamt "
                              "stabil bis positiv.",
                          "signals":
                              signals
                      }

                  if raw >= -2:

                      return {
                          "score":
                              1,
                          "status":
                              "CAUTIOUS",
                          "reason":
                              "Gemischte Signale mit "
                              "überwiegendem Gegenwind.",
                          "signals":
                              signals
                      }

                  return {
                      "score":
                          0,
                      "status":
                          "WEAKER",
                      "reason":
                          "Negative Orders-/Backlog-Signale "
                          "überwiegen deutlich.",
                      "signals":
                          signals
                  }

              # --------------------------------------------------------
              # Nur positive Signale
              # --------------------------------------------------------

              if positive:

                  if strongest_positive >= 3:

                      score = 3
                      status = "STRONG_POSITIVE"
                      reason = (
                          "Orders/Backlog zeigen "
                          "deutliches Wachstum."
                      )

                  elif strongest_positive >= 2:

                      score = 3
                      status = "POSITIVE"
                      reason = (
                          "Orders/Backlog entwickeln "
                          "sich klar positiv."
                      )

                  else:

                      score = 2
                      status = "STABLE_TO_POSITIVE"
                      reason = (
                          "Orders/Backlog zeigen "
                          "eine moderate positive Entwicklung."
                      )

                  return {
                      "score":
                          score,
                      "status":
                          status,
                      "reason":
                          reason,
                      "signals":
                          signals
                  }

              # --------------------------------------------------------
              # Nur negative Signale
              # --------------------------------------------------------

              if negative:

                  if strongest_negative <= -3:

                      score = 0
                      status = "WEAKER"
                      reason = (
                          "Orders/Backlog haben sich "
                          "deutlich verschlechtert."
                      )

                  else:

                      score = 1
                      status = "CAUTIOUS"
                      reason = (
                          "Orders/Backlog zeigen "
                          "leichten bis moderaten Gegenwind."
                      )

                  return {
                      "score":
                          score,
                      "status":
                          status,
                      "reason":
                          reason,
                      "signals":
                          signals
                  }

              return {
                  "score":
                      None,
                  "status":
                      "N/A",
                  "reason":
                      "Keine zuverlässige Bewertung möglich.",
                  "signals":
                      signals
              }

          # ============================================================
          # SEC SUBMISSIONS
          # ============================================================

          def load_submissions(cik):

              url = (
                  "https://data.sec.gov/"
                  f"submissions/CIK{cik}.json"
              )

              response = requests.get(
                  url,
                  headers=HEADERS,
                  timeout=30
              )

              print(
                  "SEC Submissions HTTP:",
                  response.status_code
              )

              if response.status_code != 200:
                  return []

              data = response.json()

              recent = (
                  data
                  .get("filings", {})
                  .get("recent", {})
              )

              forms = recent.get(
                  "form",
                  []
              )

              accessions = recent.get(
                  "accessionNumber",
                  []
              )

              docs = recent.get(
                  "primaryDocument",
                  []
              )

              dates = recent.get(
                  "filingDate",
                  []
              )

              filings = []

              # V3 bevorzugt 10-Q und 10-K.
              # 8-K wird nur ergänzend geprüft.
              for (
                  form,
                  accession,
                  document,
                  filing_date
              ) in zip(
                  forms,
                  accessions,
                  docs,
                  dates
              ):

                  if form not in (
                      "10-Q",
                      "10-K",
                      "8-K"
                  ):
                      continue

                  filings.append({
                      "form":
                          form,
                      "accession":
                          accession,
                      "document":
                          document,
                      "filing_date":
                          filing_date
                  })

                  if len(filings) >= 10:
                      break

              return filings

          # ============================================================
          # SEC DOKUMENT LADEN
          # ============================================================

          def load_document(
              cik,
              filing
          ):

              accession = (
                  filing[
                      "accession"
                  ].replace(
                      "-",
                      ""
                  )
              )

              cik_number = str(
                  int(cik)
              )

              url = (
                  "https://www.sec.gov/"
                  "Archives/edgar/data/"
                  f"{cik_number}/"
                  f"{accession}/"
                  f"{filing['document']}"
              )

              response = requests.get(
                  url,
                  headers=HEADERS,
                  timeout=30
              )

              print(
                  filing["filing_date"],
                  "|",
                  filing["form"],
                  "| HTTP",
                  response.status_code
              )

              if response.status_code != 200:
                  return None

              text = clean_html(
                  response.text
              )

              passages = (
                  find_relevant_passages(
                      text
                  )
              )

              evaluation = (
                  evaluate_passages(
                      passages
                  )
              )

              return {
                  "filing_date":
                      filing["filing_date"],
                  "form":
                      filing["form"],
                  "passages":
                      passages,
                  "evaluation":
                      evaluation
              }

          # ============================================================
          # HAUPTLAUF
          # ============================================================

          for ticker, cik in COMPANIES.items():

              print("")
              print("=" * 90)

              print(
                  "BULLWERK ORDERS/BACKLOG V3:",
                  ticker
              )

              print("=" * 90)

              try:

                  filings = (
                      load_submissions(
                          cik
                      )
                  )

                  usable = []

                  for filing in filings:

                      result = (
                          load_document(
                              cik,
                              filing
                          )
                      )

                      if result is None:
                          continue

                      passages = (
                          result[
                              "passages"
                          ]
                      )

                      evaluation = (
                          result[
                              "evaluation"
                          ]
                      )

                      print(
                          "Relevante Passagen:",
                          len(passages)
                      )

                      if passages:

                          for passage in (
                              passages[:2]
                          ):

                              print(
                                  " -",
                                  passage[:900]
                              )

                      print(
                          "Bewertung:",
                          evaluation[
                              "status"
                          ],
                          "| Score:",
                          evaluation[
                              "score"
                          ]
                      )

                      # Nur wirklich bewertbare
                      # Filings aufnehmen.
                      if (
                          evaluation[
                              "score"
                          ]
                          is not None
                      ):

                          usable.append(
                              result
                          )

                      time.sleep(0.2)

                  print("")
                  print(
                      "--- BULLWERK ERGEBNIS ---"
                  )

                  if not usable:

                      print(
                          "ORDERS/BACKLOG SCORE: N/A"
                      )

                      print(
                          "STATUS: N/A"
                      )

                      print(
                          "GRUND: Keine belastbare "
                          "Orders-/Backlog-Entwicklung "
                          "aus SEC-Unterlagen ableitbar."
                      )

                  else:

                      # Neueste belastbare
                      # Information verwenden.
                      latest = usable[0]

                      evaluation = (
                          latest[
                              "evaluation"
                          ]
                      )

                      print(
                          "VERWENDE FILING:",
                          latest[
                              "filing_date"
                          ],
                          latest[
                              "form"
                          ]
                      )

                      print(
                          "ORDERS/BACKLOG SCORE:",
                          f"{evaluation['score']}/3"
                      )

                      print(
                          "STATUS:",
                          evaluation[
                              "status"
                          ]
                      )

                      print(
                          "GRUND:",
                          evaluation[
                              "reason"
                          ]
                      )

                      print(
                          "SIGNALANZAHL:",
                          len(
                              evaluation[
                                  "signals"
                              ]
                          )
                      )

                      for signal in (
                          evaluation[
                              "signals"
                          ][:5]
                      ):

                          print(
                              "SIGNAL:",
                              signal
                          )

              except Exception as error:

                  print(
                      "FEHLER:",
                      repr(error)
                  )

              print("")
              print(
                  ticker,
                  "abgeschlossen."
              )

              time.sleep(0.5)

          print("")
          print("=" * 90)
          print(
              "Bullwerk Orders/Backlog Test V3 beendet."
          )
          print(
              "Nur spezifische Orders-/Backlog-/RPO-Signale."
          )
          print(
              "N/A wird NICHT als 0 gewertet."
          )
          print("=" * 90)
