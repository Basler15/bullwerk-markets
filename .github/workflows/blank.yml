name: Bullwerk Orders Backlog Test V6

on:
  workflow_dispatch:

jobs:
  orders-backlog-test:
    runs-on: ubuntu-latest

    steps:
      - name: Test Orders and Backlog V6
        shell: python
        run: |
          import requests
          import re
          import time
          from html import unescape

          # ============================================================
          # BULLWERK MARKETS
          # ORDERS / BACKLOG TEST V6
          #
          # V6:
          # - konkrete RPO-/Backlog-/Bookings-Werte
          # - neuester Wert gegen unmittelbar vorherigen Wert
          # - 10-Q und 10-K dürfen aufeinanderfolgen
          # - Filing-Typ bleibt als Kontrollinformation sichtbar
          # - Plausibilitätsprüfung bei außergewöhnlichen Sprüngen
          #
          # 3/3 = klar positiv
          # 2/3 = stabil / leicht positiv
          # 1/3 = moderat schwächer
          # 0/3 = klar schwächer
          # N/A = nicht bewertbar
          # CHECK_REQUIRED = außergewöhnlicher Sprung -> keine Punkte
          # ============================================================

          COMPANIES = {
              "NVDA": "0001045810",
              "MSFT": "0000789019",
              "AVGO": "0001730168",
              "MU":   "0000723125",
              "ORCL": "0001341439",
              "AAPL": "0000320193",
          }

          HEADERS = {
              "User-Agent":
                  "Bullwerk Markets contact: bullwerkmarkets@gmail.com",
              "Accept-Encoding": "gzip, deflate",
          }

          METRICS = {
              "RPO": [
                  "remaining performance obligations",
                  "remaining performance obligation",
              ],
              "BACKLOG": [
                  "order backlog",
                  "contracted backlog",
                  "backlog",
              ],
              "BOOKINGS": [
                  "bookings",
              ],
          }

          # ============================================================
          # PLAUSIBILITÄT
          # ============================================================

          MAX_POSITIVE_JUMP = 75.0
          MAX_NEGATIVE_JUMP = -50.0

          # ============================================================
          # HTML -> TEXT
          # ============================================================

          def clean_html(html):

              html = re.sub(
                  r"(?is)<script.*?>.*?</script>",
                  " ",
                  html
              )

              html = re.sub(
                  r"(?is)<style.*?>.*?</style>",
                  " ",
                  html
              )

              html = re.sub(
                  r"(?i)<br\s*/?>",
                  ". ",
                  html
              )

              html = re.sub(
                  r"(?i)</(?:p|div|tr|li|h1|h2|h3|td)>",
                  ". ",
                  html
              )

              html = re.sub(
                  r"(?is)<[^>]+>",
                  " ",
                  html
              )

              text = unescape(html)

              text = text.replace(
                  "\xa0",
                  " "
              )

              text = re.sub(
                  r"\s+",
                  " ",
                  text
              )

              return text.strip()

          # ============================================================
          # GELDWERTE NORMALISIEREN
          # ============================================================

          def money_to_billions(number, unit):

              try:
                  value = float(
                      number.replace(",", "")
                  )
              except:
                  return None

              unit = unit.lower()

              if unit in (
                  "billion",
                  "billions"
              ):
                  return value

              if unit in (
                  "million",
                  "millions"
              ):
                  return value / 1000.0

              if unit in (
                  "trillion",
                  "trillions"
              ):
                  return value * 1000.0

              return None

          # ============================================================
          # RELEVANTE PASSAGEN
          # ============================================================

          def find_metric_passages(text):

              sentences = re.split(
                  r"(?<=[.!?])\s+",
                  text
              )

              results = []

              for i, sentence in enumerate(sentences):

                  lower = sentence.lower()

                  found_metric = None

                  for metric, terms in METRICS.items():

                      if any(
                          term in lower
                          for term in terms
                      ):
                          found_metric = metric
                          break

                  if not found_metric:
                      continue

                  start = max(
                      0,
                      i - 1
                  )

                  end = min(
                      len(sentences),
                      i + 2
                  )

                  passage = " ".join(
                      sentences[start:end]
                  ).strip()

                  if 40 <= len(passage) <= 3000:

                      results.append({
                          "metric": found_metric,
                          "text": passage
                      })

              return results

          # ============================================================
          # GELDWERTE EXTRAHIEREN
          # ============================================================

          def extract_money_values(passage):

              text = passage["text"]

              values = []

              patterns = [
                  r"\$\s*([0-9]+(?:\.[0-9]+)?)\s*"
                  r"(billion|billions|million|millions|"
                  r"trillion|trillions)",

                  r"([0-9]+(?:\.[0-9]+)?)\s*"
                  r"(billion|billions|million|millions|"
                  r"trillion|trillions)\s+"
                  r"(?:U\.S\.\s*)?dollars",
              ]

              for pattern in patterns:

                  for match in re.finditer(
                      pattern,
                      text,
                      flags=re.I
                  ):

                      value = money_to_billions(
                          match.group(1),
                          match.group(2)
                      )

                      if value is None:
                          continue

                      values.append({
                          "value_bn": value,
                          "raw": match.group(0)
                      })

              return values

          # ============================================================
          # BESTEN WERT AUS EINER PASSAGE WÄHLEN
          # ============================================================

          def choose_metric_value(
              metric,
              passage_text,
              values
          ):

              if not values:
                  return None

              lower = passage_text.lower()

              candidates = []

              for item in values:

                  raw_lower = item["raw"].lower()
                  pos = lower.find(raw_lower)

                  if pos == -1:

                      candidate = dict(item)
                      candidate[
                          "recognition_context"
                      ] = False

                      candidates.append(
                          candidate
                      )

                      continue

                  context = lower[
                      max(0, pos - 180):
                      min(len(lower), pos + 180)
                  ]

                  recognition_words = [
                      "recognized",
                      "recognize",
                      "recognition",
                      "next twelve months",
                      "next 12 months",
                      "over the next",
                  ]

                  candidate = dict(item)

                  candidate[
                      "recognition_context"
                  ] = any(
                      word in context
                      for word in recognition_words
                  )

                  candidates.append(
                      candidate
                  )

              preferred = [
                  item
                  for item in candidates
                  if not item[
                      "recognition_context"
                  ]
              ]

              pool = (
                  preferred
                  if preferred
                  else candidates
              )

              if not pool:
                  return None

              return max(
                  pool,
                  key=lambda x:
                      x["value_bn"]
              )

          # ============================================================
          # DOKUMENT ANALYSIEREN
          # ============================================================

          def analyse_text(text):

              passages = find_metric_passages(
                  text
              )

              candidates = []

              for passage in passages:

                  values = extract_money_values(
                      passage
                  )

                  chosen = choose_metric_value(
                      passage["metric"],
                      passage["text"],
                      values
                  )

                  if chosen:

                      candidates.append({
                          "metric":
                              passage["metric"],
                          "value_bn":
                              chosen["value_bn"],
                          "raw":
                              chosen["raw"],
                          "passage":
                              passage["text"]
                      })

              best_by_metric = {}

              for candidate in candidates:

                  metric = candidate["metric"]

                  if metric not in best_by_metric:

                      best_by_metric[
                          metric
                      ] = candidate

                  elif (
                      candidate["value_bn"]
                      >
                      best_by_metric[
                          metric
                      ]["value_bn"]
                  ):

                      best_by_metric[
                          metric
                      ] = candidate

              return best_by_metric

          # ============================================================
          # SEC SUBMISSIONS
          # ============================================================

          def load_submissions(cik):

              url = (
                  "https://data.sec.gov/"
                  f"submissions/CIK{cik}.json"
              )

              response = requests.get(
                  url,
                  headers=HEADERS,
                  timeout=30
              )

              print(
                  "SEC Submissions HTTP:",
                  response.status_code
              )

              if response.status_code != 200:
                  return []

              recent = (
                  response.json()
                  .get("filings", {})
                  .get("recent", {})
              )

              filings = []

              for (
                  form,
                  accession,
                  document,
                  filing_date
              ) in zip(
                  recent.get("form", []),
                  recent.get(
                      "accessionNumber",
                      []
                  ),
                  recent.get(
                      "primaryDocument",
                      []
                  ),
                  recent.get(
                      "filingDate",
                      []
                  )
              ):

                  if form not in (
                      "10-Q",
                      "10-K"
                  ):
                      continue

                  filings.append({
                      "form": form,
                      "accession": accession,
                      "document": document,
                      "filing_date": filing_date
                  })

                  if len(filings) >= 12:
                      break

              return filings

          # ============================================================
          # SEC DOKUMENT LADEN
          # ============================================================

          def load_document(cik, filing):

              accession = (
                  filing["accession"]
                  .replace("-", "")
              )

              cik_number = str(
                  int(cik)
              )

              url = (
                  "https://www.sec.gov/"
                  "Archives/edgar/data/"
                  f"{cik_number}/"
                  f"{accession}/"
                  f"{filing['document']}"
              )

              response = requests.get(
                  url,
                  headers=HEADERS,
                  timeout=30
              )

              print(
                  filing["filing_date"],
                  "|",
                  filing["form"],
                  "| HTTP",
                  response.status_code
              )

              if response.status_code != 200:
                  return None

              metrics = analyse_text(
                  clean_html(
                      response.text
                  )
              )

              return {
                  "filing_date":
                      filing["filing_date"],
                  "form":
                      filing["form"],
                  "metrics":
                      metrics
              }

          # ============================================================
          # VERÄNDERUNG
          # ============================================================

          def compare_values(
              current,
              previous
          ):

              if (
                  current is None
                  or previous is None
                  or previous <= 0
              ):
                  return None

              return (
                  (
                      current / previous
                  ) - 1
              ) * 100

          # ============================================================
          # PLAUSIBILITÄTSPRÜFUNG
          # ============================================================

          def plausibility_check(change):

              if change is None:

                  return {
                      "valid": False,
                      "reason":
                          "Keine Veränderung berechenbar."
                  }

              if change > MAX_POSITIVE_JUMP:

                  return {
                      "valid": False,
                      "reason":
                          "Ungewöhnlich großer positiver "
                          "Sprung. Vergleichbarkeit prüfen."
                  }

              if change < MAX_NEGATIVE_JUMP:

                  return {
                      "valid": False,
                      "reason":
                          "Ungewöhnlich großer negativer "
                          "Sprung. Vergleichbarkeit prüfen."
                  }

              return {
                  "valid": True,
                  "reason":
                      "Veränderung plausibel."
              }

          # ============================================================
          # SCORE
          # ============================================================

          def bullwerk_score(change):

              check = plausibility_check(
                  change
              )

              if not check["valid"]:

                  return {
                      "score": None,
                      "status":
                          "CHECK_REQUIRED",
                      "reason":
                          check["reason"]
                  }

              if change >= 15:

                  return {
                      "score": 3,
                      "status":
                          "STRONG_POSITIVE",
                      "reason":
                          "Starkes Wachstum."
                  }

              if change >= 5:

                  return {
                      "score": 3,
                      "status":
                          "POSITIVE",
                      "reason":
                          "Klare positive Entwicklung."
                  }

              if change >= -5:

                  return {
                      "score": 2,
                      "status":
                          "STABLE",
                      "reason":
                          "Stabile bis leicht positive "
                          "Entwicklung."
                  }

              if change >= -15:

                  return {
                      "score": 1,
                      "status":
                          "CAUTIOUS",
                      "reason":
                          "Moderate Verschlechterung."
                  }

              return {
                  "score": 0,
                  "status":
                      "WEAKER",
                  "reason":
                      "Deutliche Verschlechterung."
              }

          # ============================================================
          # V6: DIREKTER VERGLEICH
          #
          # WICHTIG:
          # Nicht mehr gleicher Filing-Typ bevorzugen.
          #
          # Wir verwenden:
          # 1. neuesten gefundenen Wert
          # 2. unmittelbar vorherigen gefundenen Wert
          #
          # Dadurch misst Bullwerk die jüngste Veränderung.
          # ============================================================

          def build_comparison(
              results,
              metric
          ):

              observations = []

              for result in results:

                  if metric in result["metrics"]:

                      observations.append({
                          "date":
                              result["filing_date"],
                          "form":
                              result["form"],
                          "value":
                              result[
                                  "metrics"
                              ][
                                  metric
                              ][
                                  "value_bn"
                              ]
                      })

              if len(observations) < 2:
                  return None

              # SEC-Liste kommt neu -> alt.
              current = observations[0]
              previous = observations[1]

              change = compare_values(
                  current["value"],
                  previous["value"]
              )

              if change is None:
                  return None

              score_data = bullwerk_score(
                  change
              )

              return {
                  "metric":
                      metric,
                  "current":
                      current,
                  "previous":
                      previous,
                  "change":
                      change,
                  "score":
                      score_data["score"],
                  "status":
                      score_data["status"],
                  "reason":
                      score_data["reason"],
                  "same_form":
                      (
                          current["form"]
                          ==
                          previous["form"]
                      )
              }

          # ============================================================
          # HAUPTLAUF
          # ============================================================

          for ticker, cik in COMPANIES.items():

              print("")
              print("=" * 90)

              print(
                  "BULLWERK ORDERS/BACKLOG V6:",
                  ticker
              )

              print("=" * 90)

              try:

                  filings = load_submissions(
                      cik
                  )

                  results = []

                  for filing in filings:

                      result = load_document(
                          cik,
                          filing
                      )

                      if result is None:
                          continue

                      results.append(
                          result
                      )

                      print(
                          "Gefundene Kennzahlen:"
                      )

                      if not result["metrics"]:

                          print(
                              "  keine"
                          )

                      for (
                          metric,
                          data
                      ) in result[
                          "metrics"
                      ].items():

                          print(
                              " ",
                              metric,
                              "=",
                              round(
                                  data[
                                      "value_bn"
                                  ],
                                  3
                              ),
                              "Mrd. USD",
                              "|",
                              data["raw"]
                          )

                      time.sleep(0.2)

                  print("")
                  print(
                      "--- BULLWERK ERGEBNIS ---"
                  )

                  comparisons = []

                  for metric in (
                      "RPO",
                      "BACKLOG",
                      "BOOKINGS"
                  ):

                      comparison = (
                          build_comparison(
                              results,
                              metric
                          )
                      )

                      if comparison:
                          comparisons.append(
                              comparison
                          )

                  if not comparisons:

                      print(
                          "ORDERS/BACKLOG SCORE: N/A"
                      )

                      print(
                          "STATUS: N/A"
                      )

                      print(
                          "GRUND: Keine zwei "
                          "vergleichbaren Backlog-, "
                          "RPO- oder Bookings-Werte "
                          "gefunden."
                      )

                  else:

                      priority = {
                          "BACKLOG": 3,
                          "BOOKINGS": 2,
                          "RPO": 1,
                      }

                      comparisons.sort(
                          key=lambda x:
                              priority[
                                  x["metric"]
                              ],
                          reverse=True
                      )

                      best = comparisons[0]

                      print(
                          "METRIK:",
                          best["metric"]
                      )

                      print(
                          "AKTUELL:",
                          round(
                              best[
                                  "current"
                              ][
                                  "value"
                              ],
                              3
                          ),
                          "Mrd. USD",
                          "|",
                          best[
                              "current"
                          ][
                              "form"
                          ],
                          "| Filing:",
                          best[
                              "current"
                          ][
                              "date"
                          ]
                      )

                      print(
                          "VORHER:",
                          round(
                              best[
                                  "previous"
                              ][
                                  "value"
                              ],
                              3
                          ),
                          "Mrd. USD",
                          "|",
                          best[
                              "previous"
                          ][
                              "form"
                          ],
                          "| Filing:",
                          best[
                              "previous"
                          ][
                              "date"
                          ]
                      )

                      print(
                          "GLEICHER FILING-TYP:",
                          best["same_form"]
                      )

                      print(
                          "VERÄNDERUNG:",
                          f"{best['change']:+.1f}%"
                      )

                      if (
                          best["status"]
                          ==
                          "CHECK_REQUIRED"
                      ):

                          print(
                              "ORDERS/BACKLOG SCORE: N/A"
                          )

                          print(
                              "STATUS: CHECK_REQUIRED"
                          )

                          print(
                              "GRUND:",
                              best["reason"]
                          )

                          print(
                              "HINWEIS: Wert wird NICHT "
                              "in den Bullwerk-Score "
                              "übernommen."
                          )

                      else:

                          print(
                              "ORDERS/BACKLOG SCORE:",
                              f"{best['score']}/3"
                          )

                          print(
                              "STATUS:",
                              best["status"]
                          )

                          print(
                              "GRUND:",
                              best["reason"]
                          )

                      print("")
                      print(
                          "ALLE VERGLEICHE:"
                      )

                      for comp in comparisons:

                          score_text = (
                              "N/A"
                              if comp["score"] is None
                              else f"{comp['score']}/3"
                          )

                          print(
                              comp["metric"],
                              "|",
                              f"{comp['change']:+.1f}%",
                              "|",
                              score_text,
                              "|",
                              comp["status"],
                              "| Filing-Typen:",
                              comp[
                                  "current"
                              ]["form"],
                              "->",
                              comp[
                                  "previous"
                              ]["form"]
                          )

              except Exception as error:

                  print(
                      "FEHLER:",
                      repr(error)
                  )

              print("")
              print(
                  ticker,
                  "abgeschlossen."
              )

              time.sleep(0.5)

          print("")
          print("=" * 90)

          print(
              "Bullwerk Orders/Backlog Test V6 beendet."
          )

          print(
              "V6 vergleicht den neuesten Wert mit "
              "dem unmittelbar vorherigen Wert."
          )

          print(
              "10-Q und 10-K dürfen aufeinanderfolgen."
          )

          print(
              "Ungewöhnliche Sprünge werden weiterhin "
              "als CHECK_REQUIRED behandelt."
          )

          print(
              "N/A und CHECK_REQUIRED werden "
              "nicht als 0 gewertet."
          )

          print("=" * 90)
