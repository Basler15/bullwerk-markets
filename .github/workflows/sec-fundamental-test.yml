                      "| Beschleunigung:",
                      format_acceleration(
                          current_eps.get(
                              "acceleration"
                          )
                      )
                  )


              if current_margin:

                  change = (
                      current_margin.get(
                          "margin_change_pp"
                      )
                  )


                  print(
                      "Operative Marge:",
                      f"{current_margin['margin']:.2f} %",
                      "| YoY:",
                      (
                          f"{change:+.2f} PP"
                          if change
