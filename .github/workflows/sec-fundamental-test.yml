name: Bullwerk Fundamental Momentum Score V8

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fundamental-momentum-test:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Fundamental Momentum V8 berechnen und speichern
        run: |
          python3 <<'PY'

          import json
          import os
          import time
          import urllib.request
          import requests
          import re
          from html import unescape
          from datetime import datetime


          # ============================================================
          # BULLWERK MARKETS
          # FUNDAMENTAL MOMENTUM SCORE V5
          #
          # WICHTIGE ÄNDERUNG:
          #
          # SEC FY/FP wird NICHT mehr für die zeitliche Reihenfolge
          # der Quartale verwendet.
          #
          # Die Reihenfolge entsteht aus dem tatsächlichen Enddatum.
          #
          # Bullwerk erzeugt daraus:
          # BQ1, BQ2, BQ3 ... = chronologische Quartalsfolge.
          #
          # YoY:
          # aktuelles Quartal gegen Quartal 4 Positionen davor.
          #
          # Beschleunigung:
          # aktuelles YoY minus YoY des direkt vorherigen Quartals.
          #
          # V5 ergänzt den Bullwerk Fundamental Score 0-20.
          # ============================================================


          companies = {
              "AAPL": "0000320193",
              "MSFT": "0000789019",
              "NVDA": "0001045810",
              "AMD": "0000002488",
              "AMZN": "0001018724",
              "META": "0001326801",
              "GOOGL": "0001652044",
              "PLTR": "0001321655"
          }


          USER_AGENT = (
              "Bullwerk Markets "
              "contact: bullwerkmarkets@gmail.com"
          )


          # ============================================================
          # DATUM
          # ============================================================

          def parse_date(value):

              if not value:
                  return None

              try:
                  return datetime.strptime(
                      value,
                      "%Y-%m-%d"
                  ).date()

              except ValueError:
                  return None


          def duration_days(row):

              start = parse_date(
                  row.get("start")
              )

              end = parse_date(
                  row.get("end")
              )

              if not start or not end:
                  return None

              return (
                  end - start
              ).days + 1


          def date_gap_days(
              newer,
              older
          ):

              a = parse_date(newer)
              b = parse_date(older)

              if not a or not b:
                  return None

              return (
                  a - b
              ).days


          def starts_match(
              a,
              b,
              tolerance=7
          ):

              if not a or not b:
                  return False

              da = parse_date(
                  a.get("start")
              )

              db = parse_date(
                  b.get("start")
              )

              if not da or not db:
                  return False

              return abs(
                  (da - db).days
              ) <= tolerance


          # ============================================================
          # SEC
          # ============================================================

          def get_json(url):

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent":
                          USER_AGENT,

                      "Accept":
                          "application/json",

                      "Accept-Encoding":
                          "identity"
                  }
              )

              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:

                  print(
                      "HTTP Status:",
                      response.status
                  )

                  return json.loads(
                      response.read().decode(
                          "utf-8"
                      )
                  )


          # ============================================================
          # CONCEPT LADEN
          # ============================================================

          def get_concept_rows(
              facts,
              concepts,
              units
          ):

              for concept in concepts:

                  try:

                      available = (
                          facts["facts"]
                          ["us-gaap"]
                          [concept]
                          ["units"]
                      )

                  except KeyError:

                      continue


                  selected = None


                  for unit in units:

                      if unit in available:

                          selected = (
                              available[unit]
                          )

                          break


                  if selected is None:

                      if not available:
                          continue

                      selected = next(
                          iter(
                              available.values()
                          )
                      )


                  rows = []


                  for row in selected:

                      if row.get(
                          "form"
                      ) not in (
                          "10-Q",
                          "10-K"
                      ):
                          continue

                      if row.get(
                          "val"
                      ) is None:
                          continue

                      if not row.get(
                          "start"
                      ):
                          continue

                      if not row.get(
                          "end"
                      ):
                          continue


                      item = dict(row)

                      item[
                          "duration_days"
                      ] = duration_days(
                          item
                      )

                      rows.append(
                          item
                      )


                  if rows:

                      return (
                          concept,
                          rows
                      )


              return (
                  None,
                  []
              )


          # ============================================================
          # DUPLIKATE
          # ============================================================

          def dedupe_rows(rows):

              best = {}


              for row in rows:

                  key = (
                      row.get("start"),
                      row.get("end"),
                      row.get("val"),
                      row.get("fy"),
                      row.get("fp"),
                      row.get("form")
                  )


                  old = best.get(key)


                  if old is None:

                      best[key] = row

                      continue


                  if (
                      row.get("filed")
                      or ""
                  ) > (
                      old.get("filed")
                      or ""
                  ):

                      best[key] = row


              return list(
                  best.values()
              )


          # ============================================================
          # DIREKTE QUARTALE
          # ============================================================

          def direct_quarters(rows):

              result = []


              for row in rows:

                  days = row.get(
                      "duration_days"
                  )


                  if days is None:
                      continue


                  if not (
                      70 <= days <= 110
                  ):
                      continue


                  fp = row.get("fp")


                  if fp not in (
                      "Q1",
                      "Q2",
                      "Q3",
                      "Q4"
                  ):
                      continue


                  result.append({

                      "end":
                          row.get("end"),

                      "value":
                          row.get("val"),

                      "sec_fy":
                          row.get("fy"),

                      "sec_fp":
                          fp,

                      "filed":
                          row.get("filed"),

                      "source":
                          "DIRECT"
                  })


              return result


          # ============================================================
          # KUMULATIVE PERIODEN
          # ============================================================

          def find_periods_for_fy(
              rows,
              fy
          ):

              q1 = []
              h1 = []
              nine = []
              full = []


              for row in rows:

                  if row.get("fy") != fy:
                      continue


                  days = row.get(
                      "duration_days"
                  )


                  if days is None:
                      continue


                  if (
                      70 <= days <= 110
                      and row.get("fp")
                      == "Q1"
                  ):

                      q1.append(row)


                  elif (
                      150 <= days <= 220
                  ):

                      h1.append(row)


                  elif (
                      230 <= days <= 310
                  ):

                      nine.append(row)


                  elif (
                      330 <= days <= 380
                      and row.get("form")
                      == "10-K"
                  ):

                      full.append(row)


              def newest(items):

                  if not items:
                      return None

                  return sorted(
                      items,
                      key=lambda x: (
                          x.get("filed")
                          or "",
                          x.get("end")
                          or ""
                      ),
                      reverse=True
                  )[0]


              return {
                  "q1":
                      newest(q1),

                  "h1":
                      newest(h1),

                  "nine":
                      newest(nine),

                  "full":
                      newest(full)
              }


          # ============================================================
          # ABGELEITETE QUARTALE
          # ============================================================

          def derived_quarters(rows):

              result = []


              fiscal_years = {

                  row.get("fy")

                  for row in rows

                  if row.get("fy")
                  is not None
              }


              for fy in fiscal_years:

                  p = find_periods_for_fy(
                      rows,
                      fy
                  )


                  q1 = p["q1"]
                  h1 = p["h1"]
                  nine = p["nine"]
                  full = p["full"]


                  # Q2
                  if (
                      q1
                      and h1
                      and starts_match(
                          q1,
                          h1
                      )
                  ):

                      result.append({

                          "end":
                              h1.get("end"),

                          "value":
                              h1["val"]
                              - q1["val"],

                          "sec_fy":
                              fy,

                          "sec_fp":
                              "Q2",

                          "filed":
                              h1.get("filed"),

                          "source":
                              "DERIVED_H1_MINUS_Q1"
                      })


                  # Q3
                  if (
                      h1
                      and nine
                      and starts_match(
                          h1,
                          nine
                      )
                  ):

                      result.append({

                          "end":
                              nine.get("end"),

                          "value":
                              nine["val"]
                              - h1["val"],

                          "sec_fy":
                              fy,

                          "sec_fp":
                              "Q3",

                          "filed":
                              nine.get("filed"),

                          "source":
                              "DERIVED_9M_MINUS_H1"
                      })


                  # Q4
                  if (
                      nine
                      and full
                      and starts_match(
                          nine,
                          full
                      )
                  ):

                      result.append({

                          "end":
                              full.get("end"),

                          "value":
                              full["val"]
                              - nine["val"],

                          "sec_fy":
                              fy,

                          "sec_fp":
                              "Q4",

                          "filed":
                              full.get("filed"),

                          "source":
                              "DERIVED_FY_MINUS_9M"
                      })


              return result


          # ============================================================
          # QUARTALE NACH ECHTEM ENDDATUM
          #
          # Hier liegt die wichtigste V4-Änderung.
          # Ein Enddatum = eine wirtschaftliche Periode.
          # ============================================================

          def build_quarters(rows):

              rows = dedupe_rows(rows)


              candidates = (
                  derived_quarters(rows)
                  +
                  direct_quarters(rows)
              )


              best_by_end = {}


              for row in candidates:

                  end = row.get("end")


                  if not end:
                      continue


                  old = best_by_end.get(
                      end
                  )


                  if old is None:

                      best_by_end[end] = row

                      continue


                  # Direktes Einzelquartal
                  # bevorzugen.
                  if (
                      row.get("source")
                      == "DIRECT"
                      and old.get("source")
                      != "DIRECT"
                  ):

                      best_by_end[end] = row

                      continue


                  # Neueste Einreichung
                  if (
                      row.get("source")
                      == old.get("source")
                      and (
                          row.get("filed")
                          or ""
                      ) > (
                          old.get("filed")
                          or ""
                      )
                  ):

                      best_by_end[end] = row


              quarters = list(
                  best_by_end.values()
              )


              quarters.sort(
                  key=lambda x:
                      x.get("end")
                      or ""
              )


              # --------------------------------------------------------
              # Quartalsfolge prüfen.
              #
              # Nur Perioden behalten, deren Abstand
              # zu benachbarten Quartalen plausibel ist.
              # --------------------------------------------------------

              clean = []


              for row in quarters:

                  if not clean:

                      clean.append(row)

                      continue


                  gap = date_gap_days(
                      row.get("end"),
                      clean[-1].get("end")
                  )


                  if gap is None:
                      continue


                  # Gleiche/fast gleiche Periode
                  if gap < 45:

                      # neueren Kandidaten verwenden
                      clean[-1] = row

                      continue


                  clean.append(row)


              # Bullwerk Sequence
              for index, row in enumerate(
                  clean
              ):

                  row[
                      "sequence"
                  ] = index + 1


              clean.sort(
                  key=lambda x:
                      x.get("end")
                      or "",
                  reverse=True
              )


              return clean


          # ============================================================
          # YOY NACH ECHTEM DATUM
          #
          # Wir suchen ein Quartal ca. 1 Jahr zurück.
          # SEC FY spielt hier KEINE Rolle.
          # ============================================================

          def find_prior_year(
              current,
              quarters
          ):

              current_end = parse_date(
                  current.get("end")
              )


              if not current_end:
                  return None


              candidates = []


              for row in quarters:

                  if row is current:
                      continue


                  older_end = parse_date(
                      row.get("end")
                  )


                  if not older_end:
                      continue


                  gap = (
                      current_end
                      - older_end
                  ).days


                  if (
                      330 <= gap <= 400
                  ):

                      candidates.append(
                          (
                              abs(
                                  gap - 365
                              ),
                              row
                          )
                      )


              if not candidates:
                  return None


              candidates.sort(
                  key=lambda x:
                      x[0]
              )


              return candidates[0][1]


          # ============================================================
          # YOY
          # ============================================================

          def yoy_growth(
              current,
              previous
          ):

              if current is None:
                  return None

              if previous is None:
                  return None

              if previous == 0:
                  return None


              return (
                  (
                      current
                      - previous
                  )
                  / abs(previous)
                  * 100
              )


          def build_yoy_series(
              quarters
          ):

              result = []


              for current in quarters:

                  previous = (
                      find_prior_year(
                          current,
                          quarters
                      )
                  )


                  if not previous:
                      continue


                  growth = yoy_growth(
                      current.get("value"),
                      previous.get("value")
                  )


                  if growth is None:
                      continue


                  result.append({

                      "end":
                          current.get("end"),

                      "sequence":
                          current.get(
                              "sequence"
                          ),

                      "value":
                          current.get(
                              "value"
                          ),

                      "previous_end":
                          previous.get(
                              "end"
                          ),

                      "previous_value":
                          previous.get(
                              "value"
                          ),

                      "yoy":
                          growth,

                      "sec_fy":
                          current.get(
                              "sec_fy"
                          ),

                      "sec_fp":
                          current.get(
                              "sec_fp"
                          )
                  })


              result.sort(
                  key=lambda x:
                      x.get("end")
                      or "",
                  reverse=True
              )


              return result


          # ============================================================
          # BESCHLEUNIGUNG
          #
          # Nur das unmittelbar vorherige echte Quartal.
          # ============================================================

          def add_acceleration(
              series
          ):

              result = []


              for i, row in enumerate(
                  series
              ):

                  new_row = dict(row)

                  new_row[
                      "acceleration"
                  ] = None


                  if i + 1 < len(series):

                      older = series[
                          i + 1
                      ]


                      gap = date_gap_days(
                          row.get("end"),
                          older.get("end")
                      )


                      if (
                          gap is not None
                          and 60 <= gap <= 120
                      ):

                          new_row[
                              "acceleration"
                          ] = (
                              row["yoy"]
                              - older["yoy"]
                          )


                  result.append(
                      new_row
                  )


              return result


          # ============================================================
          # OPERATIVE MARGE
          # ============================================================

          def build_margin_series(
              revenue,
              operating_income
          ):

              op_lookup = {

                  row.get("end"): row

                  for row in operating_income

                  if row.get("end")
              }


              result = []


              for rev in revenue:

                  end = rev.get("end")

                  op = op_lookup.get(end)


                  if not op:
                      continue


                  revenue_value = (
                      rev.get("value")
                  )

                  operating_value = (
                      op.get("value")
                  )


                  if (
                      revenue_value is None
                      or revenue_value == 0
                      or operating_value
                      is None
                  ):
                      continue


                  result.append({

                      "end":
                          end,

                      "sequence":
                          rev.get(
                              "sequence"
                          ),

                      "margin":
                          (
                              operating_value
                              / revenue_value
                              * 100
                          )
                  })


              result.sort(
                  key=lambda x:
                      x.get("end")
                      or "",
                  reverse=True
              )


              for row in result:

                  previous = (
                      find_prior_year(
                          row,
                          result
                      )
                  )


                  if previous:

                      row[
                          "margin_change_pp"
                      ] = (
                          row["margin"]
                          - previous[
                              "margin"
                          ]
                      )

                  else:

                      row[
                          "margin_change_pp"
                      ] = None


              return result


          # ============================================================
          # FREE CASH FLOW
          # ============================================================

          def build_fcf_series(
              ocf,
              capex
          ):

              capex_lookup = {

                  row.get("end"): row

                  for row in capex

                  if row.get("end")
              }


              result = []


              for ocf_row in ocf:

                  end = ocf_row.get("end")

                  capex_row = (
                      capex_lookup.get(end)
                  )


                  if not capex_row:
                      continue


                  ocf_value = (
                      ocf_row.get("value")
                  )

                  capex_value = (
                      capex_row.get("value")
                  )


                  if (
                      ocf_value is None
                      or capex_value is None
                  ):
                      continue


                  result.append({

                      "end":
                          end,

                      "sequence":
                          ocf_row.get(
                              "sequence"
                          ),

                      "value":
                          (
                              ocf_value
                              - capex_value
                          ),

                      "ocf":
                          ocf_value,

                      "capex":
                          capex_value,

                      "source":
                          (
                              ocf_row.get(
                                  "source"
                              )
                              + " / "
                              + capex_row.get(
                                  "source"
                              )
                          )
                  })


              result.sort(
                  key=lambda x:
                      x.get("end")
                      or ""
              )


              # eigene lückenlose Reihenfolge
              for index, row in enumerate(
                  result
              ):

                  row[
                      "sequence"
                  ] = index + 1


              result.sort(
                  key=lambda x:
                      x.get("end")
                      or "",
                  reverse=True
              )


              return result


          # ============================================================
          # FORMAT
          # ============================================================

          def format_acceleration(
              value
          ):

              if value is None:
                  return "n/a"

              return (
                  f"{value:+.2f} PP"
              )


          def print_growth(
              title,
              series,
              billions=True
          ):

              print("")
              print(
                  f"--- {title} ---"
              )


              if not series:

                  print(
                      "Keine ausreichenden Daten."
                  )

                  return


              for row in series[:8]:

                  value = row.get(
                      "value"
                  )


                  if billions:

                      value_text = (
                          f"{value / 1_000_000_000:.3f} Mrd."
                      )

                  else:

                      value_text = (
                          f"{value:.2f}"
                      )


                  print(
                      row.get("end"),
                      "| BQ",
                      row.get(
                          "sequence"
                      ),
                      "| SEC:",
                      row.get(
                          "sec_fy",
                          "-"
                      ),
                      row.get(
                          "sec_fp",
                          "-"
                      ),
                      "| Wert:",
                      value_text,
                      "| YoY:",
                      f"{row['yoy']:+.2f} %",
                      "| Beschleunigung:",
                      format_acceleration(
                          row.get(
                              "acceleration"
                          )
                      )
                  )




          # ============================================================
          # ORDERS / BACKLOG V6
          # ============================================================

          ORDERS_METRICS = {
              "RPO": ["remaining performance obligations", "remaining performance obligation"],
              "BACKLOG": ["order backlog", "contracted backlog", "backlog"],
              "BOOKINGS": ["bookings"],
          }

          MAX_POSITIVE_JUMP = 75.0
          MAX_NEGATIVE_JUMP = -50.0

          def clean_html(html):
              html = re.sub(r"(?is)<script.*?>.*?</script>", " ", html)
              html = re.sub(r"(?is)<style.*?>.*?</style>", " ", html)
              html = re.sub(r"(?i)<br\s*/?>", ". ", html)
              html = re.sub(r"(?i)</(?:p|div|tr|li|h1|h2|h3|td)>", ". ", html)
              html = re.sub(r"(?is)<[^>]+>", " ", html)
              text = unescape(html).replace("\xa0", " ")
              return re.sub(r"\s+", " ", text).strip()

          def money_to_billions(number, unit):
              try:
                  value = float(number.replace(",", ""))
              except Exception:
                  return None
              unit = unit.lower()
              if unit in ("billion", "billions"):
                  return value
              if unit in ("million", "millions"):
                  return value / 1000.0
              if unit in ("trillion", "trillions"):
                  return value * 1000.0
              return None

          def find_metric_passages(text):
              sentences = re.split(r"(?<=[.!?])\s+", text)
              results = []
              for i, sentence in enumerate(sentences):
                  lower = sentence.lower()
                  found_metric = None
                  for metric, terms in ORDERS_METRICS.items():
                      if any(term in lower for term in terms):
                          found_metric = metric
                          break
                  if not found_metric:
                      continue
                  passage = " ".join(sentences[max(0, i - 1):min(len(sentences), i + 2)]).strip()
                  if 40 <= len(passage) <= 3000:
                      results.append({"metric": found_metric, "text": passage})
              return results

          def extract_money_values(passage):
              text = passage["text"]
              values = []
              patterns = [
                  r"\$\s*([0-9]+(?:\.[0-9]+)?)\s*(billion|billions|million|millions|trillion|trillions)",
                  r"([0-9]+(?:\.[0-9]+)?)\s*(billion|billions|million|millions|trillion|trillions)\s+(?:U\.S\.\s*)?dollars",
              ]
              for pattern in patterns:
                  for match in re.finditer(pattern, text, flags=re.I):
                      value = money_to_billions(match.group(1), match.group(2))
                      if value is not None:
                          values.append({"value_bn": value, "raw": match.group(0)})
              return values

          def choose_metric_value(metric, passage_text, values):
              if not values:
                  return None
              lower = passage_text.lower()
              candidates = []
              for item in values:
                  raw_lower = item["raw"].lower()
                  pos = lower.find(raw_lower)
                  context = lower[max(0, pos - 180):min(len(lower), pos + 180)] if pos != -1 else ""
                  recognition_words = [
                      "recognized", "recognize", "recognition",
                      "next twelve months", "next 12 months", "over the next"
                  ]
                  candidate = dict(item)
                  candidate["recognition_context"] = any(word in context for word in recognition_words)
                  candidates.append(candidate)
              preferred = [item for item in candidates if not item["recognition_context"]]
              pool = preferred if preferred else candidates
              return max(pool, key=lambda x: x["value_bn"]) if pool else None

          def analyse_orders_text(text):
              candidates = []
              for passage in find_metric_passages(text):
                  chosen = choose_metric_value(
                      passage["metric"], passage["text"], extract_money_values(passage)
                  )
                  if chosen:
                      candidates.append({
                          "metric": passage["metric"],
                          "value_bn": chosen["value_bn"],
                          "raw": chosen["raw"],
                          "passage": passage["text"],
                      })
              best_by_metric = {}
              for candidate in candidates:
                  metric = candidate["metric"]
                  if metric not in best_by_metric or candidate["value_bn"] > best_by_metric[metric]["value_bn"]:
                      best_by_metric[metric] = candidate
              return best_by_metric

          def load_orders_filings(cik):
              url = f"https://data.sec.gov/submissions/CIK{cik}.json"
              response = requests.get(url, headers={"User-Agent": USER_AGENT, "Accept-Encoding": "gzip, deflate"}, timeout=30)
              if response.status_code != 200:
                  return []
              recent = response.json().get("filings", {}).get("recent", {})
              filings = []
              for form, accession, document, filing_date in zip(
                  recent.get("form", []),
                  recent.get("accessionNumber", []),
                  recent.get("primaryDocument", []),
                  recent.get("filingDate", []),
              ):
                  if form not in ("10-Q", "10-K"):
                      continue
                  filings.append({
                      "form": form,
                      "accession": accession,
                      "document": document,
                      "filing_date": filing_date,
                  })
                  if len(filings) >= 12:
                      break
              return filings

          def load_orders_document(cik, filing):
              accession = filing["accession"].replace("-", "")
              cik_number = str(int(cik))
              url = (
                  "https://www.sec.gov/Archives/edgar/data/"
                  f"{cik_number}/{accession}/{filing['document']}"
              )
              response = requests.get(url, headers={"User-Agent": USER_AGENT, "Accept-Encoding": "gzip, deflate"}, timeout=30)
              if response.status_code != 200:
                  return None
              return {
                  "filing_date": filing["filing_date"],
                  "form": filing["form"],
                  "metrics": analyse_orders_text(clean_html(response.text)),
              }

          def orders_change(current, previous):
              if current is None or previous is None or previous <= 0:
                  return None
              return ((current / previous) - 1) * 100

          def orders_score_from_change(change):
              if change is None:
                  return {"score": None, "status": "N/A", "reason": "Keine Veränderung berechenbar."}
              if change > MAX_POSITIVE_JUMP or change < MAX_NEGATIVE_JUMP:
                  return {
                      "score": None,
                      "status": "CHECK_REQUIRED",
                      "reason": "Ungewöhnlich großer Sprung. Vergleichbarkeit prüfen.",
                  }
              if change >= 15:
                  return {"score": 3, "status": "STRONG_POSITIVE", "reason": "Starkes Wachstum."}
              if change >= 5:
                  return {"score": 3, "status": "POSITIVE", "reason": "Klare positive Entwicklung."}
              if change >= -5:
                  return {"score": 2, "status": "STABLE", "reason": "Stabile bis leicht positive Entwicklung."}
              if change >= -15:
                  return {"score": 1, "status": "CAUTIOUS", "reason": "Moderate Verschlechterung."}
              return {"score": 0, "status": "WEAKER", "reason": "Deutliche Verschlechterung."}

          def build_orders_comparison(results, metric):
              observations = []
              for result in results:
                  if metric in result["metrics"]:
                      observations.append({
                          "date": result["filing_date"],
                          "form": result["form"],
                          "value": result["metrics"][metric]["value_bn"],
                      })
              if len(observations) < 2:
                  return None
              current = observations[0]
              previous = observations[1]
              change = orders_change(current["value"], previous["value"])
              if change is None:
                  return None
              score_data = orders_score_from_change(change)
              return {
                  "metric": metric,
                  "current": current,
                  "previous": previous,
                  "change": change,
                  "score": score_data["score"],
                  "status": score_data["status"],
                  "reason": score_data["reason"],
              }

          def get_orders_backlog_result(cik):
              results = []
              try:
                  for filing in load_orders_filings(cik):
                      result = load_orders_document(cik, filing)
                      if result is not None:
                          results.append(result)
                      time.sleep(0.15)
              except Exception as error:
                  return {
                      "score": None,
                      "status": "N/A",
                      "reason": f"SEC Orders/Backlog Fehler: {error}",
                      "metric": None,
                      "change": None,
                  }

              comparisons = []
              for metric in ("RPO", "BACKLOG", "BOOKINGS"):
                  comparison = build_orders_comparison(results, metric)
                  if comparison:
                      comparisons.append(comparison)

              if not comparisons:
                  return {
                      "score": None,
                      "status": "N/A",
                      "reason": "Keine zwei vergleichbaren Backlog-, RPO- oder Bookings-Werte gefunden.",
                      "metric": None,
                      "change": None,
                  }

              priority = {"BACKLOG": 3, "BOOKINGS": 2, "RPO": 1}
              comparisons.sort(key=lambda x: priority[x["metric"]], reverse=True)
              return comparisons[0]


          # ============================================================
          # CONCEPTS
          # ============================================================

          concepts = {

              "Revenue": (
                  [
                      "RevenueFromContractWithCustomerExcludingAssessedTax",
                      "SalesRevenueNet",
                      "Revenues"
                  ],
                  ["USD"]
              ),

              "Net Income": (
                  [
                      "NetIncomeLoss"
                  ],
                  ["USD"]
              ),

              "Operating Income": (
                  [
                      "OperatingIncomeLoss"
                  ],
                  ["USD"]
              ),

              "Diluted EPS": (
                  [
                      "EarningsPerShareDiluted"
                  ],
                  ["USD/shares"]
              ),

              "Operating Cash Flow": (
                  [
                      "NetCashProvidedByUsedInOperatingActivities"
                  ],
                  ["USD"]
              ),

              "Capital Expenditure": (
                  [
                      "PaymentsToAcquirePropertyPlantAndEquipment"
                  ],
                  ["USD"]
              )
          }


          # ============================================================
          # HAUPTLAUF
          # ============================================================

          fundamental_results = []

          for symbol, cik in (
              companies.items()
          ):

              print("")
              print("=" * 90)

              print(
                  "BULLWERK FUNDAMENTAL "
                  f"MOMENTUM V5: {symbol}"
              )

              print("=" * 90)


              url = (
                  "https://data.sec.gov/"
                  "api/xbrl/companyfacts/"
                  f"CIK{cik}.json"
              )


              try:

                  facts = get_json(
                      url
                  )

              except Exception as error:

                  print(
                      "SEC FEHLER:",
                      error
                  )

                  continue


              print(
                  "Unternehmen:",
                  facts.get(
                      "entityName"
                  )
              )


              company_data = {}


              for label, (
                  concept_names,
                  units
              ) in concepts.items():

                  concept, rows = (
                      get_concept_rows(
                          facts,
                          concept_names,
                          units
                      )
                  )


                  quarters = (
                      build_quarters(rows)
                      if rows
                      else []
                  )


                  company_data[
                      label
                  ] = quarters


                  print(
                      label,
                      ":",
                      len(quarters),
                      "Quartale",
                      "| Concept:",
                      concept
                  )


              # ========================================================
              # UMSATZ
              # ========================================================

              revenue = (
                  add_acceleration(
                      build_yoy_series(
                          company_data[
                              "Revenue"
                          ]
                      )
                  )
              )


              print_growth(
                  "UMSATZ MOMENTUM",
                  revenue
              )


              # ========================================================
              # GEWINN
              # ========================================================

              income = (
                  add_acceleration(
                      build_yoy_series(
                          company_data[
                              "Net Income"
                          ]
                      )
                  )
              )


              print_growth(
                  "GEWINN MOMENTUM",
                  income
              )


              # ========================================================
              # EPS
              # ========================================================

              eps = (
                  add_acceleration(
                      build_yoy_series(
                          company_data[
                              "Diluted EPS"
                          ]
                      )
                  )
              )


              print_growth(
                  "EPS MOMENTUM",
                  eps,
                  billions=False
              )


              # ========================================================
              # MARGE
              # ========================================================

              margins = (
                  build_margin_series(
                      company_data[
                          "Revenue"
                      ],
                      company_data[
                          "Operating Income"
                      ]
                  )
              )


              print("")
              print(
                  "--- OPERATIVE MARGE ---"
              )


              for row in margins[:8]:

                  change = row.get(
                      "margin_change_pp"
                  )


                  print(
                      row.get("end"),
                      "| BQ",
                      row.get(
                          "sequence"
                      ),
                      "| Marge:",
                      f"{row['margin']:.2f} %",
                      "| YoY:",
                      (
                          f"{change:+.2f} PP"
                          if change
                          is not None
                          else "n/a"
                      )
                  )


              # ========================================================
              # FCF
              # ========================================================

              fcf_quarters = (
                  build_fcf_series(
                      company_data[
                          "Operating Cash Flow"
                      ],
                      company_data[
                          "Capital Expenditure"
                      ]
                  )
              )


              print("")
              print(
                  "--- FCF EINZELQUARTALE ---"
              )


              for row in (
                  fcf_quarters[:12]
              ):

                  print(
                      row.get("end"),
                      "| BQ",
                      row.get(
                          "sequence"
                      ),
                      "| FCF:",
                      f"{row['value'] / 1_000_000_000:.3f} Mrd.",
                      "| OCF:",
                      f"{row['ocf'] / 1_000_000_000:.3f}",
                      "| CapEx:",
                      f"{row['capex'] / 1_000_000_000:.3f}",
                      "|",
                      row.get("source")
                  )


              fcf = (
                  add_acceleration(
                      build_yoy_series(
                          fcf_quarters
                      )
                  )
              )


              print_growth(
                  "FREE CASH FLOW MOMENTUM",
                  fcf
              )


              # ========================================================
              # SNAPSHOT
              # ========================================================

              print("")
              print(
                  "--- AKTUELLER "
                  "FUNDAMENTAL SNAPSHOT ---"
              )


              def latest(series):

                  if not series:
                      return None

                  return series[0]


              current_revenue = (
                  latest(revenue)
              )

              current_income = (
                  latest(income)
              )

              current_eps = (
                  latest(eps)
              )

              current_margin = (
                  latest(margins)
              )

              current_fcf = (
                  latest(fcf)
              )


              if current_revenue:

                  print(
                      "Umsatz YoY:",
                      f"{current_revenue['yoy']:+.2f} %",
                      "| Beschleunigung:",
                      format_acceleration(
                          current_revenue.get(
                              "acceleration"
                          )
                      )
                  )


              if current_income:

                  print(
                      "Gewinn YoY:",
                      f"{current_income['yoy']:+.2f} %",
                      "| Beschleunigung:",
                      format_acceleration(
                          current_income.get(
                              "acceleration"
                          )
                      )
                  )


              if current_eps:

                  print(
                      "EPS YoY:",
                      f"{current_eps['yoy']:+.2f} %",
                      "| Beschleunigung:",
                      format_acceleration(
                          current_eps.get(
                              "acceleration"
                          )
                      )
                  )


              if current_margin:

                  change = (
                      current_margin.get(
                          "margin_change_pp"
                      )
                  )


                  print(
                      "Operative Marge:",
                      f"{current_margin['margin']:.2f} %",
                      "| YoY:",
                      (
                          f"{change:+.2f} PP"
                          if change
                          is not None
                          else "n/a"
                      )
                  )


              if current_fcf:

                  print(
                      "FCF YoY:",
                      f"{current_fcf['yoy']:+.2f} %",
                      "| Beschleunigung:",
                      format_acceleration(
                          current_fcf.get(
                              "acceleration"
                          )
                      )
                  )


              # ========================================================
              # BULLWERK FUNDAMENTAL SCORE V5
              # Umsatz 0-4 | Gewinn/EPS 0-4 | Marge 0-3 | FCF 0-3
              # Guidance 0-3/N/A | Orders/Backlog 0-3/N/A
              # N/A wird nicht als 0 gewertet.
              # ========================================================

              def score_revenue(row):
                  if not row or row.get("yoy") is None:
                      return None
                  yoy = row["yoy"]
                  acc = row.get("acceleration")
                  acc = 0 if acc is None else acc

                  if (yoy >= 15 and acc > 0) or (yoy >= 25 and acc >= -3):
                      return 4
                  if (yoy >= 8 and acc >= 0) or (yoy >= 15 and acc >= -8):
                      return 3
                  if yoy >= 3:
                      return 2
                  if yoy >= 0:
                      return 1
                  return 0


              def score_profit_eps(income_row, eps_row):
                  values = []

                  for row in (income_row, eps_row):
                      if row and row.get("yoy") is not None:
                          acc = row.get("acceleration")
                          acc = 0 if acc is None else acc
                          values.append((row["yoy"], acc))

                  if not values:
                      return None

                  growth = max(v[0] for v in values)
                  acc = max(v[1] for v in values)

                  if growth >= 20 and acc > 0:
                      return 4
                  if (growth >= 10 and acc >= 0) or (growth >= 20 and acc >= -8):
                      return 3
                  if growth >= 3:
                      return 2
                  if growth >= 0:
                      return 1
                  return 0


              def score_margin(row):
                  if not row:
                      return None

                  change = row.get("margin_change_pp")

                  if change is None:
                      return None
                  if change >= 1.0:
                      return 3
                  if change >= 0.25:
                      return 2
                  if change >= -0.25:
                      return 1
                  return 0


              def score_fcf(row):
                  if not row or row.get("yoy") is None:
                      return None

                  yoy = row["yoy"]
                  acc = row.get("acceleration")
                  acc = 0 if acc is None else acc

                  if yoy >= 15 and acc >= 0:
                      return 3
                  if (yoy >= 5 and acc >= 0) or (yoy >= 15 and acc >= -8):
                      return 2
                  if yoy >= 0:
                      return 1
                  return 0


              revenue_score = score_revenue(current_revenue)
              profit_eps_score = score_profit_eps(current_income, current_eps)
              margin_score = score_margin(current_margin)
              fcf_score = score_fcf(current_fcf)

              # Guidance bleibt vorerst separat / N/A.
              guidance_score = None

              # Orders/Backlog V6: neuester Wert gegen unmittelbar vorherigen Wert.
              # N/A und CHECK_REQUIRED werden NICHT als 0 gewertet.
              orders_backlog_result = get_orders_backlog_result(cik)
              orders_backlog_score = orders_backlog_result.get("score")

              print("")
              print("--- ORDERS / BACKLOG V6 ---")
              print("Metrik:", orders_backlog_result.get("metric") or "N/A")
              change = orders_backlog_result.get("change")
              print("Veränderung:", f"{change:+.1f}%" if change is not None else "N/A")
              print("Score:", f"{orders_backlog_score}/3" if orders_backlog_score is not None else "N/A")
              print("Status:", orders_backlog_result.get("status"))
              print("Grund:", orders_backlog_result.get("reason"))

              components = [
                  ("Umsatz", revenue_score, 4),
                  ("Gewinn/EPS", profit_eps_score, 4),
                  ("Marge", margin_score, 3),
                  ("FCF", fcf_score, 3),
                  ("Guidance", guidance_score, 3),
                  ("Orders/Backlog", orders_backlog_score, 3)
              ]

              earned = sum(
                  value
                  for _, value, _ in components
                  if value is not None
              )

              available_max = sum(
                  maximum
                  for _, value, maximum in components
                  if value is not None
              )

              fundamental_score = (
                  earned / available_max * 20
                  if available_max > 0
                  else None
              )

              print("")
              print("--- BULLWERK FUNDAMENTAL SCORE V5 ---")

              for label, value, maximum in components:
                  if value is None:
                      print(f"{label}: N/A")
                  else:
                      print(f"{label}: {value}/{maximum}")

              if fundamental_score is None:
                  print("FUNDAMENTAL SCORE: N/A")
              else:
                  print(
                      "FUNDAMENTAL SCORE:",
                      f"{fundamental_score:.1f}/20",
                      "| Rohpunkte:",
                      f"{earned}/{available_max}"
                  )


              fundamental_results.append({
                  "symbol": symbol,
                  "fundamentalScore": (
                      round(fundamental_score, 1)
                      if fundamental_score is not None
                      else None
                  ),
                  "rawPoints": earned,
                  "availableMax": available_max,
                  "breakdown": {
                      "revenue": revenue_score,
                      "profitEps": profit_eps_score,
                      "margin": margin_score,
                      "fcf": fcf_score,
                      "guidance": guidance_score,
                      "ordersBacklog": orders_backlog_score,
                      "ordersBacklogStatus": orders_backlog_result.get("status"),
                      "ordersBacklogMetric": orders_backlog_result.get("metric"),
                      "ordersBacklogChangePct": (
                          round(orders_backlog_result.get("change"), 1)
                          if orders_backlog_result.get("change") is not None
                          else None
                      )
                  }
              })

              print("")
              print(
                  symbol,
                  "abgeschlossen."
              )


              time.sleep(1)


          os.makedirs(
              "data",
              exist_ok=True
          )

          output = {
              "updated": datetime.utcnow().isoformat() + "Z",
              "version": "bullwerk-fundamental-data-v8",
              "scoreVersion": "bullwerk-fundamental-v2",
              "maxScore": 20,
              "stocks": fundamental_results
          }

          with open(
              "data/fundamental-data.json",
              "w",
              encoding="utf-8"
          ) as file:
              json.dump(
                  output,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          print("")
          print("data/fundamental-data.json gespeichert.")
          print(f"{len(fundamental_results)} Aktien gespeichert.")

          print("")
          print("=" * 90)

          print(
              "Bullwerk Fundamental "
              "Momentum Score V8 beendet."
          )

          print("=" * 90)

          PY

      - name: Fundamentaldaten im Repository speichern
        run: |
          git config user.name "Bullwerk Data Bot"
          git config user.email "actions@github.com"

          git add data/fundamental-data.json

          if git diff --cached --quiet; then
            echo "Keine neuen Fundamentaldaten."
          else
            git commit -m "Update Bullwerk fundamental data v8"
            git push
          fi
