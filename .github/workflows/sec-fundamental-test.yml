name: Bullwerk SEC Fundamental Test

on:
  workflow_dispatch:

jobs:
  sec-fundamental-test:
    runs-on: ubuntu-latest

    steps:
      - name: SEC Fundamentaldaten testen
        run: |
          python3 <<'PY'

          import json
          import time
          import urllib.request
          import urllib.error

          companies = {
              "AAPL": "0000320193",
              "MSFT": "0000789019"
          }

          # Identifizierbarer User-Agent für SEC-Zugriffe
          USER_AGENT = (
              "Bullwerk Markets "
              "contact: bullwerkmarkets@gmail.com"
          )


          def get_json(url):

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": USER_AGENT,
                      "Accept": "application/json",
                      "Accept-Encoding": "identity"
                  }
              )

              try:

                  with urllib.request.urlopen(
                      request,
                      timeout=30
                  ) as response:

                      status = response.status

                      print(
                          f"HTTP Status: {status}"
                      )

                      raw = response.read()

                      return json.loads(
                          raw.decode("utf-8")
                      )

              except urllib.error.HTTPError as error:

                  print(
                      f"HTTP Fehler: {error.code}"
                  )

                  print(
                      f"URL: {url}"
                  )

                  raise


          def get_units(
              facts,
              taxonomy,
              concept
          ):

              try:

                  return (
                      facts["facts"]
                      [taxonomy]
                      [concept]
                      ["units"]
                  )

              except (
                  KeyError,
                  TypeError
              ):

                  return {}


          def find_unit(units):

              preferred_units = [
                  "USD",
                  "USD/shares",
                  "shares"
              ]

              for unit in preferred_units:

                  if unit in units:
                      return units[unit]

              for values in units.values():
                  return values

              return []


          def recent_facts(
              facts,
              concept,
              limit=12
          ):

              units = get_units(
                  facts,
                  "us-gaap",
                  concept
              )

              values = find_unit(
                  units
              )

              rows = []

              for row in values:

                  if row.get("form") not in [
                      "10-Q",
                      "10-K"
                  ]:
                      continue

                  if row.get("val") is None:
                      continue

                  rows.append({
                      "start":
                          row.get("start"),

                      "end":
                          row.get("end"),

                      "value":
                          row.get("val"),

                      "form":
                          row.get("form"),

                      "fy":
                          row.get("fy"),

                      "fp":
                          row.get("fp"),

                      "filed":
                          row.get("filed"),

                      "frame":
                          row.get("frame")
                  })


              rows.sort(
                  key=lambda row: (
                      row.get("end") or "",
                      row.get("filed") or ""
                  ),
                  reverse=True
              )


              unique = []
              seen = set()

              for row in rows:

                  key = (
                      row.get("start"),
                      row.get("end"),
                      row.get("value")
                  )

                  if key in seen:
                      continue

                  seen.add(key)

                  unique.append(
                      row
                  )

              return unique[:limit]


          concepts = {

              "Revenue": [
                  "RevenueFromContractWithCustomerExcludingAssessedTax",
                  "SalesRevenueNet",
                  "Revenues"
              ],

              "Net Income": [
                  "NetIncomeLoss"
              ],

              "Operating Income": [
                  "OperatingIncomeLoss"
              ],

              "Diluted EPS": [
                  "EarningsPerShareDiluted"
              ],

              "Operating Cash Flow": [
                  "NetCashProvidedByUsedInOperatingActivities"
              ],

              "Capital Expenditure": [
                  "PaymentsToAcquirePropertyPlantAndEquipment"
              ]
          }


          for symbol, cik in companies.items():

              print("")
              print("=" * 70)
              print(
                  f"SEC FUNDAMENTAL TEST: {symbol}"
              )
              print("=" * 70)

              url = (
                  "https://data.sec.gov/"
                  "api/xbrl/companyfacts/"
                  f"CIK{cik}.json"
              )

              try:

                  facts = get_json(
                      url
                  )

              except Exception as error:

                  print(
                      f"SEC FEHLER bei {symbol}: "
                      f"{error}"
                  )

                  continue


              print(
                  "Unternehmen:",
                  facts.get("entityName")
              )

              print(
                  "CIK:",
                  facts.get("cik")
              )


              for label, possible_concepts in concepts.items():

                  print("")
                  print(
                      f"--- {label} ---"
                  )

                  found = False

                  for concept in possible_concepts:

                      rows = recent_facts(
                          facts,
                          concept
                      )

                      if not rows:
                          continue

                      print(
                          f"Concept: {concept}"
                      )

                      print(
                          f"Gefundene Werte: {len(rows)}"
                      )

                      for row in rows[:8]:

                          print(
                              row
                          )

                      found = True

                      break


                  if not found:

                      print(
                          "Keine passenden Werte gefunden."
                      )


              print("")
              print(
                  f"{symbol} erfolgreich verarbeitet."
              )

              # SEC nicht unnötig schnell abfragen
              time.sleep(1)


          print("")
          print("=" * 70)
          print(
              "Bullwerk SEC Test beendet."
          )
          print("=" * 70)

          PY
