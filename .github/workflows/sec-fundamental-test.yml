name: Bullwerk Fundamental Momentum Test V3

on:
  workflow_dispatch:

jobs:
  fundamental-momentum-test:
    runs-on: ubuntu-latest

    steps:
      - name: Fundamental Momentum V3 berechnen
        run: |
          python3 <<'PY'

          import json
          import time
          import urllib.request
          from datetime import datetime


          # ============================================================
          # BULLWERK MARKETS
          # FUNDAMENTAL MOMENTUM TEST V3
          #
          # Ziel:
          # - SEC Einzelquartale sauber normalisieren
          # - echte Perioden-Enddaten für Reihenfolge verwenden
          # - FY/FP nur zur Quartalsidentifikation nutzen
          # - keine falsche Beschleunigung über Periodenlücken
          # - FCF aus passenden OCF/CapEx Quartalen bilden
          #
          # Noch KEIN Bullwerk 0-20 Score.
          # ============================================================


          companies = {
              "AAPL": "0000320193",
              "MSFT": "0000789019"
          }


          USER_AGENT = (
              "Bullwerk Markets "
              "contact: bullwerkmarkets@gmail.com"
          )


          QUARTER_ORDER = {
              "Q1": 1,
              "Q2": 2,
              "Q3": 3,
              "Q4": 4
          }


          # ============================================================
          # SEC LADEN
          # ============================================================

          def get_json(url):

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": USER_AGENT,
                      "Accept": "application/json",
                      "Accept-Encoding": "identity"
                  }
              )

              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:

                  print(
                      f"HTTP Status: {response.status}"
                  )

                  return json.loads(
                      response.read().decode("utf-8")
                  )


          # ============================================================
          # DATUM-HILFEN
          # ============================================================

          def parse_date(value):

              if not value:
                  return None

              try:
                  return datetime.strptime(
                      value,
                      "%Y-%m-%d"
                  ).date()

              except ValueError:
                  return None


          def duration_days(row):

              start = parse_date(
                  row.get("start")
              )

              end = parse_date(
                  row.get("end")
              )

              if not start or not end:
                  return None

              return (
                  end - start
              ).days + 1


          def date_gap_days(
              newer_end,
              older_end
          ):

              newer = parse_date(
                  newer_end
              )

              older = parse_date(
                  older_end
              )

              if not newer or not older:
                  return None

              return (
                  newer - older
              ).days


          def starts_match(
              row_a,
              row_b,
              tolerance=7
          ):

              if not row_a or not row_b:
                  return False

              a = parse_date(
                  row_a.get("start")
              )

              b = parse_date(
                  row_b.get("start")
              )

              if not a or not b:
                  return False

              return abs(
                  (a - b).days
              ) <= tolerance


          # ============================================================
          # SEC CONCEPT LADEN
          # ============================================================

          def get_concept_rows(
              facts,
              concepts,
              preferred_units
          ):

              for concept in concepts:

                  try:

                      units = (
                          facts["facts"]
                          ["us-gaap"]
                          [concept]
                          ["units"]
                      )

                  except KeyError:

                      continue


                  selected = None


                  for unit in preferred_units:

                      if unit in units:

                          selected = units[
                              unit
                          ]

                          break


                  if selected is None:

                      if not units:
                          continue

                      selected = next(
                          iter(
                              units.values()
                          )
                      )


                  rows = []


                  for row in selected:

                      if row.get(
                          "form"
                      ) not in (
                          "10-Q",
                          "10-K"
                      ):
                          continue

                      if row.get(
                          "val"
                      ) is None:
                          continue

                      if not row.get(
                          "start"
                      ):
                          continue

                      if not row.get(
                          "end"
                      ):
                          continue


                      new_row = dict(
                          row
                      )

                      new_row[
                          "concept"
                      ] = concept

                      new_row[
                          "duration_days"
                      ] = duration_days(
                          row
                      )

                      rows.append(
                          new_row
                      )


                  if rows:

                      return (
                          concept,
                          rows
                      )


              return (
                  None,
                  []
              )


          # ============================================================
          # DUPLIKATE
          # ============================================================

          def dedupe_rows(rows):

              best = {}


              for row in rows:

                  key = (
                      row.get("start"),
                      row.get("end"),
                      row.get("val"),
                      row.get("fy"),
                      row.get("fp"),
                      row.get("form")
                  )


                  old = best.get(
                      key
                  )


                  if old is None:

                      best[key] = row

                      continue


                  if (
                      row.get("filed")
                      or ""
                  ) > (
                      old.get("filed")
                      or ""
                  ):

                      best[key] = row


              return list(
                  best.values()
              )


          # ============================================================
          # DIREKTE QUARTALE
          # ============================================================

          def direct_quarters(rows):

              result = []


              for row in rows:

                  days = row.get(
                      "duration_days"
                  )

                  fp = row.get(
                      "fp"
                  )


                  if days is None:
                      continue


                  if fp not in (
                      "Q1",
                      "Q2",
                      "Q3",
                      "Q4"
                  ):
                      continue


                  if not (
                      70 <= days <= 110
                  ):
                      continue


                  result.append({

                      "start":
                          row.get("start"),

                      "end":
                          row.get("end"),

                      "value":
                          row.get("val"),

                      "fy":
                          row.get("fy"),

                      "fp":
                          fp,

                      "filed":
                          row.get("filed"),

                      "form":
                          row.get("form"),

                      "source":
                          "DIRECT"
                  })


              return result


          # ============================================================
          # KUMULATIVE PERIODEN EINES SEC FY
          # ============================================================

          def find_periods_for_fy(
              rows,
              fy
          ):

              q1 = []
              h1 = []
              nine_month = []
              full_year = []


              for row in rows:

                  if row.get(
                      "fy"
                  ) != fy:
                      continue


                  days = row.get(
                      "duration_days"
                  )


                  if days is None:
                      continue


                  fp = row.get(
                      "fp"
                  )


                  if (
                      70 <= days <= 110
                      and fp == "Q1"
                  ):

                      q1.append(
                          row
                      )


                  elif (
                      150 <= days <= 220
                      and fp in (
                          "Q2",
                          "Q3"
                      )
                  ):

                      h1.append(
                          row
                      )


                  elif (
                      230 <= days <= 310
                      and fp in (
                          "Q3",
                          "FY"
                      )
                  ):

                      nine_month.append(
                          row
                      )


                  elif (
                      330 <= days <= 380
                      and row.get(
                          "form"
                      ) == "10-K"
                  ):

                      full_year.append(
                          row
                      )


              def newest(items):

                  if not items:

                      return None


                  return sorted(
                      items,
                      key=lambda x: (
                          x.get(
                              "filed"
                          )
                          or "",
                          x.get(
                              "end"
                          )
                          or ""
                      ),
                      reverse=True
                  )[0]


              return {
                  "q1":
                      newest(q1),

                  "h1":
                      newest(h1),

                  "nine_month":
                      newest(
                          nine_month
                      ),

                  "full_year":
                      newest(
                          full_year
                      )
              }


          # ============================================================
          # ABGELEITETE QUARTALE
          # ============================================================

          def derived_quarters(rows):

              result = []


              fiscal_years = sorted({

                  row.get("fy")

                  for row in rows

                  if row.get(
                      "fy"
                  ) is not None
              })


              for fy in fiscal_years:

                  periods = (
                      find_periods_for_fy(
                          rows,
                          fy
                      )
                  )


                  q1 = periods[
                      "q1"
                  ]

                  h1 = periods[
                      "h1"
                  ]

                  nine = periods[
                      "nine_month"
                  ]

                  full_year = periods[
                      "full_year"
                  ]


                  # Q2 = H1 - Q1
                  if (
                      q1
                      and h1
                      and starts_match(
                          q1,
                          h1
                      )
                  ):

                      result.append({

                          "start":
                              None,

                          "end":
                              h1.get(
                                  "end"
                              ),

                          "value":
                              h1["val"]
                              - q1["val"],

                          "fy":
                              fy,

                          "fp":
                              "Q2",

                          "filed":
                              h1.get(
                                  "filed"
                              ),

                          "source":
                              "DERIVED_H1_MINUS_Q1"
                      })


                  # Q3 = 9M - H1
                  if (
                      h1
                      and nine
                      and starts_match(
                          h1,
                          nine
                      )
                  ):

                      result.append({

                          "start":
                              None,

                          "end":
                              nine.get(
                                  "end"
                              ),

                          "value":
                              nine["val"]
                              - h1["val"],

                          "fy":
                              fy,

                          "fp":
                              "Q3",

                          "filed":
                              nine.get(
                                  "filed"
                              ),

                          "source":
                              "DERIVED_9M_MINUS_H1"
                      })


                  # Q4 = FY - 9M
                  if (
                      nine
                      and full_year
                      and starts_match(
                          nine,
                          full_year
                      )
                  ):

                      result.append({

                          "start":
                              None,

                          "end":
                              full_year.get(
                                  "end"
                              ),

                          "value":
                              full_year["val"]
                              - nine["val"],

                          "fy":
                              fy,

                          "fp":
                              "Q4",

                          "filed":
                              full_year.get(
                                  "filed"
                              ),

                          "source":
                              "DERIVED_FY_MINUS_9M"
                      })


              return result


          # ============================================================
          # QUARTALE NORMALISIEREN
          #
          # WICHTIG:
          # Ein FY/FP darf nur EIN Quartal besitzen.
          # DIRECT wird bevorzugt.
          # ============================================================

          def build_quarters(rows):

              rows = dedupe_rows(
                  rows
              )


              candidates = (
                  derived_quarters(
                      rows
                  )
                  +
                  direct_quarters(
                      rows
                  )
              )


              best = {}


              for row in candidates:

                  fy = row.get(
                      "fy"
                  )

                  fp = row.get(
                      "fp"
                  )


                  if (
                      fy is None
                      or fp not in QUARTER_ORDER
                  ):
                      continue


                  key = (
                      fy,
                      fp
                  )


                  old = best.get(
                      key
                  )


                  if old is None:

                      best[key] = row

                      continue


                  # DIRECT vor DERIVED
                  if (
                      row.get(
                          "source"
                      ) == "DIRECT"
                      and old.get(
                          "source"
                      ) != "DIRECT"
                  ):

                      best[key] = row

                      continue


                  # Bei gleichem Typ:
                  # neueste Einreichung
                  if (
                      row.get(
                          "source"
                      )
                      == old.get(
                          "source"
                      )
                      and (
                          row.get(
                              "filed"
                          )
                          or ""
                      ) > (
                          old.get(
                              "filed"
                          )
                          or ""
                      )
                  ):

                      best[key] = row


              quarters = list(
                  best.values()
              )


              # Tatsächliches Perioden-Enddatum
              # bestimmt die Chronologie.
              quarters.sort(
                  key=lambda x:
                      x.get(
                          "end"
                      )
                      or "",
                  reverse=True
              )


              return quarters


          # ============================================================
          # PRIOR-YEAR QUARTER
          #
          # Nicht blind fy - 1 verwenden.
          #
          # Gesucht wird:
          # - gleiches FP
          # - Enddatum ungefähr 1 Jahr vorher
          # ============================================================

          def find_prior_year_quarter(
              current,
              quarters
          ):

              current_end = parse_date(
                  current.get(
                      "end"
                  )
              )

              current_fp = current.get(
                  "fp"
              )


              if (
                  not current_end
                  or current_fp
                      not in QUARTER_ORDER
              ):

                  return None


              candidates = []


              for row in quarters:

                  if row is current:
                      continue


                  if row.get(
                      "fp"
                  ) != current_fp:
                      continue


                  row_end = parse_date(
                      row.get(
                          "end"
                      )
                  )


                  if not row_end:
                      continue


                  gap = (
                      current_end
                      - row_end
                  ).days


                  # 52/53 Wochen Geschäftsjahre
                  # zulassen.
                  if (
                      330 <= gap <= 400
                  ):

                      candidates.append(
                          (
                              abs(
                                  gap - 365
                              ),
                              row
                          )
                      )


              if not candidates:

                  return None


              candidates.sort(
                  key=lambda x:
                      x[0]
              )


              return candidates[
                  0
              ][1]


          # ============================================================
          # YOY
          # ============================================================

          def yoy_growth(
              current,
              previous
          ):

              if current is None:
                  return None

              if previous is None:
                  return None

              if previous == 0:
                  return None


              return (
                  (
                      current
                      - previous
                  )
                  / abs(
                      previous
                  )
                  * 100
              )


          def build_yoy_series(
              quarters
          ):

              result = []


              for current in quarters:

                  previous = (
                      find_prior_year_quarter(
                          current,
                          quarters
                      )
                  )


                  if previous is None:
                      continue


                  growth = yoy_growth(
                      current.get(
                          "value"
                      ),
                      previous.get(
                          "value"
                      )
                  )


                  if growth is None:
                      continue


                  result.append({

                      "end":
                          current.get(
                              "end"
                          ),

                      "fy":
                          current.get(
                              "fy"
                          ),

                      "fp":
                          current.get(
                              "fp"
                          ),

                      "value":
                          current.get(
                              "value"
                          ),

                      "previous_end":
                          previous.get(
                              "end"
                          ),

                      "previous_value":
                          previous.get(
                              "value"
                          ),

                      "yoy":
                          growth
                  })


              result.sort(
                  key=lambda x:
                      x.get(
                          "end"
                      )
                      or "",
                  reverse=True
              )


              return result


          # ============================================================
          # BESCHLEUNIGUNG
          #
          # Nur wenn zwei verfügbare Quartale
          # tatsächlich ungefähr 1 Quartal
          # auseinanderliegen.
          # ============================================================

          def add_acceleration(
              series
          ):

              result = []


              for i, row in enumerate(
                  series
              ):

                  new_row = dict(
                      row
                  )

                  new_row[
                      "acceleration"
                  ] = None


                  if i + 1 < len(
                      series
                  ):

                      older = series[
                          i + 1
                      ]


                      gap = date_gap_days(
                          row.get(
                              "end"
                          ),
                          older.get(
                              "end"
                          )
                      )


                      # Quartale typischerweise
                      # ca. 90 Tage auseinander.
                      if (
                          gap is not None
                          and 60 <= gap <= 120
                      ):

                          new_row[
                              "acceleration"
                          ] = (
                              row[
                                  "yoy"
                              ]
                              -
                              older[
                                  "yoy"
                              ]
                          )


                  result.append(
                      new_row
                  )


              return result


          # ============================================================
          # OPERATIVE MARGE
          #
          # Revenue und Operating Income
          # über echtes Quartals-Enddatum verbinden.
          # ============================================================

          def build_margin_series(
              revenue,
              operating_income
          ):

              op_by_end = {}


              for row in operating_income:

                  end = row.get(
                      "end"
                  )

                  if end:

                      op_by_end[
                          end
                      ] = row


              result = []


              for rev in revenue:

                  end = rev.get(
                      "end"
                  )

                  op = op_by_end.get(
                      end
                  )


                  if not op:
                      continue


                  revenue_value = (
                      rev.get(
                          "value"
                      )
                  )

                  operating_value = (
                      op.get(
                          "value"
                      )
                  )


                  if (
                      revenue_value is None
                      or revenue_value == 0
                      or operating_value
                          is None
                  ):
                      continue


                  margin = (
                      operating_value
                      / revenue_value
                      * 100
                  )


                  result.append({

                      "end":
                          end,

                      "fy":
                          rev.get(
                              "fy"
                          ),

                      "fp":
                          rev.get(
                              "fp"
                          ),

                      "margin":
                          margin
                  })


              result.sort(
                  key=lambda x:
                      x.get(
                          "end"
                      )
                      or "",
                  reverse=True
              )


              for row in result:

                  prior = (
                      find_prior_year_quarter(
                          row,
                          result
                      )
                  )


                  if prior:

                      row[
                          "margin_change_pp"
                      ] = (
                          row[
                              "margin"
                          ]
                          -
                          prior[
                              "margin"
                          ]
                      )

                  else:

                      row[
                          "margin_change_pp"
                      ] = None


              return result


          # ============================================================
          # FREE CASH FLOW
          #
          # Primär tatsächliches Perioden-Enddatum.
          # Nur Quartale kombinieren, die
          # wirklich dieselbe Berichtsperiode haben.
          # ============================================================

          def build_fcf_series(
              ocf,
              capex
          ):

              capex_by_end = {}


              for row in capex:

                  end = row.get(
                      "end"
                  )

                  if end:

                      capex_by_end[
                          end
                      ] = row


              result = []


              for ocf_row in ocf:

                  end = ocf_row.get(
                      "end"
                  )

                  capex_row = (
                      capex_by_end.get(
                          end
                      )
                  )


                  if not capex_row:
                      continue


                  ocf_value = (
                      ocf_row.get(
                          "value"
                      )
                  )

                  capex_value = (
                      capex_row.get(
                          "value"
                      )
                  )


                  if (
                      ocf_value is None
                      or capex_value is None
                  ):
                      continue


                  # Sicherheitscheck:
                  # FY/FP müssen ebenfalls
                  # zusammenpassen, sofern vorhanden.
                  if (
                      ocf_row.get(
                          "fp"
                      )
                      != capex_row.get(
                          "fp"
                      )
                  ):
                      continue


                  fcf = (
                      ocf_value
                      - capex_value
                  )


                  result.append({

                      "end":
                          end,

                      "fy":
                          ocf_row.get(
                              "fy"
                          ),

                      "fp":
                          ocf_row.get(
                              "fp"
                          ),

                      "value":
                          fcf,

                      "ocf":
                          ocf_value,

                      "capex":
                          capex_value,

                      "ocf_source":
                          ocf_row.get(
                              "source"
                          ),

                      "capex_source":
                          capex_row.get(
                              "source"
                          )
                  })


              result.sort(
                  key=lambda x:
                      x.get(
                          "end"
                      )
                      or "",
                  reverse=True
              )


              return result


          # ============================================================
          # FORMAT
          # ============================================================

          def format_acceleration(
              value
          ):

              if value is None:

                  return "n/a"


              return (
                  f"{value:+.2f} PP"
              )


          def print_growth(
              title,
              series,
              billions=True
          ):

              print("")
              print(
                  f"--- {title} ---"
              )


              if not series:

                  print(
                      "Keine ausreichenden Daten."
                  )

                  return


              for row in series[:8]:

                  value = row.get(
                      "value"
                  )


                  if billions:

                      value_text = (
                          f"{value / 1_000_000_000:.3f} Mrd."
                      )

                  else:

                      value_text = (
                          f"{value:.2f}"
                      )


                  print(
                      row.get(
                          "end"
                      ),
                      "| FY",
                      row.get(
                          "fy"
                      ),
                      "|",
                      row.get(
                          "fp"
                      ),
                      "| Wert:",
                      value_text,
                      "| YoY:",
                      f"{row['yoy']:+.2f} %",
                      "| Beschleunigung:",
                      format_acceleration(
                          row.get(
                              "acceleration"
                          )
                      )
                  )


          # ============================================================
          # SEC CONCEPTS
          # ============================================================

          concepts = {

              "Revenue": (
                  [
                      "RevenueFromContractWithCustomerExcludingAssessedTax",
                      "SalesRevenueNet",
                      "Revenues"
                  ],
                  ["USD"]
              ),

              "Net Income": (
                  [
                      "NetIncomeLoss"
                  ],
                  ["USD"]
              ),

              "Operating Income": (
                  [
                      "OperatingIncomeLoss"
                  ],
                  ["USD"]
              ),

              "Diluted EPS": (
                  [
                      "EarningsPerShareDiluted"
                  ],
                  ["USD/shares"]
              ),

              "Operating Cash Flow": (
                  [
                      "NetCashProvidedByUsedInOperatingActivities"
                  ],
                  ["USD"]
              ),

              "Capital Expenditure": (
                  [
                      "PaymentsToAcquirePropertyPlantAndEquipment"
                  ],
                  ["USD"]
              )
          }


          # ============================================================
          # HAUPTLAUF
          # ============================================================

          for symbol, cik in (
              companies.items()
          ):

              print("")
              print(
                  "=" * 86
              )

              print(
                  "BULLWERK FUNDAMENTAL "
                  f"MOMENTUM V3: {symbol}"
              )

              print(
                  "=" * 86
              )


              url = (
                  "https://data.sec.gov/"
                  "api/xbrl/companyfacts/"
                  f"CIK{cik}.json"
              )


              try:

                  facts = get_json(
                      url
                  )

              except Exception as error:

                  print(
                      f"SEC FEHLER bei "
                      f"{symbol}: {error}"
                  )

                  continue


              print(
                  "Unternehmen:",
                  facts.get(
                      "entityName"
                  )
              )


              company_data = {}


              for label, (
                  possible_concepts,
                  units
              ) in concepts.items():

                  concept, rows = (
                      get_concept_rows(
                          facts,
                          possible_concepts,
                          units
                      )
                  )


                  quarters = (
                      build_quarters(
                          rows
                      )
                      if rows
                      else []
                  )


                  company_data[
                      label
                  ] = quarters


                  print(
                      label,
                      ":",
                      len(
                          quarters
                      ),
                      "Quartale",
                      "| Concept:",
                      concept
                  )


              # ========================================================
              # UMSATZ
              # ========================================================

              revenue_yoy = (
                  add_acceleration(
                      build_yoy_series(
                          company_data[
                              "Revenue"
                          ]
                      )
                  )
              )


              print_growth(
                  "UMSATZ MOMENTUM",
                  revenue_yoy
              )


              # ========================================================
              # GEWINN
              # ========================================================

              income_yoy = (
                  add_acceleration(
                      build_yoy_series(
                          company_data[
                              "Net Income"
                          ]
                      )
                  )
              )


              print_growth(
                  "GEWINN MOMENTUM",
                  income_yoy
              )


              # ========================================================
              # EPS
              # ========================================================

              eps_yoy = (
                  add_acceleration(
                      build_yoy_series(
                          company_data[
                              "Diluted EPS"
                          ]
                      )
                  )
              )


              print_growth(
                  "EPS MOMENTUM",
                  eps_yoy,
                  billions=False
              )


              # ========================================================
              # MARGE
              # ========================================================

              margins = (
                  build_margin_series(
                      company_data[
                          "Revenue"
                      ],
                      company_data[
                          "Operating Income"
                      ]
                  )
              )


              print("")
              print(
                  "--- OPERATIVE MARGE ---"
              )


              for row in margins[:8]:

                  change = row.get(
                      "margin_change_pp"
                  )


                  print(
                      row.get(
                          "end"
                      ),
                      "| FY",
                      row.get(
                          "fy"
                      ),
                      "|",
                      row.get(
                          "fp"
                      ),
                      "| Marge:",
                      f"{row['margin']:.2f} %",
                      "| YoY Veränderung:",
                      (
                          f"{change:+.2f} PP"
                          if change
                          is not None
                          else "n/a"
                      )
                  )


              # ========================================================
              # FCF
              # ========================================================

              fcf_quarters = (
                  build_fcf_series(
                      company_data[
                          "Operating Cash Flow"
                      ],
                      company_data[
                          "Capital Expenditure"
                      ]
                  )
              )


              print("")
              print(
                  "--- FCF EINZELQUARTALE ---"
              )


              if not fcf_quarters:

                  print(
                      "Keine vollständigen "
                      "OCF/CapEx Quartalspaare."
                  )


              for row in (
                  fcf_quarters[:12]
              ):

                  print(
                      row.get(
                          "end"
                      ),
                      "| FY",
                      row.get(
                          "fy"
                      ),
                      "|",
                      row.get(
                          "fp"
                      ),
                      "| FCF:",
                      f"{row['value'] / 1_000_000_000:.3f} Mrd.",
                      "| OCF:",
                      f"{row['ocf'] / 1_000_000_000:.3f}",
                      "| CapEx:",
                      f"{row['capex'] / 1_000_000_000:.3f}",
                      "| Quellen:",
                      row.get(
                          "ocf_source"
                      ),
                      "/",
                      row.get(
                          "capex_source"
                      )
                  )


              fcf_yoy = (
                  add_acceleration(
                      build_yoy_series(
                          fcf_quarters
                      )
                  )
              )


              print_growth(
                  "FREE CASH FLOW MOMENTUM",
                  fcf_yoy
              )


              # ========================================================
              # SNAPSHOT
              # ========================================================

              print("")
              print(
                  "--- AKTUELLER "
                  "FUNDAMENTAL SNAPSHOT ---"
              )


              def latest(series):

                  return (
                      series[0]
                      if series
                      else None
                  )


              rev = latest(
                  revenue_yoy
              )

              inc = latest(
                  income_yoy
              )

              eps = latest(
                  eps_yoy
              )

              margin = latest(
                  margins
              )

              fcf = latest(
                  fcf_yoy
              )


              if rev:

                  print(
                      "Umsatz YoY:",
                      f"{rev['yoy']:+.2f} %",
                      "| Beschleunigung:",
                      format_acceleration(
                          rev.get(
                              "acceleration"
                          )
                      )
                  )


              if inc:

                  print(
                      "Gewinn YoY:",
                      f"{inc['yoy']:+.2f} %",
                      "| Beschleunigung:",
                      format_acceleration(
                          inc.get(
                              "acceleration"
                          )
                      )
                  )


              if eps:

                  print(
                      "EPS YoY:",
                      f"{eps['yoy']:+.2f} %",
                      "| Beschleunigung:",
                      format_acceleration(
                          eps.get(
                              "acceleration"
                          )
                      )
                  )


              if margin:

                  change = margin.get(
                      "margin_change_pp"
                  )


                  print(
                      "Operative Marge:",
                      f"{margin['margin']:.2f} %",
                      "| YoY:",
                      (
                          f"{change:+.2f} PP"
                          if change
                          is not None
                          else "n/a"
                      )
                  )


              if fcf:

                  print(
                      "FCF YoY:",
                      f"{fcf['yoy']:+.2f} %",
                      "| Beschleunigung:",
                      format_acceleration(
                          fcf.get(
                              "acceleration"
                          )
                      )
                  )

              else:

                  print(
                      "FCF Momentum: "
                      "nicht ausreichend "
                      "verlässliche Quartale"
                  )


              print("")
              print(
                  f"{symbol} abgeschlossen."
              )


              time.sleep(1)


          print("")
          print(
              "=" * 86
          )

          print(
              "Bullwerk Fundamental "
              "Momentum Test V3 beendet."
          )

          print(
              "=" * 86
          )

          PY
