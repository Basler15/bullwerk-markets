name: Bullwerk Fundamental Momentum Score V8

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fundamental-momentum-test:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Bullwerk Fundamental Momentum V8 berechnen
        shell: python
        run: |
          import json
          import os
          import re
          import time
          import urllib.request
          from html import unescape
          from datetime import datetime, timezone


          # ============================================================
          # BULLWERK MARKETS
          # FUNDAMENTAL MOMENTUM SCORE V8
          #
          # V8 kombiniert:
          #
          # 1. Umsatz-Momentum
          # 2. Gewinn-/EPS-Momentum
          # 3. operative Marge
          # 4. Free Cashflow
          # 5. Guidance -> vorerst N/A
          # 6. Orders/Backlog V6
          #
          # Orders/Backlog V6:
          # - RPO / Backlog / Bookings
          # - konkrete Werte aus SEC 10-Q / 10-K
          # - neuester Wert gegen unmittelbar vorherigen Wert
          # - 10-Q und 10-K dürfen aufeinanderfolgen
          # - ungewöhnliche Sprünge -> CHECK_REQUIRED
          #
          # N/A und CHECK_REQUIRED werden NICHT als 0 gewertet.
          #
          # Ergebnis wird auf 20 Punkte normalisiert.
          # ============================================================


          COMPANIES = {
              "AAPL": "0000320193",
              "MSFT": "0000789019",
              "NVDA": "0001045810",
              "AMD": "0000002488",
              "AMZN": "0001018724",
              "META": "0001326801",
              "GOOGL": "0001652044",
              "PLTR": "0001321655",
          }


          USER_AGENT = (
              "Bullwerk Markets "
              "contact: bullwerkmarkets@gmail.com"
          )


          HEADERS = {
              "User-Agent": USER_AGENT,
              "Accept-Encoding": "identity",
          }


          # ============================================================
          # HILFSFUNKTIONEN
          # ============================================================

          def parse_date(value):
              if not value:
                  return None

              try:
                  return datetime.strptime(
                      value,
                      "%Y-%m-%d"
                  ).date()

              except Exception:
                  return None


          def duration_days(row):
              start = parse_date(
                  row.get("start")
              )

              end = parse_date(
                  row.get("end")
              )

              if not start or not end:
                  return None

              return (
                  end - start
              ).days + 1


          def date_gap_days(newer, older):
              a = parse_date(newer)
              b = parse_date(older)

              if not a or not b:
                  return None

              return (
                  a - b
              ).days


          def starts_match(a, b, tolerance=7):
              if not a or not b:
                  return False

              da = parse_date(
                  a.get("start")
              )

              db = parse_date(
                  b.get("start")
              )

              if not da or not db:
                  return False

              return abs(
                  (da - db).days
              ) <= tolerance


          # ============================================================
          # SEC JSON
          # ============================================================

          def get_json(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": USER_AGENT,
                      "Accept": "application/json",
                      "Accept-Encoding": "identity",
                  }
              )

              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:

                  return json.loads(
                      response.read().decode(
                          "utf-8"
                      )
                  )


          # ============================================================
          # XBRL CONCEPTS
          # ============================================================

          CONCEPTS = {

              "Revenue": (
                  [
                      "RevenueFromContractWithCustomerExcludingAssessedTax",
                      "SalesRevenueNet",
                      "Revenues",
                  ],
                  ["USD"]
              ),

              "Net Income": (
                  [
                      "NetIncomeLoss",
                  ],
                  ["USD"]
              ),

              "Operating Income": (
                  [
                      "OperatingIncomeLoss",
                  ],
                  ["USD"]
              ),

              "Diluted EPS": (
                  [
                      "EarningsPerShareDiluted",
                  ],
                  [
                      "USD/shares",
                      "USD / shares"
                  ]
              ),

              "Operating Cash Flow": (
                  [
                      "NetCashProvidedByUsedInOperatingActivities",
                  ],
                  ["USD"]
              ),

              "Capital Expenditure": (
                  [
                      "PaymentsToAcquirePropertyPlantAndEquipment",
                  ],
                  ["USD"]
              ),
          }


          # ============================================================
          # CONCEPT LADEN
          # ============================================================

          def get_concept_rows(
              facts,
              concepts,
              units
          ):

              us_gaap = (
                  facts.get(
                      "facts",
                      {}
                  ).get(
                      "us-gaap",
                      {}
                  )
              )

              for concept in concepts:

                  concept_data = (
                      us_gaap.get(
                          concept
                      )
                  )

                  if not concept_data:
                      continue

                  available = (
                      concept_data.get(
                          "units",
                          {}
                      )
                  )

                  selected = None

                  for unit in units:
                      if unit in available:
                          selected = available[unit]
                          break

                  if selected is None:
                      if not available:
                          continue

                      selected = next(
                          iter(
                              available.values()
                          )
                      )

                  rows = []

                  for row in selected:

                      if row.get(
                          "form"
                      ) not in (
                          "10-Q",
                          "10-K"
                      ):
                          continue

                      if row.get(
                          "val"
                      ) is None:
                          continue

                      if not row.get(
                          "start"
                      ):
                          continue

                      if not row.get(
                          "end"
                      ):
                          continue

                      item = dict(row)

                      item[
                          "duration_days"
                      ] = duration_days(
                          item
                      )

                      rows.append(
                          item
                      )

                  if rows:
                      return concept, rows

              return None, []


          # ============================================================
          # DUPLIKATE ENTFERNEN
          # ============================================================

          def dedupe_rows(rows):
              best = {}

              for row in rows:

                  key = (
                      row.get("start"),
                      row.get("end"),
                      row.get("val"),
                      row.get("fy"),
                      row.get("fp"),
                      row.get("form"),
                  )

                  old = best.get(key)

                  if old is None:
                      best[key] = row
                      continue

                  if (
                      row.get("filed")
                      or ""
                  ) > (
                      old.get("filed")
                      or ""
                  ):
                      best[key] = row

              return list(
                  best.values()
              )


          # ============================================================
          # DIREKTE QUARTALE
          # ============================================================

          def direct_quarters(rows):
              result = []

              for row in rows:

                  days = row.get(
                      "duration_days"
                  )

                  if days is None:
                      continue

                  if not (
                      70 <= days <= 110
                  ):
                      continue

                  fp = row.get("fp")

                  if fp not in (
                      "Q1",
                      "Q2",
                      "Q3",
                      "Q4"
                  ):
                      continue

                  result.append({
                      "end":
                          row.get("end"),

                      "value":
                          row.get("val"),

                      "sec_fy":
                          row.get("fy"),

                      "sec_fp":
                          fp,

                      "filed":
                          row.get("filed"),

                      "source":
                          "DIRECT",
                  })

              return result


          # ============================================================
          # KUMULATIVE PERIODEN
          # ============================================================

          def newest(items):
              if not items:
                  return None

              return sorted(
                  items,
                  key=lambda x: (
                      x.get("filed") or "",
                      x.get("end") or "",
                  ),
                  reverse=True
              )[0]


          def find_periods_for_fy(
              rows,
              fy
          ):

              q1 = []
              h1 = []
              nine = []
              full = []

              for row in rows:

                  if row.get("fy") != fy:
                      continue

                  days = row.get(
                      "duration_days"
                  )

                  if days is None:
                      continue

                  if (
                      70 <= days <= 110
                      and row.get("fp") == "Q1"
                  ):
                      q1.append(row)

                  elif (
                      150 <= days <= 220
                  ):
                      h1.append(row)

                  elif (
                      230 <= days <= 310
                  ):
                      nine.append(row)

                  elif (
                      330 <= days <= 380
                      and row.get("form") == "10-K"
                  ):
                      full.append(row)

              return {
                  "q1": newest(q1),
                  "h1": newest(h1),
                  "nine": newest(nine),
                  "full": newest(full),
              }


          # ============================================================
          # ABGELEITETE QUARTALE
          # ============================================================

          def derived_quarters(rows):
              result = []

              fiscal_years = {
                  row.get("fy")
                  for row in rows
                  if row.get("fy") is not None
              }

              for fy in fiscal_years:

                  periods = find_periods_for_fy(
                      rows,
                      fy
                  )

                  q1 = periods["q1"]
                  h1 = periods["h1"]
                  nine = periods["nine"]
                  full = periods["full"]

                  # Q2 = H1 - Q1
                  if (
                      q1
                      and h1
                      and starts_match(
                          q1,
                          h1
                      )
                  ):
                      result.append({
                          "end":
                              h1.get("end"),

                          "value":
                              h1["val"]
                              - q1["val"],

                          "sec_fy":
                              fy,

                          "sec_fp":
                              "Q2",

                          "filed":
                              h1.get("filed"),

                          "source":
                              "DERIVED_H1_MINUS_Q1",
                      })

                  # Q3 = 9M - H1
                  if (
                      h1
                      and nine
                      and starts_match(
                          h1,
                          nine
                      )
                  ):
                      result.append({
                          "end":
                              nine.get("end"),

                          "value":
                              nine["val"]
                              - h1["val"],

                          "sec_fy":
                              fy,

                          "sec_fp":
                              "Q3",

                          "filed":
                              nine.get("filed"),

                          "source":
                              "DERIVED_9M_MINUS_H1",
                      })

                  # Q4 = FY - 9M
                  if (
                      nine
                      and full
                      and starts_match(
                          nine,
                          full
                      )
                  ):
                      result.append({
                          "end":
                              full.get("end"),

                          "value":
                              full["val"]
                              - nine["val"],

                          "sec_fy":
                              fy,

                          "sec_fp":
                              "Q4",

                          "filed":
                              full.get("filed"),

                          "source":
                              "DERIVED_FY_MINUS_9M",
                      })

              return result


          # ============================================================
          # QUARTALSREIHE
          # ============================================================

          def build_quarters(rows):
              rows = dedupe_rows(rows)

              candidates = (
                  derived_quarters(rows)
                  +
                  direct_quarters(rows)
              )

              best_by_end = {}

              for row in candidates:

                  end = row.get("end")

                  if not end:
                      continue

                  old = best_by_end.get(end)

                  if old is None:
                      best_by_end[end] = row
                      continue

                  if (
                      row.get("source") == "DIRECT"
                      and old.get("source") != "DIRECT"
                  ):
                      best_by_end[end] = row
                      continue

                  if (
                      row.get("source")
                      ==
                      old.get("source")
                      and (
                          row.get("filed")
                          or ""
                      ) > (
                          old.get("filed")
                          or ""
                      )
                  ):
                      best_by_end[end] = row

              quarters = list(
                  best_by_end.values()
              )

              quarters.sort(
                  key=lambda x:
                      x.get("end") or ""
              )

              clean = []

              for row in quarters:

                  if not clean:
                      clean.append(row)
                      continue

                  gap = date_gap_days(
                      row.get("end"),
                      clean[-1].get("end")
                  )

                  if gap is None:
                      continue

                  if gap < 45:
                      clean[-1] = row
                      continue

                  clean.append(row)

              for index, row in enumerate(
                  clean
              ):
                  row[
                      "sequence"
                  ] = index + 1

              clean.sort(
                  key=lambda x:
                      x.get("end") or "",
                  reverse=True
              )

              return clean


          # ============================================================
          # YOY
          # ============================================================

          def find_prior_year(
              current,
              quarters
          ):

              current_end = parse_date(
                  current.get("end")
              )

              if not current_end:
                  return None

              candidates = []

              for row in quarters:

                  if row is current:
                      continue

                  older_end = parse_date(
                      row.get("end")
                  )

                  if not older_end:
                      continue

                  gap = (
                      current_end
                      - older_end
                  ).days

                  if (
                      330 <= gap <= 400
                  ):
                      candidates.append(
                          (
                              abs(
                                  gap - 365
                              ),
                              row
                          )
                      )

              if not candidates:
                  return None

              candidates.sort(
                  key=lambda x:
                      x[0]
              )

              return candidates[0][1]


          def yoy_growth(
              current,
              previous
          ):

              if current is None:
                  return None

              if previous is None:
                  return None

              if previous == 0:
                  return None

              return (
                  (
                      current
                      - previous
                  )
                  /
                  abs(previous)
                  *
                  100
              )


          def build_yoy_series(
              quarters
          ):

              result = []

              for current in quarters:

                  previous = find_prior_year(
                      current,
                      quarters
                  )

                  if not previous:
                      continue

                  yoy = yoy_growth(
                      current.get("value"),
                      previous.get("value")
                  )

                  if yoy is None:
                      continue

                  item = dict(current)

                  item["yoy"] = yoy

                  item[
                      "prior_year_value"
                  ] = previous.get(
                      "value"
                  )

                  item[
                      "prior_year_end"
                  ] = previous.get(
                      "end"
                  )

                  result.append(
                      item
                  )

              result.sort(
                  key=lambda x:
                      x.get("end") or "",
                  reverse=True
              )

              return result


          # ============================================================
          # BESCHLEUNIGUNG
          # ============================================================

          def add_acceleration(series):
              if not series:
                  return []

              result = []

              for index, row in enumerate(
                  series
              ):

                  item = dict(row)

                  if (
                      index + 1
                      < len(series)
                  ):

                      older = (
                          series[
                              index + 1
                          ]
                      )

                      item[
                          "acceleration"
                      ] = (
                          row["yoy"]
                          -
                          older["yoy"]
                      )

                  else:
                      item[
                          "acceleration"
                      ] = None

                  result.append(
                      item
                  )

              return result


          # ============================================================
          # MARGE
          # ============================================================

          def map_by_end(rows):
              return {
                  row.get("end"): row
                  for row in rows
                  if row.get("end")
              }


          def build_margin_series(
              revenue_rows,
              operating_rows
          ):

              revenue_map = map_by_end(
                  revenue_rows
              )

              operating_map = map_by_end(
                  operating_rows
              )

              common = sorted(
                  set(revenue_map)
                  &
                  set(operating_map),
                  reverse=True
              )

              margins = []

              for end in common:

                  revenue = (
                      revenue_map[end]
                      .get("value")
                  )

                  operating = (
                      operating_map[end]
                      .get("value")
                  )

                  if (
                      revenue is None
                      or operating is None
                      or revenue == 0
                  ):
                      continue

                  margin = (
                      operating
                      /
                      revenue
                      *
                      100
                  )

                  base = revenue_map[end]

                  margins.append({
                      "end":
                          end,

                      "sequence":
                          base.get(
                              "sequence"
                          ),

                      "margin":
                          margin,

                      "margin_change_pp":
                          None,
                  })

              for row in margins:

                  current_end = parse_date(
                      row["end"]
                  )

                  if not current_end:
                      continue

                  candidates = []

                  for older in margins:

                      if older is row:
                          continue

                      older_end = parse_date(
                          older["end"]
                      )

                      if not older_end:
                          continue

                      gap = (
                          current_end
                          -
                          older_end
                      ).days

                      if (
                          330 <= gap <= 400
                      ):
                          candidates.append(
                              (
                                  abs(
                                      gap - 365
                                  ),
                                  older
                              )
                          )

                  if candidates:

                      candidates.sort(
                          key=lambda x:
                              x[0]
                      )

                      prior = (
                          candidates[0][1]
                      )

                      row[
                          "margin_change_pp"
                      ] = (
                          row["margin"]
                          -
                          prior["margin"]
                      )

              return margins


          # ============================================================
          # FREE CASHFLOW
          # ============================================================

          def build_fcf_series(
              ocf_rows,
              capex_rows
          ):

              ocf_map = map_by_end(
                  ocf_rows
              )

              capex_map = map_by_end(
                  capex_rows
              )

              common = sorted(
                  set(ocf_map)
                  &
                  set(capex_map),
                  reverse=True
              )

              result = []

              for end in common:

                  ocf = (
                      ocf_map[end]
                      .get("value")
                  )

                  capex = (
                      capex_map[end]
                      .get("value")
                  )

                  if (
                      ocf is None
                      or capex is None
                  ):
                      continue

                  base = ocf_map[end]

                  result.append({
                      "end":
                          end,

                      "sequence":
                          base.get(
                              "sequence"
                          ),

                      "sec_fy":
                          base.get(
                              "sec_fy"
                          ),

                      "sec_fp":
                          base.get(
                              "sec_fp"
                          ),

                      "filed":
                          base.get(
                              "filed"
                          ),

                      "source":
                          "FCF",

                      "ocf":
                          ocf,

                      "capex":
                          capex,

                      "value":
                          ocf - capex,
                  })

              return result


          # ============================================================
          # ORDERS / BACKLOG V6
          # ============================================================

          ORDER_METRICS = {

              "RPO": [
                  "remaining performance obligations",
                  "remaining performance obligation",
              ],

              "BACKLOG": [
                  "order backlog",
                  "contracted backlog",
                  "backlog",
              ],

              "BOOKINGS": [
                  "bookings",
              ],
          }


          MAX_POSITIVE_JUMP = 75.0
          MAX_NEGATIVE_JUMP = -50.0


          def clean_html(html):

              html = re.sub(
                  r"(?is)<script.*?>.*?</script>",
                  " ",
                  html
              )

              html = re.sub(
                  r"(?is)<style.*?>.*?</style>",
                  " ",
                  html
              )

              html = re.sub(
                  r"(?i)<br\s*/?>",
                  ". ",
                  html
              )

              html = re.sub(
                  r"(?i)</(?:p|div|tr|li|h1|h2|h3|td)>",
                  ". ",
                  html
              )

              html = re.sub(
                  r"(?is)<[^>]+>",
                  " ",
                  html
              )

              text = unescape(
                  html
              )

              text = text.replace(
                  "\xa0",
                  " "
              )

              text = re.sub(
                  r"\s+",
                  " ",
                  text
              )

              return text.strip()


          def money_to_billions(
              number,
              unit
          ):

              try:
                  value = float(
                      number.replace(
                          ",",
                          ""
                      )
                  )

              except Exception:
                  return None

              unit = unit.lower()

              if unit in (
                  "billion",
                  "billions"
              ):
                  return value

              if unit in (
                  "million",
                  "millions"
              ):
                  return (
                      value
                      /
                      1000.0
                  )

              if unit in (
                  "trillion",
                  "trillions"
              ):
                  return (
                      value
                      *
                      1000.0
                  )

              return None


          def find_metric_passages(
              text
          ):

              sentences = re.split(
                  r"(?<=[.!?])\s+",
                  text
              )

              results = []

              for index, sentence in enumerate(
                  sentences
              ):

                  lower = sentence.lower()

                  found_metric = None

                  for metric, terms in (
                      ORDER_METRICS.items()
                  ):

                      if any(
                          term in lower
                          for term in terms
                      ):
                          found_metric = metric
                          break

                  if not found_metric:
                      continue

                  start = max(
                      0,
                      index - 1
                  )

                  end = min(
                      len(sentences),
                      index + 2
                  )

                  passage = " ".join(
                      sentences[
                          start:end
                      ]
                  ).strip()

                  if (
                      40
                      <=
                      len(passage)
                      <=
                      3000
                  ):
                      results.append({
                          "metric":
                              found_metric,

                          "text":
                              passage,
                      })

              return results


          def extract_money_values(
              passage
          ):

              text = passage["text"]

              values = []

              patterns = [

                  (
                      r"\$\s*"
                      r"([0-9]+(?:\.[0-9]+)?)"
                      r"\s*"
                      r"(billion|billions|million|millions|"
                      r"trillion|trillions)"
                  ),

                  (
                      r"([0-9]+(?:\.[0-9]+)?)"
                      r"\s*"
                      r"(billion|billions|million|millions|"
                      r"trillion|trillions)"
                      r"\s+"
                      r"(?:U\.S\.\s*)?dollars"
                  ),
              ]

              for pattern in patterns:

                  for match in re.finditer(
                      pattern,
                      text,
                      flags=re.I
                  ):

                      value = (
                          money_to_billions(
                              match.group(1),
                              match.group(2)
                          )
                      )

                      if value is None:
                          continue

                      values.append({
                          "value_bn":
                              value,

                          "raw":
                              match.group(0),
                      })

              return values


          def choose_metric_value(
              passage_text,
              values
          ):

              if not values:
                  return None

              lower = (
                  passage_text.lower()
              )

              candidates = []

              for item in values:

                  raw_lower = (
                      item["raw"].lower()
                  )

                  position = (
                      lower.find(
                          raw_lower
                      )
                  )

                  context = lower[
                      max(
                          0,
                          position - 180
                      ):
                      min(
                          len(lower),
                          position + 180
                      )
                  ]

                  recognition_words = [
                      "recognized",
                      "recognize",
                      "recognition",
                      "next twelve months",
                      "next 12 months",
                      "over the next",
                  ]

                  candidate = dict(
                      item
                  )

                  candidate[
                      "recognition_context"
                  ] = any(
                      word in context
                      for word in recognition_words
                  )

                  candidates.append(
                      candidate
                  )

              preferred = [
                  item
                  for item in candidates
                  if not item[
                      "recognition_context"
                  ]
              ]

              pool = (
                  preferred
                  if preferred
                  else candidates
              )

              if not pool:
                  return None

              return max(
                  pool,
                  key=lambda x:
                      x["value_bn"]
              )


          def analyse_order_text(
              text
          ):

              passages = (
                  find_metric_passages(
                      text
                  )
              )

              candidates = []

              for passage in passages:

                  values = (
                      extract_money_values(
                          passage
                      )
                  )

                  chosen = (
                      choose_metric_value(
                          passage["text"],
                          values
                      )
                  )

                  if chosen:

                      candidates.append({
                          "metric":
                              passage["metric"],

                          "value_bn":
                              chosen["value_bn"],

                          "raw":
                              chosen["raw"],
                      })

              best_by_metric = {}

              for candidate in candidates:

                  metric = (
                      candidate["metric"]
                  )

                  if (
                      metric
                      not in best_by_metric
                  ):
                      best_by_metric[
                          metric
                      ] = candidate

                  elif (
                      candidate["value_bn"]
                      >
                      best_by_metric[
                          metric
                      ]["value_bn"]
                  ):
                      best_by_metric[
                          metric
                      ] = candidate

              return best_by_metric


          def load_sec_filings(
              cik
          ):

              url = (
                  "https://data.sec.gov/"
                  f"submissions/CIK{cik}.json"
              )

              request = urllib.request.Request(
                  url,
                  headers=HEADERS
              )

              try:

                  with urllib.request.urlopen(
                      request,
                      timeout=30
                  ) as response:

                      data = json.loads(
                          response.read().decode(
                              "utf-8"
                          )
                      )

              except Exception as error:

                  print(
                      "SEC Submissions Fehler:",
                      error
                  )

                  return []

              recent = (
                  data.get(
                      "filings",
                      {}
                  ).get(
                      "recent",
                      {}
                  )
              )

              filings = []

              forms = recent.get(
                  "form",
                  []
              )

              accessions = recent.get(
                  "accessionNumber",
                  []
              )

              documents = recent.get(
                  "primaryDocument",
                  []
              )

              dates = recent.get(
                  "filingDate",
                  []
              )

              for (
                  form,
                  accession,
                  document,
                  filing_date
              ) in zip(
                  forms,
                  accessions,
                  documents,
                  dates
              ):

                  if form not in (
                      "10-Q",
                      "10-K"
                  ):
                      continue

                  filings.append({
                      "form":
                          form,

                      "accession":
                          accession,

                      "document":
                          document,

                      "filing_date":
                          filing_date,
                  })

                  if len(filings) >= 12:
                      break

              return filings


          def load_filing_document(
              cik,
              filing
          ):

              accession = (
                  filing[
                      "accession"
                  ].replace(
                      "-",
                      ""
                  )
              )

              cik_number = str(
                  int(cik)
              )

              url = (
                  "https://www.sec.gov/"
                  "Archives/edgar/data/"
                  f"{cik_number}/"
                  f"{accession}/"
                  f"{filing['document']}"
              )

              request = urllib.request.Request(
                  url,
                  headers=HEADERS
              )

              try:

                  with urllib.request.urlopen(
                      request,
                      timeout=30
                  ) as response:

                      html = (
                          response.read()
                          .decode(
                              "utf-8",
                              errors="ignore"
                          )
                      )

              except Exception as error:

                  print(
                      "Filing Fehler:",
                      filing[
                          "filing_date"
                      ],
                      error
                  )

                  return None

              metrics = (
                  analyse_order_text(
                      clean_html(
                          html
                      )
                  )
              )

              return {
                  "filing_date":
                      filing[
                          "filing_date"
                      ],

                  "form":
                      filing["form"],

                  "metrics":
                      metrics,
              }


          def order_change(
              current,
              previous
          ):

              if (
                  current is None
                  or previous is None
                  or previous <= 0
              ):
                  return None

              return (
                  (
                      current
                      /
                      previous
                  )
                  -
                  1
              ) * 100


          def score_orders_change(
              change
          ):

              if change is None:

                  return {
                      "score":
                          None,

                      "status":
                          "N/A",

                      "reason":
                          "Keine Veränderung berechenbar.",
                  }

              if (
                  change
                  >
                  MAX_POSITIVE_JUMP
              ):

                  return {
                      "score":
                          None,

                      "status":
                          "CHECK_REQUIRED",

                      "reason":
                          "Ungewöhnlich großer positiver Sprung.",
                  }

              if (
                  change
                  <
                  MAX_NEGATIVE_JUMP
              ):

                  return {
                      "score":
                          None,

                      "status":
                          "CHECK_REQUIRED",

                      "reason":
                          "Ungewöhnlich großer negativer Sprung.",
                  }

              if change >= 15:

                  return {
                      "score":
                          3,

                      "status":
                          "STRONG_POSITIVE",

                      "reason":
                          "Starkes Wachstum.",
                  }

              if change >= 5:

                  return {
                      "score":
                          3,

                      "status":
                          "POSITIVE",

                      "reason":
                          "Klare positive Entwicklung.",
                  }

              if change >= -5:

                  return {
                      "score":
                          2,

                      "status":
                          "STABLE",

                      "reason":
                          "Stabile bis leicht positive Entwicklung.",
                  }

              if change >= -15:

                  return {
                      "score":
                          1,

                      "status":
                          "CAUTIOUS",

                      "reason":
                          "Moderate Verschlechterung.",
                  }

              return {
                  "score":
                      0,

                  "status":
                      "WEAKER",

                  "reason":
                      "Deutliche Verschlechterung.",
              }


          def build_order_comparison(
              filing_results,
              metric
          ):

              observations = []

              for result in filing_results:

                  if (
                      metric
                      in result["metrics"]
                  ):

                      observations.append({
                          "date":
                              result[
                                  "filing_date"
                              ],

                          "form":
                              result["form"],

                          "value":
                              result[
                                  "metrics"
                              ][
                                  metric
                              ][
                                  "value_bn"
                              ],
                      })

              if len(
                  observations
              ) < 2:
                  return None

              # SEC submissions sind neu -> alt.
              current = observations[0]
              previous = observations[1]

              change = order_change(
                  current["value"],
                  previous["value"]
              )

              scoring = (
                  score_orders_change(
                      change
                  )
              )

              return {
                  "metric":
                      metric,

                  "current":
                      current,

                  "previous":
                      previous,

                  "change":
                      change,

                  "score":
                      scoring["score"],

                  "status":
                      scoring["status"],

                  "reason":
                      scoring["reason"],
              }


          def get_orders_backlog(
              cik
          ):

              filings = (
                  load_sec_filings(
                      cik
                  )
              )

              results = []

              for filing in filings:

                  result = (
                      load_filing_document(
                          cik,
                          filing
                      )
                  )

                  if result:
                      results.append(
                          result
                      )

                  time.sleep(
                      0.12
                  )

              comparisons = []

              for metric in (
                  "RPO",
                  "BACKLOG",
                  "BOOKINGS"
              ):

                  comparison = (
                      build_order_comparison(
                          results,
                          metric
                      )
                  )

                  if comparison:
                      comparisons.append(
                          comparison
                      )

              if not comparisons:

                  return {
                      "score":
                          None,

                      "status":
                          "N/A",

                      "metric":
                          None,

                      "changePct":
                          None,

                      "currentValueBn":
                          None,

                      "previousValueBn":
                          None,

                      "currentForm":
                          None,

                      "previousForm":
                          None,

                      "currentFilingDate":
                          None,

                      "previousFilingDate":
                          None,

                      "reason":
                          (
                              "Keine zwei vergleichbaren "
                              "RPO-, Backlog- oder "
                              "Bookings-Werte gefunden."
                          ),
                  }

              # Priorität:
              # echter Backlog vor Bookings vor RPO.
              priority = {
                  "BACKLOG": 3,
                  "BOOKINGS": 2,
                  "RPO": 1,
              }

              comparisons.sort(
                  key=lambda x:
                      priority[
                          x["metric"]
                      ],
                  reverse=True
              )

              best = comparisons[0]

              return {
                  "score":
                      best["score"],

                  "status":
                      best["status"],

                  "metric":
                      best["metric"],

                  "changePct":
                      (
                          round(
                              best["change"],
                              1
                          )
                          if best[
                              "change"
                          ] is not None
                          else None
                      ),

                  "currentValueBn":
                      round(
                          best[
                              "current"
                          ][
                              "value"
                          ],
                          3
                      ),

                  "previousValueBn":
                      round(
                          best[
                              "previous"
                          ][
                              "value"
                          ],
                          3
                      ),

                  "currentForm":
                      best[
                          "current"
                      ][
                          "form"
                      ],

                  "previousForm":
                      best[
                          "previous"
                      ][
                          "form"
                      ],

                  "currentFilingDate":
                      best[
                          "current"
                      ][
                          "date"
                      ],

                  "previousFilingDate":
                      best[
                          "previous"
                      ][
                          "date"
                      ],

                  "reason":
                      best["reason"],
              }


          # ============================================================
          # FUNDAMENTAL SCORE
          # ============================================================

          def score_revenue(row):

              if (
                  not row
                  or row.get("yoy")
                  is None
              ):
                  return None

              yoy = row["yoy"]

              acc = row.get(
                  "acceleration"
              )

              acc = (
                  0
                  if acc is None
                  else acc
              )

              if (
                  (
                      yoy >= 15
                      and acc > 0
                  )
                  or
                  (
                      yoy >= 25
                      and acc >= -3
                  )
              ):
                  return 4

              if (
                  (
                      yoy >= 8
                      and acc >= 0
                  )
                  or
                  (
                      yoy >= 15
                      and acc >= -8
                  )
              ):
                  return 3

              if yoy >= 3:
                  return 2

              if yoy >= 0:
                  return 1

              return 0


          def score_profit_eps(
              income_row,
              eps_row
          ):

              values = []

              for row in (
                  income_row,
                  eps_row
              ):

                  if (
                      row
                      and row.get("yoy")
                      is not None
                  ):

                      acc = row.get(
                          "acceleration"
                      )

                      acc = (
                          0
                          if acc is None
                          else acc
                      )

                      values.append(
                          (
                              row["yoy"],
                              acc
                          )
                      )

              if not values:
                  return None

              growth = max(
                  value[0]
                  for value in values
              )

              acceleration = max(
                  value[1]
                  for value in values
              )

              if (
                  growth >= 20
                  and acceleration > 0
              ):
                  return 4

              if (
                  (
                      growth >= 10
                      and acceleration >= 0
                  )
                  or
                  (
                      growth >= 20
                      and acceleration >= -8
                  )
              ):
                  return 3

              if growth >= 3:
                  return 2

              if growth >= 0:
                  return 1

              return 0


          def score_margin(row):

              if not row:
                  return None

              change = row.get(
                  "margin_change_pp"
              )

              if change is None:
                  return None

              if change >= 1.0:
                  return 3

              if change >= 0.25:
                  return 2

              if change >= -0.25:
                  return 1

              return 0


          def score_fcf(row):

              if (
                  not row
                  or row.get("yoy")
                  is None
              ):
                  return None

              yoy = row["yoy"]

              acc = row.get(
                  "acceleration"
              )

              acc = (
                  0
                  if acc is None
                  else acc
              )

              if (
                  yoy >= 15
                  and acc >= 0
              ):
                  return 3

              if (
                  (
                      yoy >= 5
                      and acc >= 0
                  )
                  or
                  (
                      yoy >= 15
                      and acc >= -8
                  )
              ):
                  return 2

              if yoy >= 0:
                  return 1

              return 0


          # ============================================================
          # HAUPTLAUF
          # ============================================================

          fundamental_results = []


          for symbol, cik in (
              COMPANIES.items()
          ):

              print("")
              print("=" * 90)

              print(
                  "BULLWERK FUNDAMENTAL "
