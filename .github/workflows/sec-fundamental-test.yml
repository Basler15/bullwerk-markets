name: Bullwerk Fundamental Momentum Test V2

on:
  workflow_dispatch:

jobs:
  fundamental-momentum-test:
    runs-on: ubuntu-latest

    steps:
      - name: Fundamental Momentum V2 berechnen
        run: |
          python3 <<'PY'

          import json
          import time
          import urllib.request
          from datetime import datetime


          # ============================================================
          # BULLWERK MARKETS
          # FUNDAMENTAL MOMENTUM TEST V2
          #
          # Schwerpunkt:
          # - echte SEC Einzelquartale
          # - Umsatz / Gewinn / EPS
          # - operative Marge
          # - robuste FCF Quartalslogik
          #
          # Noch KEIN Bullwerk 0-20 Score.
          # ============================================================


          companies = {
              "AAPL": "0000320193",
              "MSFT": "0000789019"
          }


          USER_AGENT = (
              "Bullwerk Markets "
              "contact: bullwerkmarkets@gmail.com"
          )


          # ============================================================
          # SEC LADEN
          # ============================================================

          def get_json(url):

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": USER_AGENT,
                      "Accept": "application/json",
                      "Accept-Encoding": "identity"
                  }
              )

              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:

                  print(
                      f"HTTP Status: {response.status}"
                  )

                  return json.loads(
                      response.read().decode("utf-8")
                  )


          # ============================================================
          # DATUM
          # ============================================================

          def parse_date(value):

              if not value:
                  return None

              try:
                  return datetime.strptime(
                      value,
                      "%Y-%m-%d"
                  ).date()

              except ValueError:
                  return None


          def duration_days(row):

              start = parse_date(
                  row.get("start")
              )

              end = parse_date(
                  row.get("end")
              )

              if not start or not end:
                  return None

              return (
                  end - start
              ).days + 1


          # ============================================================
          # SEC CONCEPT
          # ============================================================

          def get_concept_rows(
              facts,
              concepts,
              preferred_units
          ):

              for concept in concepts:

                  try:
                      units = (
                          facts["facts"]
                          ["us-gaap"]
                          [concept]
                          ["units"]
                      )

                  except KeyError:
                      continue


                  selected = None


                  for unit in preferred_units:

                      if unit in units:
                          selected = units[unit]
                          break


                  if selected is None:

                      if not units:
                          continue

                      selected = next(
                          iter(units.values())
                      )


                  rows = []


                  for row in selected:

                      if row.get("form") not in (
                          "10-Q",
                          "10-K"
                      ):
                          continue

                      if row.get("val") is None:
                          continue

                      if not row.get("start"):
                          continue

                      if not row.get("end"):
                          continue


                      new_row = dict(row)

                      new_row["concept"] = concept

                      new_row["duration_days"] = (
                          duration_days(row)
                      )

                      rows.append(new_row)


                  if rows:
                      return concept, rows


              return None, []


          # ============================================================
          # DUPLIKATE
          # ============================================================

          def dedupe_rows(rows):

              best = {}


              for row in rows:

                  key = (
                      row.get("start"),
                      row.get("end"),
                      row.get("val"),
                      row.get("fy"),
                      row.get("fp")
                  )


                  old = best.get(key)


                  if old is None:
                      best[key] = row
                      continue


                  if (
                      row.get("filed") or ""
                  ) > (
                      old.get("filed") or ""
                  ):
                      best[key] = row


              return list(
                  best.values()
              )


          # ============================================================
          # DIREKTE EINZELQUARTALE
          # ============================================================

          def direct_quarters(rows):

              result = []


              for row in rows:

                  days = row.get(
                      "duration_days"
                  )


                  if days is None:
                      continue


                  if not (
                      70 <= days <= 110
                  ):
                      continue


                  fp = row.get("fp")


                  if fp not in (
                      "Q1",
                      "Q2",
                      "Q3",
                      "Q4"
                  ):
                      continue


                  result.append({

                      "start":
                          row.get("start"),

                      "end":
                          row.get("end"),

                      "value":
                          row.get("val"),

                      "fy":
                          row.get("fy"),

                      "fp":
                          fp,

                      "filed":
                          row.get("filed"),

                      "form":
                          row.get("form"),

                      "source":
                          "DIRECT"
                  })


              return result


          # ============================================================
          # KUMULATIVE SEC PERIODEN NACH FY
          # ============================================================

          def find_periods_for_fy(
              rows,
              fy
          ):

              q1 = []
              h1 = []
              nine_month = []
              full_year = []


              for row in rows:

                  if row.get("fy") != fy:
                      continue


                  days = row.get(
                      "duration_days"
                  )


                  if days is None:
                      continue


                  if (
                      70 <= days <= 110
                      and row.get("fp") == "Q1"
                  ):
                      q1.append(row)


                  elif 150 <= days <= 220:
                      h1.append(row)


                  elif 230 <= days <= 310:
                      nine_month.append(row)


                  elif (
                      330 <= days <= 380
                      and row.get("form") == "10-K"
                  ):
                      full_year.append(row)


              def newest(items):

                  if not items:
                      return None


                  return sorted(
                      items,
                      key=lambda x: (
                          x.get("filed") or "",
                          x.get("end") or ""
                      ),
                      reverse=True
                  )[0]


              return {
                  "q1": newest(q1),
                  "h1": newest(h1),
                  "nine_month":
                      newest(nine_month),
                  "full_year":
                      newest(full_year)
              }


          # ============================================================
          # ABGELEITETE QUARTALE
          # ============================================================

          def derived_quarters(rows):

              result = []

              fiscal_years = sorted({
                  row.get("fy")
                  for row in rows
                  if row.get("fy") is not None
              })


              for fy in fiscal_years:

                  periods = (
                      find_periods_for_fy(
                          rows,
                          fy
                      )
                  )


                  q1 = periods["q1"]

                  h1 = periods["h1"]

                  nine = periods[
                      "nine_month"
                  ]

                  fy_row = periods[
                      "full_year"
                  ]


                  # Q2 = H1 - Q1
                  if (
                      q1
                      and h1
                      and q1.get("start")
                          == h1.get("start")
                  ):

                      result.append({

                          "end":
                              h1.get("end"),

                          "value":
                              h1["val"]
                              - q1["val"],

                          "fy":
                              fy,

                          "fp":
                              "Q2",

                          "filed":
                              h1.get("filed"),

                          "source":
                              "DERIVED_H1_MINUS_Q1"
                      })


                  # Q3 = 9M - H1
                  if (
                      h1
                      and nine
                      and h1.get("start")
                          == nine.get("start")
                  ):

                      result.append({

                          "end":
                              nine.get("end"),

                          "value":
                              nine["val"]
                              - h1["val"],

                          "fy":
                              fy,

                          "fp":
                              "Q3",

                          "filed":
                              nine.get("filed"),

                          "source":
                              "DERIVED_9M_MINUS_H1"
                      })


                  # Q4 = FY - 9M
                  if (
                      nine
                      and fy_row
                      and nine.get("start")
                          == fy_row.get("start")
                  ):

                      result.append({

                          "end":
                              fy_row.get("end"),

                          "value":
                              fy_row["val"]
                              - nine["val"],

                          "fy":
                              fy,

                          "fp":
                              "Q4",

                          "filed":
                              fy_row.get("filed"),

                          "source":
                              "DERIVED_FY_MINUS_9M"
                      })


              return result


          # ============================================================
          # QUARTALE AUFBAUEN
          # ============================================================

          def build_quarters(rows):

              rows = dedupe_rows(rows)

              direct = direct_quarters(
                  rows
              )

              derived = derived_quarters(
                  rows
              )


              # Schlüssel jetzt FY + FP.
              # Das ist wichtig für FCF.
              best = {}


              for row in (
                  derived + direct
              ):

                  key = (
                      row.get("fy"),
                      row.get("fp")
                  )


                  if (
                      key[0] is None
                      or key[1] not in (
                          "Q1",
                          "Q2",
                          "Q3",
                          "Q4"
                      )
                  ):
                      continue


                  old = best.get(key)


                  if old is None:

                      best[key] = row
                      continue


                  # DIRECT bevorzugen
                  if (
                      row.get("source")
                      == "DIRECT"
                      and old.get("source")
                      != "DIRECT"
                  ):

                      best[key] = row

                      continue


                  # Bei gleichem Typ neueste
                  # Einreichung bevorzugen.
                  if (
                      row.get("source")
                      == old.get("source")
                      and (
                          row.get("filed") or ""
                      ) > (
                          old.get("filed") or ""
                      )
                  ):

                      best[key] = row


              quarters = list(
                  best.values()
              )


              quarters.sort(
                  key=lambda x: (
                      x.get("fy") or 0,
                      {
                          "Q1": 1,
                          "Q2": 2,
                          "Q3": 3,
                          "Q4": 4
                      }.get(
                          x.get("fp"),
                          0
                      )
                  ),
                  reverse=True
              )


              return quarters


          # ============================================================
          # YOY
          # ============================================================

          def yoy_growth(
              current,
              previous
          ):

              if current is None:
                  return None

              if previous is None:
                  return None

              if previous == 0:
                  return None


              return (
                  (
                      current - previous
                  )
                  / abs(previous)
                  * 100
              )


          def build_yoy_series(
              quarters
          ):

              lookup = {
                  (
                      row.get("fy"),
                      row.get("fp")
                  ): row
                  for row in quarters
              }


              result = []


              for current in quarters:

                  fy = current.get("fy")

                  fp = current.get("fp")


                  if fy is None:
                      continue


                  previous = lookup.get(
                      (
                          fy - 1,
                          fp
                      )
                  )


                  if previous is None:
                      continue


                  growth = yoy_growth(
                      current.get("value"),
                      previous.get("value")
                  )


                  if growth is None:
                      continue


                  result.append({

                      "end":
                          current.get("end"),

                      "fy":
                          fy,

                      "fp":
                          fp,

                      "value":
                          current.get("value"),

                      "previous_value":
                          previous.get("value"),

                      "yoy":
                          growth
                  })


              result.sort(
                  key=lambda x: (
                      x.get("fy") or 0,
                      {
                          "Q1": 1,
                          "Q2": 2,
                          "Q3": 3,
                          "Q4": 4
                      }.get(
                          x.get("fp"),
                          0
                      )
                  ),
                  reverse=True
              )


              return result


          # ============================================================
          # BESCHLEUNIGUNG
          #
          # Aktuelles YoY minus unmittelbar
          # vorheriges Quartals-YoY.
          #
          # Nur wenn die Quartale tatsächlich
          # chronologisch aufeinander folgen.
          # ============================================================

          def quarter_index(row):

              fp_number = {
                  "Q1": 1,
                  "Q2": 2,
                  "Q3": 3,
                  "Q4": 4
              }.get(
                  row.get("fp")
              )


              fy = row.get("fy")


              if (
                  fy is None
                  or fp_number is None
              ):
                  return None


              return (
                  fy * 4
                  + fp_number
              )


          def add_acceleration(
              series
          ):

              result = []


              for i, row in enumerate(
                  series
              ):

                  new_row = dict(row)

                  new_row[
                      "acceleration"
                  ] = None


                  if i + 1 < len(series):

                      older = series[
                          i + 1
                      ]


                      current_index = (
                          quarter_index(row)
                      )

                      older_index = (
                          quarter_index(older)
                      )


                      # Nur direkt aufeinanderfolgende
                      # Quartale vergleichen.
                      if (
                          current_index is not None
                          and older_index
                              is not None
                          and current_index
                              - older_index == 1
                      ):

                          new_row[
                              "acceleration"
                          ] = (
                              row["yoy"]
                              - older["yoy"]
                          )


                  result.append(
                      new_row
                  )


              return result


          # ============================================================
          # OPERATIVE MARGE
          # ============================================================

          def build_margin_series(
              revenue,
              operating_income
          ):

              rev_lookup = {
                  (
                      row.get("fy"),
                      row.get("fp")
                  ): row
                  for row in revenue
              }


              op_lookup = {
                  (
                      row.get("fy"),
                      row.get("fp")
                  ): row
                  for row in operating_income
              }


              result = []


              for key in (
                  set(rev_lookup)
                  & set(op_lookup)
              ):

                  rev = rev_lookup[
                      key
                  ]

                  op = op_lookup[
                      key
                  ]


                  if (
                      rev.get("value")
                      is None
                      or rev["value"] == 0
                      or op.get("value")
                      is None
                  ):
                      continue


                  margin = (
                      op["value"]
                      / rev["value"]
                      * 100
                  )


                  result.append({

                      "end":
                          rev.get("end"),

                      "fy":
                          key[0],

                      "fp":
                          key[1],

                      "margin":
                          margin
                  })


              result.sort(
                  key=lambda x: (
                      x.get("fy") or 0,
                      {
                          "Q1": 1,
                          "Q2": 2,
                          "Q3": 3,
                          "Q4": 4
                      }.get(
                          x.get("fp"),
                          0
                      )
                  ),
                  reverse=True
              )


              lookup = {
                  (
                      row.get("fy"),
                      row.get("fp")
                  ): row
                  for row in result
              }


              for row in result:

                  previous = lookup.get(
                      (
                          row["fy"] - 1,
                          row["fp"]
                      )
                  )


                  if previous:

                      row[
                          "margin_change_pp"
                      ] = (
                          row["margin"]
                          - previous["margin"]
                      )

                  else:

                      row[
                          "margin_change_pp"
                      ] = None


              return result


          # ============================================================
          # ROBUSTER FREE CASH FLOW
          #
          # WICHTIG:
          # OCF und CapEx werden NICHT nach Datum
          # verbunden, sondern nach FY + Quartal.
          #
          # Wenn eine Seite fehlt:
          # -> kein FCF für dieses Quartal.
          # ============================================================

          def build_fcf_series(
              ocf,
              capex
          ):

              ocf_lookup = {
                  (
                      row.get("fy"),
                      row.get("fp")
                  ): row
                  for row in ocf
              }


              capex_lookup = {
                  (
                      row.get("fy"),
                      row.get("fp")
                  ): row
                  for row in capex
              }


              result = []


              common = (
                  set(ocf_lookup)
                  & set(capex_lookup)
              )


              for key in common:

                  ocf_row = (
                      ocf_lookup[key]
                  )

                  capex_row = (
                      capex_lookup[key]
                  )


                  ocf_value = (
                      ocf_row.get("value")
                  )

                  capex_value = (
                      capex_row.get("value")
                  )


                  if (
                      ocf_value is None
                      or capex_value is None
                  ):
                      continue


                  fcf = (
                      ocf_value
                      - capex_value
                  )


                  result.append({

                      "end":
                          ocf_row.get("end")
                          or capex_row.get("end"),

                      "fy":
                          key[0],

                      "fp":
                          key[1],

                      "value":
                          fcf,

                      "ocf":
                          ocf_value,

                      "capex":
                          capex_value,

                      "ocf_source":
                          ocf_row.get("source"),

                      "capex_source":
                          capex_row.get("source")
                  })


              result.sort(
                  key=lambda x: (
                      x.get("fy") or 0,
                      {
                          "Q1": 1,
                          "Q2": 2,
                          "Q3": 3,
                          "Q4": 4
                      }.get(
                          x.get("fp"),
                          0
                      )
                  ),
                  reverse=True
              )


              return result


          # ============================================================
          # AUSGABE
          # ============================================================

          def format_acceleration(
              value
          ):

              if value is None:
                  return "n/a"

              return (
                  f"{value:+.2f} PP"
              )


          def print_growth(
              title,
              series,
              billions=True
          ):

              print("")
              print(
                  f"--- {title} ---"
              )


              if not series:

                  print(
                      "Keine ausreichenden Daten."
                  )

                  return


              for row in series[:8]:

                  value = row.get(
                      "value"
                  )


                  if billions:

                      value_text = (
                          f"{value / 1_000_000_000:.3f} Mrd."
                      )

                  else:

                      value_text = (
                          f"{value:.2f}"
                      )


                  print(
                      row.get("end"),
                      "| FY",
                      row.get("fy"),
                      "|",
                      row.get("fp"),
                      "| Wert:",
                      value_text,
                      "| YoY:",
                      f"{row['yoy']:+.2f} %",
                      "| Beschleunigung:",
                      format_acceleration(
                          row.get(
                              "acceleration"
                          )
                      )
                  )


          # ============================================================
          # CONCEPTS
          # ============================================================

          concepts = {

              "Revenue": (
                  [
                      "RevenueFromContractWithCustomerExcludingAssessedTax",
                      "SalesRevenueNet",
                      "Revenues"
                  ],
                  ["USD"]
              ),

              "Net Income": (
                  [
                      "NetIncomeLoss"
                  ],
                  ["USD"]
              ),

              "Operating Income": (
                  [
                      "OperatingIncomeLoss"
                  ],
                  ["USD"]
              ),

              "Diluted EPS": (
                  [
                      "EarningsPerShareDiluted"
                  ],
                  ["USD/shares"]
              ),

              "Operating Cash Flow": (
                  [
                      "NetCashProvidedByUsedInOperatingActivities"
                  ],
                  ["USD"]
              ),

              "Capital Expenditure": (
                  [
                      "PaymentsToAcquirePropertyPlantAndEquipment"
                  ],
                  ["USD"]
              )
          }


          # ============================================================
          # HAUPTLAUF
          # ============================================================

          for symbol, cik in companies.items():

              print("")
              print("=" * 86)

              print(
                  f"BULLWERK FUNDAMENTAL MOMENTUM V2: "
                  f"{symbol}"
              )

              print("=" * 86)


              url = (
                  "https://data.sec.gov/"
                  "api/xbrl/companyfacts/"
                  f"CIK{cik}.json"
              )


              try:

                  facts = get_json(url)

              except Exception as error:

                  print(
                      f"SEC FEHLER bei {symbol}: "
                      f"{error}"
                  )

                  continue


              print(
                  "Unternehmen:",
                  facts.get("entityName")
              )


              company_data = {}


              for label, (
                  possible_concepts,
                  units
              ) in concepts.items():

                  concept, rows = (
                      get_concept_rows(
                          facts,
                          possible_concepts,
                          units
                      )
                  )


                  quarters = (
                      build_quarters(rows)
                      if rows
                      else []
                  )


                  company_data[
                      label
                  ] = quarters


                  print(
                      label,
                      ":",
                      len(quarters),
                      "Quartale",
                      "| Concept:",
                      concept
                  )


              # ========================================================
              # UMSATZ
              # ========================================================

              revenue_yoy = (
                  add_acceleration(
                      build_yoy_series(
                          company_data[
                              "Revenue"
                          ]
                      )
                  )
              )


              print_growth(
                  "UMSATZ MOMENTUM",
                  revenue_yoy
              )


              # ========================================================
              # GEWINN
              # ========================================================

              income_yoy = (
                  add_acceleration(
                      build_yoy_series(
                          company_data[
                              "Net Income"
                          ]
                      )
                  )
              )


              print_growth(
                  "GEWINN MOMENTUM",
                  income_yoy
              )


              # ========================================================
              # EPS
              # ========================================================

              eps_yoy = (
                  add_acceleration(
                      build_yoy_series(
                          company_data[
                              "Diluted EPS"
                          ]
                      )
                  )
              )


              print_growth(
                  "EPS MOMENTUM",
                  eps_yoy,
                  billions=False
              )


              # ========================================================
              # MARGE
              # ========================================================

              margins = (
                  build_margin_series(
                      company_data[
                          "Revenue"
                      ],
                      company_data[
                          "Operating Income"
                      ]
                  )
              )


              print("")
              print(
                  "--- OPERATIVE MARGE ---"
              )


              for row in margins[:8]:

                  change = row.get(
                      "margin_change_pp"
                  )


                  print(
                      row.get("end"),
                      "| FY",
                      row.get("fy"),
                      "|",
                      row.get("fp"),
                      "| Marge:",
                      f"{row['margin']:.2f} %",
                      "| YoY Veränderung:",
                      (
                          f"{change:+.2f} PP"
                          if change is not None
                          else "n/a"
                      )
                  )


              # ========================================================
              # FCF
              # ========================================================

              fcf_quarters = (
                  build_fcf_series(
                      company_data[
                          "Operating Cash Flow"
                      ],
                      company_data[
                          "Capital Expenditure"
                      ]
                  )
              )


              print("")
              print(
                  "--- FCF EINZELQUARTALE ---"
              )


              if not fcf_quarters:

                  print(
                      "Keine vollständigen "
                      "OCF/CapEx Quartalspaare."
                  )


              for row in fcf_quarters[:12]:

                  print(
                      "FY",
                      row.get("fy"),
                      row.get("fp"),
                      "| FCF:",
                      f"{row['value'] / 1_000_000_000:.3f} Mrd.",
                      "| OCF:",
                      f"{row['ocf'] / 1_000_000_000:.3f}",
                      "| CapEx:",
                      f"{row['capex'] / 1_000_000_000:.3f}",
                      "| Quellen:",
                      row.get("ocf_source"),
                      "/",
                      row.get("capex_source")
                  )


              fcf_yoy = (
                  add_acceleration(
                      build_yoy_series(
                          fcf_quarters
                      )
                  )
              )


              print_growth(
                  "FREE CASH FLOW MOMENTUM",
                  fcf_yoy
              )


              # ========================================================
              # SNAPSHOT
              # ========================================================

              print("")
              print(
                  "--- AKTUELLER FUNDAMENTAL SNAPSHOT ---"
              )


              def latest(series):

                  return (
                      series[0]
                      if series
                      else None
                  )


              rev = latest(
                  revenue_yoy
              )

              inc = latest(
                  income_yoy
              )

              eps = latest(
                  eps_yoy
              )

              margin = latest(
                  margins
              )

              fcf = latest(
                  fcf_yoy
              )


              if rev:

                  print(
                      "Umsatz YoY:",
                      f"{rev['yoy']:+.2f} %",
                      "| Beschleunigung:",
                      format_acceleration(
                          rev.get(
                              "acceleration"
                          )
                      )
                  )


              if inc:

                  print(
                      "Gewinn YoY:",
                      f"{inc['yoy']:+.2f} %",
                      "| Beschleunigung:",
                      format_acceleration(
                          inc.get(
                              "acceleration"
                          )
                      )
                  )


              if eps:

                  print(
                      "EPS YoY:",
                      f"{eps['yoy']:+.2f} %",
                      "| Beschleunigung:",
                      format_acceleration(
                          eps.get(
                              "acceleration"
                          )
                      )
                  )


              if margin:

                  change = margin.get(
                      "margin_change_pp"
                  )


                  print(
                      "Operative Marge:",
                      f"{margin['margin']:.2f} %",
                      "| YoY:",
                      (
                          f"{change:+.2f} PP"
                          if change is not None
                          else "n/a"
                      )
                  )


              if fcf:

                  print(
                      "FCF YoY:",
                      f"{fcf['yoy']:+.2f} %",
                      "| Beschleunigung:",
                      format_acceleration(
                          fcf.get(
                              "acceleration"
                          )
                      )
                  )

              else:

                  print(
                      "FCF Momentum: "
                      "nicht ausreichend "
                      "verlässliche Quartale"
                  )


              print("")
              print(
                  f"{symbol} abgeschlossen."
              )


              time.sleep(1)


          print("")
          print("=" * 86)

          print(
              "Bullwerk Fundamental "
              "Momentum Test V2 beendet."
          )

          print("=" * 86)

          PY
