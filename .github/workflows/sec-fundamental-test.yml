name: Bullwerk Fundamental Momentum Test

on:
  workflow_dispatch:

jobs:
  fundamental-momentum-test:
    runs-on: ubuntu-latest

    steps:
      - name: Fundamental Momentum berechnen
        run: |
          python3 <<'PY'

          import json
          import time
          import urllib.request
          from datetime import datetime


          # ============================================================
          # BULLWERK MARKETS
          # FUNDAMENTAL MOMENTUM TEST
          #
          # Ziel:
          # SEC Companyfacts -> echte Quartale ->
          # YoY Wachstum -> Beschleunigung
          #
          # NOCH KEIN Bullwerk Score.
          # ============================================================


          companies = {
              "AAPL": "0000320193",
              "MSFT": "0000789019"
          }


          USER_AGENT = (
              "Bullwerk Markets "
              "contact: bullwerkmarkets@gmail.com"
          )


          # ============================================================
          # SEC DATEN LADEN
          # ============================================================

          def get_json(url):

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": USER_AGENT,
                      "Accept": "application/json",
                      "Accept-Encoding": "identity"
                  }
              )

              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:

                  print(
                      f"HTTP Status: {response.status}"
                  )

                  raw = response.read()

                  return json.loads(
                      raw.decode("utf-8")
                  )


          # ============================================================
          # DATUM
          # ============================================================

          def parse_date(value):

              if not value:
                  return None

              try:

                  return datetime.strptime(
                      value,
                      "%Y-%m-%d"
                  ).date()

              except ValueError:

                  return None


          def duration_days(row):

              start = parse_date(
                  row.get("start")
              )

              end = parse_date(
                  row.get("end")
              )

              if not start or not end:
                  return None

              return (
                  end - start
              ).days + 1


          # ============================================================
          # SEC CONCEPT LADEN
          # ============================================================

          def get_concept_rows(
              facts,
              concepts,
              preferred_units
          ):

              for concept in concepts:

                  try:

                      units = (
                          facts["facts"]
                          ["us-gaap"]
                          [concept]
                          ["units"]
                      )

                  except KeyError:

                      continue


                  selected = None


                  for unit in preferred_units:

                      if unit in units:

                          selected = units[unit]
                          break


                  if selected is None:

                      if units:

                          selected = next(
                              iter(
                                  units.values()
                              )
                          )

                      else:

                          continue


                  rows = []


                  for row in selected:

                      if row.get("form") not in (
                          "10-Q",
                          "10-K"
                      ):
                          continue


                      if row.get("val") is None:
                          continue


                      if not row.get("start"):
                          continue


                      if not row.get("end"):
                          continue


                      new_row = dict(row)

                      new_row[
                          "concept"
                      ] = concept

                      new_row[
                          "duration_days"
                      ] = duration_days(
                          row
                      )

                      rows.append(
                          new_row
                      )


                  if rows:

                      return (
                          concept,
                          rows
                      )


              return (
                  None,
                  []
              )


          # ============================================================
          # DUPLIKATE REDUZIEREN
          # ============================================================

          def dedupe_rows(rows):

              best = {}


              for row in rows:

                  key = (
                      row.get("start"),
                      row.get("end"),
                      row.get("val"),
                      row.get("fy"),
                      row.get("fp")
                  )


                  old = best.get(
                      key
                  )


                  if old is None:

                      best[key] = row
                      continue


                  old_filed = (
                      old.get("filed")
                      or ""
                  )

                  new_filed = (
                      row.get("filed")
                      or ""
                  )


                  if new_filed > old_filed:

                      best[key] = row


              return list(
                  best.values()
              )


          # ============================================================
          # DIREKTE QUARTALE
          # ============================================================

          def direct_quarters(rows):

              result = []


              for row in rows:

                  days = row.get(
                      "duration_days"
                  )


                  if days is None:
                      continue


                  # ungefähr ein echtes Quartal
                  if 70 <= days <= 110:

                      result.append({

                          "start":
                              row.get("start"),

                          "end":
                              row.get("end"),

                          "value":
                              row.get("val"),

                          "fy":
                              row.get("fy"),

                          "fp":
                              row.get("fp"),

                          "form":
                              row.get("form"),

                          "filed":
                              row.get("filed"),

                          "frame":
                              row.get("frame"),

                          "source":
                              "DIRECT",

                          "duration_days":
                              days
                      })


              return result


          # ============================================================
          # ABGELEITETE QUARTALE
          #
          # Q2 = H1 - Q1
          # Q3 = 9M - H1
          # Q4 = FY - 9M
          # ============================================================

          def derived_quarters(rows):

              result = []

              by_fy = {}


              for row in rows:

                  fy = row.get(
                      "fy"
                  )

                  if fy is None:
                      continue


                  by_fy.setdefault(
                      fy,
                      []
                  ).append(
                      row
                  )


              for fy, fy_rows in by_fy.items():

                  candidates = []


                  for row in fy_rows:

                      days = row.get(
                          "duration_days"
                      )

                      if days is None:
                          continue


                      candidates.append(
                          row
                      )


                  candidates.sort(
                      key=lambda r: (
                          r.get(
                              "duration_days"
                          ) or 9999,
                          r.get("end") or ""
                      )
                  )


                  q1 = None
                  h1 = None
                  nine_month = None
                  full_year = None


                  for row in candidates:

                      days = row.get(
                          "duration_days"
                      )

                      fp = row.get(
                          "fp"
                      )

                      form = row.get(
                          "form"
                      )


                      if (
                          q1 is None
                          and 70 <= days <= 110
                          and fp == "Q1"
                      ):

                          q1 = row


                      if (
                          h1 is None
                          and 150 <= days <= 220
                      ):

                          h1 = row


                      if (
                          nine_month is None
                          and 230 <= days <= 310
                      ):

                          nine_month = row


                      if (
                          full_year is None
                          and 330 <= days <= 380
                          and form == "10-K"
                      ):

                          full_year = row


                  # Q2
                  if (
                      q1 is not None
                      and h1 is not None
                      and q1.get("start")
                          == h1.get("start")
                  ):

                      result.append({

                          "start":
                              q1.get("end"),

                          "end":
                              h1.get("end"),

                          "value":
                              h1.get("val")
                              - q1.get("val"),

                          "fy":
                              fy,

                          "fp":
                              "Q2",

                          "form":
                              h1.get("form"),

                          "filed":
                              h1.get("filed"),

                          "source":
                              "DERIVED_H1_MINUS_Q1"
                      })


                  # Q3
                  if (
                      h1 is not None
                      and nine_month is not None
                      and h1.get("start")
                          == nine_month.get("start")
                  ):

                      result.append({

                          "start":
                              h1.get("end"),

                          "end":
                              nine_month.get("end"),

                          "value":
                              nine_month.get("val")
                              - h1.get("val"),

                          "fy":
                              fy,

                          "fp":
                              "Q3",

                          "form":
                              nine_month.get("form"),

                          "filed":
                              nine_month.get("filed"),

                          "source":
                              "DERIVED_9M_MINUS_H1"
                      })


                  # Q4
                  if (
                      nine_month is not None
                      and full_year is not None
                      and nine_month.get("start")
                          == full_year.get("start")
                  ):

                      result.append({

                          "start":
                              nine_month.get("end"),

                          "end":
                              full_year.get("end"),

                          "value":
                              full_year.get("val")
                              - nine_month.get("val"),

                          "fy":
                              fy,

                          "fp":
                              "Q4",

                          "form":
                              full_year.get("form"),

                          "filed":
                              full_year.get("filed"),

                          "source":
                              "DERIVED_FY_MINUS_9M"
                      })


              return result


          # ============================================================
          # QUARTALE ZUSAMMENFÜHREN
          # ============================================================

          def build_quarters(rows):

              rows = dedupe_rows(
                  rows
              )

              direct = direct_quarters(
                  rows
              )

              derived = derived_quarters(
                  rows
              )

              all_rows = (
                  direct
                  + derived
              )


              best_by_end = {}


              for row in all_rows:

                  end = row.get(
                      "end"
                  )

                  if not end:
                      continue


                  old = best_by_end.get(
                      end
                  )


                  if old is None:

                      best_by_end[
                          end
                      ] = row

                      continue


                  # direkte Quartalsangabe bevorzugen
                  if (
                      row.get("source")
                      == "DIRECT"
                      and old.get("source")
                      != "DIRECT"
                  ):

                      best_by_end[
                          end
                      ] = row


              quarters = list(
                  best_by_end.values()
              )


              quarters.sort(
                  key=lambda row:
                      row.get("end") or "",
                  reverse=True
              )


              return quarters


          # ============================================================
          # YOY VERGLEICH
          #
          # Wir vergleichen Fiscal Quarter:
          # Q1 mit Q1 Vorjahr
          # Q2 mit Q2 Vorjahr
          # usw.
          # ============================================================

          def find_prior_year_quarter(
              current,
              quarters
          ):

              current_fy = current.get(
                  "fy"
              )

              current_fp = current.get(
                  "fp"
              )


              if current_fy is None:
                  return None


              if current_fp not in (
                  "Q1",
                  "Q2",
                  "Q3",
                  "Q4"
              ):
                  return None


              target_fy = (
                  current_fy - 1
              )


              for row in quarters:

                  if (
                      row.get("fy")
                      == target_fy
                      and row.get("fp")
                      == current_fp
                  ):

                      return row


              return None


          # ============================================================
          # YOY WACHSTUM
          # ============================================================

          def yoy_growth(
              current_value,
              previous_value
          ):

              if current_value is None:
                  return None


              if previous_value is None:
                  return None


              if previous_value == 0:
                  return None


              return (
                  (
                      current_value
                      - previous_value
                  )
                  / abs(
                      previous_value
                  )
                  * 100
              )


          # ============================================================
          # YOY SERIE ERSTELLEN
          # ============================================================

          def build_yoy_series(
              quarters
          ):

              result = []


              for current in quarters:

                  previous = (
                      find_prior_year_quarter(
                          current,
                          quarters
                      )
                  )


                  if previous is None:
                      continue


                  growth = yoy_growth(
                      current.get("value"),
                      previous.get("value")
                  )


                  if growth is None:
                      continue


                  result.append({

                      "end":
                          current.get("end"),

                      "fy":
                          current.get("fy"),

                      "fp":
                          current.get("fp"),

                      "value":
                          current.get("value"),

                      "previous_value":
                          previous.get("value"),

                      "yoy":
                          growth
                  })


              result.sort(
                  key=lambda row:
                      row.get("end") or "",
                  reverse=True
              )


              return result


          # ============================================================
          # BESCHLEUNIGUNG
          #
          # Beispiel:
          #
          # aktuelles YoY = +15 %
          # vorheriges YoY = +10 %
          #
          # Beschleunigung = +5 Prozentpunkte
          # ============================================================

          def add_acceleration(
              yoy_series
          ):

              result = []


              for index, row in enumerate(
                  yoy_series
              ):

                  new_row = dict(
                      row
                  )


                  if (
                      index + 1
                      < len(yoy_series)
                  ):

                      previous_yoy = (
                          yoy_series[
                              index + 1
                          ].get("yoy")
                      )


                      if previous_yoy is not None:

                          new_row[
                              "acceleration"
                          ] = (
                              row["yoy"]
                              - previous_yoy
                          )

                      else:

                          new_row[
                              "acceleration"
                          ] = None

                  else:

                      new_row[
                          "acceleration"
                      ] = None


                  result.append(
                      new_row
                  )


              return result


          # ============================================================
          # OPERATIVE MARGE
          # ============================================================

          def build_margin_series(
              revenue_quarters,
              operating_income_quarters
          ):

              revenue_by_end = {
                  row.get("end"): row
                  for row in revenue_quarters
              }


              operating_by_end = {
                  row.get("end"): row
                  for row in operating_income_quarters
              }


              common_dates = (
                  set(
                      revenue_by_end.keys()
                  )
                  &
                  set(
                      operating_by_end.keys()
                  )
              )


              result = []


              for end in common_dates:

                  revenue = (
                      revenue_by_end[
                          end
                      ].get("value")
                  )

                  operating_income = (
                      operating_by_end[
                          end
                      ].get("value")
                  )


                  if (
                      revenue is None
                      or revenue == 0
                      or operating_income is None
                  ):

                      continue


                  revenue_row = (
                      revenue_by_end[
                          end
                      ]
                  )


                  margin = (
                      operating_income
                      / revenue
                      * 100
                  )


                  result.append({

                      "end":
                          end,

                      "fy":
                          revenue_row.get("fy"),

                      "fp":
                          revenue_row.get("fp"),

                      "margin":
                          margin
                  })


              result.sort(
                  key=lambda row:
                      row.get("end") or "",
                  reverse=True
              )


              return result


          # ============================================================
          # MARGENVERÄNDERUNG YOY
          # ============================================================

          def add_margin_yoy(
              margin_series
          ):

              result = []


              for current in margin_series:

                  previous = None


                  for row in margin_series:

                      if (
                          current.get("fy")
                          is not None
                          and row.get("fy")
                          == current.get("fy") - 1
                          and row.get("fp")
                          == current.get("fp")
                      ):

                          previous = row
                          break


                  new_row = dict(
                      current
                  )


                  if previous:

                      new_row[
                          "margin_change_pp"
                      ] = (
                          current["margin"]
                          - previous["margin"]
                      )

                  else:

                      new_row[
                          "margin_change_pp"
                      ] = None


                  result.append(
                      new_row
                  )


              return result


          # ============================================================
          # FREE CASH FLOW
          # ============================================================

          def build_fcf_series(
              ocf_quarters,
              capex_quarters
          ):

              ocf = {
                  row.get("end"): row
                  for row in ocf_quarters
              }


              capex = {
                  row.get("end"): row
                  for row in capex_quarters
              }


              common_dates = (
                  set(
                      ocf.keys()
                  )
                  &
                  set(
                      capex.keys()
                  )
              )


              result = []


              for end in common_dates:

                  ocf_row = ocf[
                      end
                  ]

                  capex_row = capex[
                      end
                  ]


                  fcf = (
                      ocf_row["value"]
                      - capex_row["value"]
                  )


                  result.append({

                      "end":
                          end,

                      "fy":
                          ocf_row.get("fy"),

                      "fp":
                          ocf_row.get("fp"),

                      "value":
                          fcf,

                      "ocf":
                          ocf_row["value"],

                      "capex":
                          capex_row["value"]
                  })


              result.sort(
                  key=lambda row:
                      row.get("end") or "",
                  reverse=True
              )


              return result


          # ============================================================
          # AUSGABE
          # ============================================================

          def print_growth_series(
              title,
              series,
              billions=True
          ):

              print("")
              print(
                  f"--- {title} ---"
              )


              if not series:

                  print(
                      "Keine ausreichenden Daten."
                  )

                  return


              for row in series[:6]:

                  value = row.get(
                      "value"
                  )


                  if billions:

                      value_text = (
                          f"{value / 1_000_000_000:.3f} Mrd."
                      )

                  else:

                      value_text = (
                          f"{value:.2f}"
                      )


                  acceleration = row.get(
                      "acceleration"
                  )


                  if acceleration is None:

                      acceleration_text = (
                          "n/a"
                      )

                  else:

                      acceleration_text = (
                          f"{acceleration:+.2f} PP"
                      )


                  print(
                      row.get("end"),
                      "|",
                      row.get("fp"),
                      "| Wert:",
                      value_text,
                      "| YoY:",
                      f"{row['yoy']:+.2f} %",
                      "| Beschleunigung:",
                      acceleration_text
                  )


          # ============================================================
          # SEC CONCEPTS
          # ============================================================

          concepts = {

              "Revenue": (
                  [
                      "RevenueFromContractWithCustomerExcludingAssessedTax",
                      "SalesRevenueNet",
                      "Revenues"
                  ],
                  [
                      "USD"
                  ]
              ),

              "Net Income": (
                  [
                      "NetIncomeLoss"
                  ],
                  [
                      "USD"
                  ]
              ),

              "Operating Income": (
                  [
                      "OperatingIncomeLoss"
                  ],
                  [
                      "USD"
                  ]
              ),

              "Diluted EPS": (
                  [
                      "EarningsPerShareDiluted"
                  ],
                  [
                      "USD/shares"
                  ]
              ),

              "Operating Cash Flow": (
                  [
                      "NetCashProvidedByUsedInOperatingActivities"
                  ],
                  [
                      "USD"
                  ]
              ),

              "Capital Expenditure": (
                  [
                      "PaymentsToAcquirePropertyPlantAndEquipment"
                  ],
                  [
                      "USD"
                  ]
              )
          }


          # ============================================================
          # HAUPTPROGRAMM
          # ============================================================

          for symbol, cik in companies.items():

              print("")
              print("=" * 82)
              print(
                  f"BULLWERK FUNDAMENTAL MOMENTUM TEST: {symbol}"
              )
              print("=" * 82)


              url = (
                  "https://data.sec.gov/"
                  "api/xbrl/companyfacts/"
                  f"CIK{cik}.json"
              )


              try:

                  facts = get_json(
                      url
                  )

              except Exception as error:

                  print(
                      f"SEC FEHLER bei {symbol}: "
                      f"{error}"
                  )

                  continue


              print(
                  "Unternehmen:",
                  facts.get(
                      "entityName"
                  )
              )


              company_data = {}


              for label, (
                  possible_concepts,
                  preferred_units
              ) in concepts.items():

                  concept, rows = (
                      get_concept_rows(
                          facts,
                          possible_concepts,
                          preferred_units
                      )
                  )


                  if not rows:

                      company_data[
                          label
                      ] = []

                      print(
                          f"{label}: "
                          "keine Daten"
                      )

                      continue


                  quarters = build_quarters(
                      rows
                  )


                  company_data[
                      label
                  ] = quarters


                  print(
                      f"{label}: "
                      f"{len(quarters)} Quartale "
                      f"| Concept: {concept}"
                  )


              # ========================================================
              # UMSATZ
              # ========================================================

              revenue_yoy = (
                  add_acceleration(
                      build_yoy_series(
                          company_data.get(
                              "Revenue",
                              []
                          )
                      )
                  )
              )


              print_growth_series(
                  "UMSATZ MOMENTUM",
                  revenue_yoy
              )


              # ========================================================
              # NET INCOME
              # ========================================================

              income_yoy = (
                  add_acceleration(
                      build_yoy_series(
                          company_data.get(
                              "Net Income",
                              []
                          )
                      )
                  )
              )


              print_growth_series(
                  "GEWINN MOMENTUM",
                  income_yoy
              )


              # ========================================================
              # EPS
              # ========================================================

              eps_yoy = (
                  add_acceleration(
                      build_yoy_series(
                          company_data.get(
                              "Diluted EPS",
                              []
                          )
                      )
                  )
              )


              print_growth_series(
                  "EPS MOMENTUM",
                  eps_yoy,
                  billions=False
              )


              # ========================================================
              # OPERATIVE MARGE
              # ========================================================

              margins = (
                  add_margin_yoy(
                      build_margin_series(
                          company_data.get(
                              "Revenue",
                              []
                          ),
                          company_data.get(
                              "Operating Income",
                              []
                          )
                      )
                  )
              )


              print("")
              print(
                  "--- OPERATIVE MARGE ---"
              )


              if not margins:

                  print(
                      "Keine ausreichenden Daten."
                  )


              for row in margins[:6]:

                  change = row.get(
                      "margin_change_pp"
                  )


                  if change is None:

                      change_text = "n/a"

                  else:

                      change_text = (
                          f"{change:+.2f} PP"
                      )


                  print(
                      row.get("end"),
                      "|",
                      row.get("fp"),
                      "| Marge:",
                      f"{row['margin']:.2f} %",
                      "| YoY Veränderung:",
                      change_text
                  )


              # ========================================================
              # FREE CASH FLOW
              # ========================================================

              fcf_quarters = (
                  build_fcf_series(
                      company_data.get(
                          "Operating Cash Flow",
                          []
                      ),
                      company_data.get(
                          "Capital Expenditure",
                          []
                      )
                  )
              )


              fcf_yoy = (
                  add_acceleration(
                      build_yoy_series(
                          fcf_quarters
                      )
                  )
              )


              print_growth_series(
                  "FREE CASH FLOW MOMENTUM",
                  fcf_yoy
              )


              # ========================================================
              # AKTUELLER MOMENTUM SNAPSHOT
              # ========================================================

              print("")
              print(
                  "--- AKTUELLER FUNDAMENTAL SNAPSHOT ---"
              )


              def latest(series):

                  if series:
                      return series[0]

                  return None


              rev = latest(
                  revenue_yoy
              )

              inc = latest(
                  income_yoy
              )

              eps = latest(
                  eps_yoy
              )

              margin = latest(
                  margins
              )

              fcf = latest(
                  fcf_yoy
              )


              if rev:

                  print(
                      "Umsatz YoY:",
                      f"{rev['yoy']:+.2f} %",
                      "| Beschleunigung:",
                      (
                          f"{rev['acceleration']:+.2f} PP"
                          if rev.get("acceleration")
                          is not None
                          else "n/a"
                      )
                  )


              if inc:

                  print(
                      "Gewinn YoY:",
                      f"{inc['yoy']:+.2f} %",
                      "| Beschleunigung:",
                      (
                          f"{inc['acceleration']:+.2f} PP"
                          if inc.get("acceleration")
                          is not None
                          else "n/a"
                      )
                  )


              if eps:

                  print(
                      "EPS YoY:",
                      f"{eps['yoy']:+.2f} %",
                      "| Beschleunigung:",
                      (
                          f"{eps['acceleration']:+.2f} PP"
                          if eps.get("acceleration")
                          is not None
                          else "n/a"
                      )
                  )


              if margin:

                  print(
                      "Operative Marge:",
                      f"{margin['margin']:.2f} %",
                      "| YoY:",
                      (
                          f"{margin['margin_change_pp']:+.2f} PP"
                          if margin.get(
                              "margin_change_pp"
                          )
                          is not None
                          else "n/a"
                      )
                  )


              if fcf:

                  print(
                      "FCF YoY:",
                      f"{fcf['yoy']:+.2f} %",
                      "| Beschleunigung:",
                      (
                          f"{fcf['acceleration']:+.2f} PP"
                          if fcf.get("acceleration")
                          is not None
                          else "n/a"
                      )
                  )


              print("")
              print(
                  f"{symbol} abgeschlossen."
              )


              time.sleep(1)


          print("")
          print("=" * 82)
          print(
              "Bullwerk Fundamental Momentum Test beendet."
          )
          print("=" * 82)

