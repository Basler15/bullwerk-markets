name: Bullwerk Fundamental Momentum Test V4

on:
  workflow_dispatch:

jobs:
  fundamental-momentum-test:
    runs-on: ubuntu-latest

    steps:
      - name: Fundamental Momentum V4 berechnen
        run: |
          python3 <<'PY'

          import json
          import time
          import urllib.request
          from datetime import datetime


          # ============================================================
          # BULLWERK MARKETS
          # FUNDAMENTAL MOMENTUM TEST V4
          #
          # WICHTIGE ÄNDERUNG:
          #
          # SEC FY/FP wird NICHT mehr für die zeitliche Reihenfolge
          # der Quartale verwendet.
          #
          # Die Reihenfolge entsteht aus dem tatsächlichen Enddatum.
          #
          # Bullwerk erzeugt daraus:
          # BQ1, BQ2, BQ3 ... = chronologische Quartalsfolge.
          #
          # YoY:
          # aktuelles Quartal gegen Quartal 4 Positionen davor.
          #
          # Beschleunigung:
          # aktuelles YoY minus YoY des direkt vorherigen Quartals.
          #
          # Noch KEIN 0-20 Fundamental Score.
          # ============================================================


          companies = {
              "AAPL": "0000320193",
              "MSFT": "0000789019"
          }


          USER_AGENT = (
              "Bullwerk Markets "
              "contact: bullwerkmarkets@gmail.com"
          )


          # ============================================================
          # DATUM
          # ============================================================

          def parse_date(value):

              if not value:
                  return None

              try:
                  return datetime.strptime(
                      value,
                      "%Y-%m-%d"
                  ).date()

              except ValueError:
                  return None


          def duration_days(row):

              start = parse_date(
                  row.get("start")
              )

              end = parse_date(
                  row.get("end")
              )

              if not start or not end:
                  return None

              return (
                  end - start
              ).days + 1


          def date_gap_days(
              newer,
              older
          ):

              a = parse_date(newer)
              b = parse_date(older)

              if not a or not b:
                  return None

              return (
                  a - b
              ).days


          def starts_match(
              a,
              b,
              tolerance=7
          ):

              if not a or not b:
                  return False

              da = parse_date(
                  a.get("start")
              )

              db = parse_date(
                  b.get("start")
              )

              if not da or not db:
                  return False

              return abs(
                  (da - db).days
              ) <= tolerance


          # ============================================================
          # SEC
          # ============================================================

          def get_json(url):

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent":
                          USER_AGENT,

                      "Accept":
                          "application/json",

                      "Accept-Encoding":
                          "identity"
                  }
              )

              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:

                  print(
                      "HTTP Status:",
                      response.status
                  )

                  return json.loads(
                      response.read().decode(
                          "utf-8"
                      )
                  )


          # ============================================================
          # CONCEPT LADEN
          # ============================================================

          def get_concept_rows(
              facts,
              concepts,
              units
          ):

              for concept in concepts:

                  try:

                      available = (
                          facts["facts"]
                          ["us-gaap"]
                          [concept]
                          ["units"]
                      )

                  except KeyError:

                      continue


                  selected = None


                  for unit in units:

                      if unit in available:

                          selected = (
                              available[unit]
                          )

                          break


                  if selected is None:

                      if not available:
                          continue

                      selected = next(
                          iter(
                              available.values()
                          )
                      )


                  rows = []


                  for row in selected:

                      if row.get(
                          "form"
                      ) not in (
                          "10-Q",
                          "10-K"
                      ):
                          continue

                      if row.get(
                          "val"
                      ) is None:
                          continue

                      if not row.get(
                          "start"
                      ):
                          continue

                      if not row.get(
                          "end"
                      ):
                          continue


                      item = dict(row)

                      item[
                          "duration_days"
                      ] = duration_days(
                          item
                      )

                      rows.append(
                          item
                      )


                  if rows:

                      return (
                          concept,
                          rows
                      )


              return (
                  None,
                  []
              )


          # ============================================================
          # DUPLIKATE
          # ============================================================

          def dedupe_rows(rows):

              best = {}


              for row in rows:

                  key = (
                      row.get("start"),
                      row.get("end"),
                      row.get("val"),
                      row.get("fy"),
                      row.get("fp"),
                      row.get("form")
                  )


                  old = best.get(key)


                  if old is None:

                      best[key] = row

                      continue


                  if (
                      row.get("filed")
                      or ""
                  ) > (
                      old.get("filed")
                      or ""
                  ):

                      best[key] = row


              return list(
                  best.values()
              )


          # ============================================================
          # DIREKTE QUARTALE
          # ============================================================

          def direct_quarters(rows):

              result = []


              for row in rows:

                  days = row.get(
                      "duration_days"
                  )


                  if days is None:
                      continue


                  if not (
                      70 <= days <= 110
                  ):
                      continue


                  fp = row.get("fp")


                  if fp not in (
                      "Q1",
                      "Q2",
                      "Q3",
                      "Q4"
                  ):
                      continue


                  result.append({

                      "end":
                          row.get("end"),

                      "value":
                          row.get("val"),

                      "sec_fy":
                          row.get("fy"),

                      "sec_fp":
                          fp,

                      "filed":
                          row.get("filed"),

                      "source":
                          "DIRECT"
                  })


              return result


          # ============================================================
          # KUMULATIVE PERIODEN
          # ============================================================

          def find_periods_for_fy(
              rows,
              fy
          ):

              q1 = []
              h1 = []
              nine = []
              full = []


              for row in rows:

                  if row.get("fy") != fy:
                      continue


                  days = row.get(
                      "duration_days"
                  )


                  if days is None:
                      continue


                  if (
                      70 <= days <= 110
                      and row.get("fp")
                      == "Q1"
                  ):

                      q1.append(row)


                  elif (
                      150 <= days <= 220
                  ):

                      h1.append(row)


                  elif (
                      230 <= days <= 310
                  ):

                      nine.append(row)


                  elif (
                      330 <= days <= 380
                      and row.get("form")
                      == "10-K"
                  ):

                      full.append(row)


              def newest(items):

                  if not items:
                      return None

                  return sorted(
                      items,
                      key=lambda x: (
                          x.get("filed")
                          or "",
                          x.get("end")
                          or ""
                      ),
                      reverse=True
                  )[0]


              return {
                  "q1":
                      newest(q1),

                  "h1":
                      newest(h1),

                  "nine":
                      newest(nine),

                  "full":
                      newest(full)
              }


          # ============================================================
          # ABGELEITETE QUARTALE
          # ============================================================

          def derived_quarters(rows):

              result = []


              fiscal_years = {

                  row.get("fy")

                  for row in rows

                  if row.get("fy")
                  is not None
              }


              for fy in fiscal_years:

                  p = find_periods_for_fy(
                      rows,
                      fy
                  )


                  q1 = p["q1"]
                  h1 = p["h1"]
                  nine = p["nine"]
                  full = p["full"]


                  # Q2
                  if (
                      q1
                      and h1
                      and starts_match(
                          q1,
                          h1
                      )
                  ):

                      result.append({

                          "end":
                              h1.get("end"),

                          "value":
                              h1["val"]
                              - q1["val"],

                          "sec_fy":
                              fy,

                          "sec_fp":
                              "Q2",

                          "filed":
                              h1.get("filed"),

                          "source":
                              "DERIVED_H1_MINUS_Q1"
                      })


                  # Q3
                  if (
                      h1
                      and nine
                      and starts_match(
                          h1,
                          nine
                      )
                  ):

                      result.append({

                          "end":
                              nine.get("end"),

                          "value":
                              nine["val"]
                              - h1["val"],

                          "sec_fy":
                              fy,

                          "sec_fp":
                              "Q3",

                          "filed":
                              nine.get("filed"),

                          "source":
                              "DERIVED_9M_MINUS_H1"
                      })


                  # Q4
                  if (
                      nine
                      and full
                      and starts_match(
                          nine,
                          full
                      )
                  ):

                      result.append({

                          "end":
                              full.get("end"),

                          "value":
                              full["val"]
                              - nine["val"],

                          "sec_fy":
                              fy,

                          "sec_fp":
                              "Q4",

                          "filed":
                              full.get("filed"),

                          "source":
                              "DERIVED_FY_MINUS_9M"
                      })


              return result


          # ============================================================
          # QUARTALE NACH ECHTEM ENDDATUM
          #
          # Hier liegt die wichtigste V4-Änderung.
          # Ein Enddatum = eine wirtschaftliche Periode.
          # ============================================================

          def build_quarters(rows):

              rows = dedupe_rows(rows)


              candidates = (
                  derived_quarters(rows)
                  +
                  direct_quarters(rows)
              )


              best_by_end = {}


              for row in candidates:

                  end = row.get("end")


                  if not end:
                      continue


                  old = best_by_end.get(
                      end
                  )


                  if old is None:

                      best_by_end[end] = row

                      continue


                  # Direktes Einzelquartal
                  # bevorzugen.
                  if (
                      row.get("source")
                      == "DIRECT"
                      and old.get("source")
                      != "DIRECT"
                  ):

                      best_by_end[end] = row

                      continue


                  # Neueste Einreichung
                  if (
                      row.get("source")
                      == old.get("source")
                      and (
                          row.get("filed")
                          or ""
                      ) > (
                          old.get("filed")
                          or ""
                      )
                  ):

                      best_by_end[end] = row


              quarters = list(
                  best_by_end.values()
              )


              quarters.sort(
                  key=lambda x:
                      x.get("end")
                      or ""
              )


              # --------------------------------------------------------
              # Quartalsfolge prüfen.
              #
              # Nur Perioden behalten, deren Abstand
              # zu benachbarten Quartalen plausibel ist.
              # --------------------------------------------------------

              clean = []


              for row in quarters:

                  if not clean:

                      clean.append(row)

                      continue


                  gap = date_gap_days(
                      row.get("end"),
                      clean[-1].get("end")
                  )


                  if gap is None:
                      continue


                  # Gleiche/fast gleiche Periode
                  if gap < 45:

                      # neueren Kandidaten verwenden
                      clean[-1] = row

                      continue


                  clean.append(row)


              # Bullwerk Sequence
              for index, row in enumerate(
                  clean
              ):

                  row[
                      "sequence"
                  ] = index + 1


              clean.sort(
                  key=lambda x:
                      x.get("end")
                      or "",
                  reverse=True
              )


              return clean


          # ============================================================
          # YOY NACH ECHTEM DATUM
          #
          # Wir suchen ein Quartal ca. 1 Jahr zurück.
          # SEC FY spielt hier KEINE Rolle.
          # ============================================================

          def find_prior_year(
              current,
              quarters
          ):

              current_end = parse_date(
                  current.get("end")
              )


              if not current_end:
                  return None


              candidates = []


              for row in quarters:

                  if row is current:
                      continue


                  older_end = parse_date(
                      row.get("end")
                  )


                  if not older_end:
                      continue


                  gap = (
                      current_end
                      - older_end
                  ).days


                  if (
                      330 <= gap <= 400
                  ):

                      candidates.append(
                          (
                              abs(
                                  gap - 365
                              ),
                              row
                          )
                      )


              if not candidates:
                  return None


              candidates.sort(
                  key=lambda x:
                      x[0]
              )


              return candidates[0][1]


          # ============================================================
          # YOY
          # ============================================================

          def yoy_growth(
              current,
              previous
          ):

              if current is None:
                  return None

              if previous is None:
                  return None

              if previous == 0:
                  return None


              return (
                  (
                      current
                      - previous
                  )
                  / abs(previous)
                  * 100
              )


          def build_yoy_series(
              quarters
          ):

              result = []


              for current in quarters:

                  previous = (
                      find_prior_year(
                          current,
                          quarters
                      )
                  )


                  if not previous:
                      continue


                  growth = yoy_growth(
                      current.get("value"),
                      previous.get("value")
                  )


                  if growth is None:
                      continue


                  result.append({

                      "end":
                          current.get("end"),

                      "sequence":
                          current.get(
                              "sequence"
                          ),

                      "value":
                          current.get(
                              "value"
                          ),

                      "previous_end":
                          previous.get(
                              "end"
                          ),

                      "previous_value":
                          previous.get(
                              "value"
                          ),

                      "yoy":
                          growth,

                      "sec_fy":
                          current.get(
                              "sec_fy"
                          ),

                      "sec_fp":
                          current.get(
                              "sec_fp"
                          )
                  })


              result.sort(
                  key=lambda x:
                      x.get("end")
                      or "",
                  reverse=True
              )


              return result


          # ============================================================
          # BESCHLEUNIGUNG
          #
          # Nur das unmittelbar vorherige echte Quartal.
          # ============================================================

          def add_acceleration(
              series
          ):

              result = []


              for i, row in enumerate(
                  series
              ):

                  new_row = dict(row)

                  new_row[
                      "acceleration"
                  ] = None


                  if i + 1 < len(series):

                      older = series[
                          i + 1
                      ]


                      gap = date_gap_days(
                          row.get("end"),
                          older.get("end")
                      )


                      if (
                          gap is not None
                          and 60 <= gap <= 120
                      ):

                          new_row[
                              "acceleration"
                          ] = (
                              row["yoy"]
                              - older["yoy"]
                          )


                  result.append(
                      new_row
                  )


              return result


          # ============================================================
          # OPERATIVE MARGE
          # ============================================================

          def build_margin_series(
              revenue,
              operating_income
          ):

              op_lookup = {

                  row.get("end"): row

                  for row in operating_income

                  if row.get("end")
              }


              result = []


              for rev in revenue:

                  end = rev.get("end")

                  op = op_lookup.get(end)


                  if not op:
                      continue


                  revenue_value = (
                      rev.get("value")
                  )

                  operating_value = (
                      op.get("value")
                  )


                  if (
                      revenue_value is None
                      or revenue_value == 0
                      or operating_value
                      is None
                  ):
                      continue


                  result.append({

                      "end":
                          end,

                      "sequence":
                          rev.get(
                              "sequence"
                          ),

                      "margin":
                          (
                              operating_value
                              / revenue_value
                              * 100
                          )
                  })


              result.sort(
                  key=lambda x:
                      x.get("end")
                      or "",
                  reverse=True
              )


              for row in result:

                  previous = (
                      find_prior_year(
                          row,
                          result
                      )
                  )


                  if previous:

                      row[
                          "margin_change_pp"
                      ] = (
                          row["margin"]
                          - previous[
                              "margin"
                          ]
                      )

                  else:

                      row[
                          "margin_change_pp"
                      ] = None


              return result


          # ============================================================
          # FREE CASH FLOW
          # ============================================================

          def build_fcf_series(
              ocf,
              capex
          ):

              capex_lookup = {

                  row.get("end"): row

                  for row in capex

                  if row.get("end")
              }


              result = []


              for ocf_row in ocf:

                  end = ocf_row.get("end")

                  capex_row = (
                      capex_lookup.get(end)
                  )


                  if not capex_row:
                      continue


                  ocf_value = (
                      ocf_row.get("value")
                  )

                  capex_value = (
                      capex_row.get("value")
                  )


                  if (
                      ocf_value is None
                      or capex_value is None
                  ):
                      continue


                  result.append({

                      "end":
                          end,

                      "sequence":
                          ocf_row.get(
                              "sequence"
                          ),

                      "value":
                          (
                              ocf_value
                              - capex_value
                          ),

                      "ocf":
                          ocf_value,

                      "capex":
                          capex_value,

                      "source":
                          (
                              ocf_row.get(
                                  "source"
                              )
                              + " / "
                              + capex_row.get(
                                  "source"
                              )
                          )
                  })


              result.sort(
                  key=lambda x:
                      x.get("end")
                      or ""
              )


              # eigene lückenlose Reihenfolge
              for index, row in enumerate(
                  result
              ):

                  row[
                      "sequence"
                  ] = index + 1


              result.sort(
                  key=lambda x:
                      x.get("end")
                      or "",
                  reverse=True
              )


              return result


          # ============================================================
          # FORMAT
          # ============================================================

          def format_acceleration(
              value
          ):

              if value is None:
                  return "n/a"

              return (
                  f"{value:+.2f} PP"
              )


          def print_growth(
              title,
              series,
              billions=True
          ):

              print("")
              print(
                  f"--- {title} ---"
              )


              if not series:

                  print(
                      "Keine ausreichenden Daten."
                  )

                  return


              for row in series[:8]:

                  value = row.get(
                      "value"
                  )


                  if billions:

                      value_text = (
                          f"{value / 1_000_000_000:.3f} Mrd."
                      )

                  else:

                      value_text = (
                          f"{value:.2f}"
                      )


                  print(
                      row.get("end"),
                      "| BQ",
                      row.get(
                          "sequence"
                      ),
                      "| SEC:",
                      row.get(
                          "sec_fy",
                          "-"
                      ),
                      row.get(
                          "sec_fp",
                          "-"
                      ),
                      "| Wert:",
                      value_text,
                      "| YoY:",
                      f"{row['yoy']:+.2f} %",
                      "| Beschleunigung:",
                      format_acceleration(
                          row.get(
                              "acceleration"
                          )
                      )
                  )


          # ============================================================
          # CONCEPTS
          # ============================================================

          concepts = {

              "Revenue": (
                  [
                      "RevenueFromContractWithCustomerExcludingAssessedTax",
                      "SalesRevenueNet",
                      "Revenues"
                  ],
                  ["USD"]
              ),

              "Net Income": (
                  [
                      "NetIncomeLoss"
                  ],
                  ["USD"]
              ),

              "Operating Income": (
                  [
                      "OperatingIncomeLoss"
                  ],
                  ["USD"]
              ),

              "Diluted EPS": (
                  [
                      "EarningsPerShareDiluted"
                  ],
                  ["USD/shares"]
              ),

              "Operating Cash Flow": (
                  [
                      "NetCashProvidedByUsedInOperatingActivities"
                  ],
                  ["USD"]
              ),

              "Capital Expenditure": (
                  [
                      "PaymentsToAcquirePropertyPlantAndEquipment"
                  ],
                  ["USD"]
              )
          }


          # ============================================================
          # HAUPTLAUF
          # ============================================================

          for symbol, cik in (
              companies.items()
          ):

              print("")
              print("=" * 90)

              print(
                  "BULLWERK FUNDAMENTAL "
                  f"MOMENTUM V4: {symbol}"
              )

              print("=" * 90)


              url = (
                  "https://data.sec.gov/"
                  "api/xbrl/companyfacts/"
                  f"CIK{cik}.json"
              )


              try:

                  facts = get_json(
                      url
                  )

              except Exception as error:

                  print(
                      "SEC FEHLER:",
                      error
                  )

                  continue


              print(
                  "Unternehmen:",
                  facts.get(
                      "entityName"
                  )
              )


              company_data = {}


              for label, (
                  concept_names,
                  units
              ) in concepts.items():

                  concept, rows = (
                      get_concept_rows(
                          facts,
                          concept_names,
                          units
                      )
                  )


                  quarters = (
                      build_quarters(rows)
                      if rows
                      else []
                  )


                  company_data[
                      label
                  ] = quarters


                  print(
                      label,
                      ":",
                      len(quarters),
                      "Quartale",
                      "| Concept:",
                      concept
                  )


              # ========================================================
              # UMSATZ
              # ========================================================

              revenue = (
                  add_acceleration(
                      build_yoy_series(
                          company_data[
                              "Revenue"
                          ]
                      )
                  )
              )


              print_growth(
                  "UMSATZ MOMENTUM",
                  revenue
              )


              # ========================================================
              # GEWINN
              # ========================================================

              income = (
                  add_acceleration(
                      build_yoy_series(
                          company_data[
                              "Net Income"
                          ]
                      )
                  )
              )


              print_growth(
                  "GEWINN MOMENTUM",
                  income
              )


              # ========================================================
              # EPS
              # ========================================================

              eps = (
                  add_acceleration(
                      build_yoy_series(
                          company_data[
                              "Diluted EPS"
                          ]
                      )
                  )
              )


              print_growth(
                  "EPS MOMENTUM",
                  eps,
                  billions=False
              )


              # ========================================================
              # MARGE
              # ========================================================

              margins = (
                  build_margin_series(
                      company_data[
                          "Revenue"
                      ],
                      company_data[
                          "Operating Income"
                      ]
                  )
              )


              print("")
              print(
                  "--- OPERATIVE MARGE ---"
              )


              for row in margins[:8]:

                  change = row.get(
                      "margin_change_pp"
                  )


                  print(
                      row.get("end"),
                      "| BQ",
                      row.get(
                          "sequence"
                      ),
                      "| Marge:",
                      f"{row['margin']:.2f} %",
                      "| YoY:",
                      (
                          f"{change:+.2f} PP"
                          if change
                          is not None
                          else "n/a"
                      )
                  )


              # ========================================================
              # FCF
              # ========================================================

              fcf_quarters = (
                  build_fcf_series(
                      company_data[
                          "Operating Cash Flow"
                      ],
                      company_data[
                          "Capital Expenditure"
                      ]
                  )
              )


              print("")
              print(
                  "--- FCF EINZELQUARTALE ---"
              )


              for row in (
                  fcf_quarters[:12]
              ):

                  print(
                      row.get("end"),
                      "| BQ",
                      row.get(
                          "sequence"
                      ),
                      "| FCF:",
                      f"{row['value'] / 1_000_000_000:.3f} Mrd.",
                      "| OCF:",
                      f"{row['ocf'] / 1_000_000_000:.3f}",
                      "| CapEx:",
                      f"{row['capex'] / 1_000_000_000:.3f}",
                      "|",
                      row.get("source")
                  )


              fcf = (
                  add_acceleration(
                      build_yoy_series(
                          fcf_quarters
                      )
                  )
              )


              print_growth(
                  "FREE CASH FLOW MOMENTUM",
                  fcf
              )


              # ========================================================
              # SNAPSHOT
              # ========================================================

              print("")
              print(
                  "--- AKTUELLER "
                  "FUNDAMENTAL SNAPSHOT ---"
              )


              def latest(series):

                  if not series:
                      return None

                  return series[0]


              current_revenue = (
                  latest(revenue)
              )

              current_income = (
                  latest(income)
              )

              current_eps = (
                  latest(eps)
              )

              current_margin = (
                  latest(margins)
              )

              current_fcf = (
                  latest(fcf)
              )


              if current_revenue:

                  print(
                      "Umsatz YoY:",
                      f"{current_revenue['yoy']:+.2f} %",
                      "| Beschleunigung:",
                      format_acceleration(
                          current_revenue.get(
                              "acceleration"
                          )
                      )
                  )


              if current_income:

