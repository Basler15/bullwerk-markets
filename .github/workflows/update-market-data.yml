name: Update Bullwerk Market Data

on:
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * 1-5"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: FMP Daten abrufen und Bullwerk Technik berechnen
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: |
          python3 <<'PY'

          import json
          import os
          import urllib.request
          import urllib.parse
          import statistics

          from datetime import datetime, timezone, timedelta


          api_key = os.environ["FMP_API_KEY"]

          symbols = [
              "AAPL",
              "MSFT",
              "NVDA",
              "AMD",
              "AMZN",
              "META",
              "GOOGL",
              "PLTR"
          ]

          stocks = []


          # ==================================================
          # Hilfsfunktionen
          # ==================================================

          def get_json(url):

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Bullwerk-Markets/1.0"
                  }
              )

              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:

                  return json.loads(
                      response.read().decode("utf-8")
                  )


          def safe_number(value):

              try:
                  if value is None:
                      return None

                  return float(value)

              except (TypeError, ValueError):
                  return None


          def average(values):

              clean = [
                  value
                  for value in values
                  if value is not None
              ]

              if not clean:
                  return None

              return sum(clean) / len(clean)


          def percent_difference(value, reference):

              if (
                  value is None
                  or reference is None
                  or reference == 0
              ):
                  return None

              return (
                  (value / reference) - 1
              ) * 100


          def get_high(rows):

              values = [
                  safe_number(row.get("high"))
                  for row in rows
              ]

              values = [
                  value
                  for value in values
                  if value is not None
              ]

              return max(values) if values else None


          def get_low(rows):

              values = [
                  safe_number(row.get("low"))
                  for row in rows
              ]

              values = [
                  value
                  for value in values
                  if value is not None
              ]

              return min(values) if values else None


          def range_pct(high_value, low_value):

              if (
                  high_value is None
                  or low_value is None
                  or low_value == 0
              ):
                  return None

              return (
                  (high_value - low_value)
                  / low_value
              ) * 100


          # ==================================================
          # Zeitraum
          # ==================================================

          today = datetime.now(
              timezone.utc
          ).date()

          history_start = (
              today - timedelta(days=400)
          )


          # ==================================================
          # Aktien durchlaufen
          # ==================================================

          for symbol in symbols:

              print("")
              print("=" * 60)
              print(f"Verarbeite {symbol}")
              print("=" * 60)

              quote = {}
              historical = []


              # ==================================================
              # 1. Aktueller Quote
              # ==================================================

              try:

                  quote_url = (
                      "https://financialmodelingprep.com/"
                      "stable/quote"
                      f"?symbol={urllib.parse.quote(symbol)}"
                      f"&apikey={urllib.parse.quote(api_key)}"
                  )

                  quote_result = get_json(
                      quote_url
                  )

                  if (
                      isinstance(quote_result, list)
                      and quote_result
                  ):

                      quote = quote_result[0]

                  elif isinstance(
                      quote_result,
                      dict
                  ):

                      quote = quote_result

              except Exception as error:

                  print(
                      f"Quote-Fehler bei {symbol}: "
                      f"{error}"
                  )


              # ==================================================
              # 2. Historische Tageskurse
              # ==================================================

              try:

                  history_url = (
                      "https://financialmodelingprep.com/"
                      "stable/historical-price-eod/full"
                      f"?symbol={urllib.parse.quote(symbol)}"
                      f"&from={history_start.isoformat()}"
                      f"&to={today.isoformat()}"
                      f"&apikey={urllib.parse.quote(api_key)}"
                  )

                  history_result = get_json(
                      history_url
                  )

                  if isinstance(
                      history_result,
                      list
                  ):

                      historical = history_result

                  elif isinstance(
                      history_result,
                      dict
                  ):

                      if isinstance(
                          history_result.get("historical"),
                          list
                      ):

                          historical = (
                              history_result["historical"]
                          )

                      elif isinstance(
                          history_result.get("data"),
                          list
                      ):

                          historical = (
                              history_result["data"]
                          )

              except Exception as error:

                  print(
                      f"History-Fehler bei {symbol}: "
                      f"{error}"
                  )


              # ==================================================
              # 3. Historie bereinigen und sortieren
              # Neuester Tag zuerst
              # ==================================================

              historical = [
                  row
                  for row in historical
                  if (
                      isinstance(row, dict)
                      and row.get("date")
                  )
              ]

              historical.sort(
                  key=lambda row:
                      row.get("date", ""),
                  reverse=True
              )


              # ==================================================
              # 4. Aktuellen Handelstag herausnehmen
              # ==================================================

              today_string = (
                  today.isoformat()
              )

              if (
                  historical
                  and historical[0].get("date")
                  == today_string
              ):

                  previous_history = (
                      historical[1:]
                  )

              else:

                  previous_history = (
                      historical
                  )


              # ==================================================
              # 5. Zeitfenster
              # ==================================================

              last_5 = (
                  previous_history[:5]
              )

              previous_5 = (
                  previous_history[5:10]
              )

              previous_10 = (
                  previous_history[:10]
              )

              previous_20 = (
                  previous_history[:20]
              )

              previous_50 = (
                  previous_history[:50]
              )

              previous_252 = (
                  previous_history[:252]
              )


              # ==================================================
              # 6. Moving Averages
              # ==================================================

              closes_20 = [
                  safe_number(
                      row.get("close")
                  )
                  for row in previous_20
              ]

              closes_50 = [
                  safe_number(
                      row.get("close")
                  )
                  for row in previous_50
              ]

              ma20 = average(
                  closes_20
              )

              ma50 = average(
                  closes_50
              )


              # ==================================================
              # 7. Breakout Trigger
              # Vorheriges 20-Tage-Hoch
              # ==================================================

              breakout_trigger = (
                  get_high(previous_20)
              )


              # ==================================================
              # 8. 52-Wochen-Hoch
              # ==================================================

              high_52w = (
                  get_high(previous_252)
              )


              # ==================================================
              # 9. 4-Wochen-Hoch
              # ==================================================

              high_4w = (
                  get_high(previous_20)
              )


              # ==================================================
              # 10. Aktueller Kurs
              # ==================================================

              current_price = (
                  safe_number(
                      quote.get("price")
                  )
              )

              current_day_high = (
                  safe_number(
                      quote.get("dayHigh")
                  )
              )

              current_day_low = (
                  safe_number(
                      quote.get("dayLow")
                  )
              )


              # ==================================================
              # 11. Abstände
              # ==================================================

              distance_trigger_pct = (
                  percent_difference(
                      current_price,
                      breakout_trigger
                  )
              )

              distance_52w_high_pct = (
                  percent_difference(
                      current_price,
                      high_52w
                  )
              )

              distance_4w_high_pct = (
                  percent_difference(
                      current_price,
                      high_4w
                  )
              )

              distance_ma20_pct = (
                  percent_difference(
                      current_price,
                      ma20
                  )
              )

              distance_ma50_pct = (
                  percent_difference(
                      current_price,
                      ma50
                  )
              )


              # ==================================================
              # 12. Trend
              # ==================================================

              above_ma20 = (
                  current_price is not None
                  and ma20 is not None
                  and current_price > ma20
              )

              above_ma50 = (
                  current_price is not None
                  and ma50 is not None
                  and current_price > ma50
              )

              ma20_above_ma50 = (
                  ma20 is not None
                  and ma50 is not None
                  and ma20 > ma50
              )

              trend_status = (
                  "NEUTRAL"
              )

              if (
                  above_ma20
                  and above_ma50
                  and ma20_above_ma50
              ):

                  trend_status = (
                      "UPTREND"
                  )

              elif (
                  current_price is not None
                  and ma20 is not None
                  and ma50 is not None
                  and current_price < ma20
                  and current_price < ma50
              ):

                  trend_status = (
                      "WEAK"
                  )


              # ==================================================
              # 13. Higher Low
              # ==================================================

              lows_recent = [
                  safe_number(
                      row.get("low")
                  )
                  for row in last_5
              ]

              lows_previous = [
                  safe_number(
                      row.get("low")
                  )
                  for row in previous_5
              ]

              lows_recent = [
                  value
                  for value in lows_recent
                  if value is not None
              ]

              lows_previous = [
                  value
                  for value in lows_previous
                  if value is not None
              ]

              higher_low = None

              if (
                  lows_recent
                  and lows_previous
              ):

                  higher_low = (
                      min(lows_recent)
                      >
                      min(lows_previous)
                  )


              # ==================================================
              # 14. Breakout Status
              # ==================================================

              breakout_status = (
                  "UNKNOWN"
              )

              if (
                  current_price is not None
                  and breakout_trigger is not None
              ):

                  if (
                      current_price
                      >
                      breakout_trigger
                  ):

                      breakout_status = (
                          "BREAKOUT"
                      )

                  elif (
                      distance_trigger_pct
                      is not None
                      and distance_trigger_pct >= -1
                  ):

                      breakout_status = (
                          "AT_TRIGGER"
                      )

                  elif (
                      distance_trigger_pct
                      is not None
                      and distance_trigger_pct >= -3
                  ):

                      breakout_status = (
                          "NEAR"
                      )

                  elif (
                      distance_trigger_pct
                      is not None
                      and distance_trigger_pct >= -7
                  ):

                      breakout_status = (
                          "WATCH"
                      )

                  else:

                      breakout_status = (
                          "FAR"
                      )


              # ==================================================
              # 15. Intraday Trigger Touch
              # ==================================================

              trigger_touched_today = False

              if (
                  current_day_high is not None
                  and breakout_trigger is not None
              ):

                  trigger_touched_today = (
                      current_day_high
                      >
                      breakout_trigger
                  )


              # ==================================================
              # 16. Volumen
              # ==================================================

              previous_volumes_20 = [
                  safe_number(
                      row.get("volume")
                  )
                  for row in previous_20
              ]

              avg_volume_20 = average(
                  previous_volumes_20
              )

              current_volume = (
                  safe_number(
                      quote.get("volume")
                  )
              )

              volume_ratio_20 = None

              if (
                  current_volume is not None
                  and avg_volume_20 is not None
                  and avg_volume_20 != 0
              ):

                  volume_ratio_20 = (
                      current_volume
                      / avg_volume_20
                  )

              volume_status = (
                  "NORMAL"
              )

              if (
                  volume_ratio_20
                  is not None
              ):

                  if (
                      volume_ratio_20 >= 1.5
                  ):

                      volume_status = (
                          "STRONG"
                      )

                  elif (
                      volume_ratio_20 >= 1.2
                  ):

                      volume_status = (
                          "ELEVATED"
                      )

                  elif (
                      volume_ratio_20 < 0.7
                  ):

                      volume_status = (
                          "LOW"
                      )


              # ==================================================
              # 17. BOX / KONSOLIDIERUNG
              # ==================================================

              box_high_10 = (
                  get_high(previous_10)
              )

              box_low_10 = (
                  get_low(previous_10)
              )

              box_range_10_pct = (
                  range_pct(
                      box_high_10,
                      box_low_10
                  )
              )


              # 5 Punkte:
              # sehr enge Range <= 5 %
              # 4 Punkte <= 7 %
              # 3 Punkte <= 10 %
              # 2 Punkte <= 13 %
              # 1 Punkt <= 16 %

              box_score = 0

              if (
                  box_range_10_pct
                  is not None
              ):

                  if box_range_10_pct <= 5:
                      box_score = 5

                  elif box_range_10_pct <= 7:
                      box_score = 4

                  elif box_range_10_pct <= 10:
                      box_score = 3

                  elif box_range_10_pct <= 13:
                      box_score = 2

                  elif box_range_10_pct <= 16:
                      box_score = 1


              # ==================================================
              # 18. NÄHE BOX-TOP / BREAKOUT
              # max. 4 Punkte
              # ==================================================

              proximity_score = 0

              if (
                  breakout_status
                  == "BREAKOUT"
              ):

                  proximity_score = 4

              elif (
                  breakout_status
                  == "AT_TRIGGER"
              ):

                  proximity_score = 4

              elif (
                  breakout_status
                  == "NEAR"
              ):

                  proximity_score = 3

              elif (
                  breakout_status
                  == "WATCH"
              ):

                  proximity_score = 2

              elif (
                  breakout_status
                  == "FAR"
              ):

                  proximity_score = 0


              # ==================================================
              # 19. HÖHERE TIEFS / STRUKTUR
              # max. 3 Punkte
              # ==================================================

              structure_score = 0

              if (
                  higher_low is True
                  and trend_status == "UPTREND"
              ):

                  structure_score = 3

              elif (
                  higher_low is True
              ):

                  structure_score = 2

              elif (
                  trend_status == "UPTREND"
              ):

                  structure_score = 1


              # ==================================================
              # 20. VOLATILITÄTSKOMPRESSION
              # max. 3 Punkte
              #
              # Vergleich:
              # Range letzte 5 Tage
              # gegen Range der vorherigen 5 Tage
              # ==================================================

              recent_high_5 = (
                  get_high(last_5)
              )

              recent_low_5 = (
                  get_low(last_5)
              )

              previous_high_5 = (
                  get_high(previous_5)
              )

              previous_low_5 = (
                  get_low(previous_5)
              )

              recent_range_5_pct = (
                  range_pct(
                      recent_high_5,
                      recent_low_5
                  )
              )

              previous_range_5_pct = (
                  range_pct(
                      previous_high_5,
                      previous_low_5
                  )
              )

              compression_ratio = None

              if (
                  recent_range_5_pct is not None
                  and previous_range_5_pct is not None
                  and previous_range_5_pct != 0
              ):

                  compression_ratio = (
                      recent_range_5_pct
                      / previous_range_5_pct
                  )

              compression_score = 0

              if (
                  compression_ratio
                  is not None
              ):

                  if compression_ratio <= 0.60:
                      compression_score = 3

                  elif compression_ratio <= 0.80:
                      compression_score = 2

                  elif compression_ratio <= 1.00:
                      compression_score = 1


              # ==================================================
              # 21. NÄHE 4W / 52W HOCH
              # max. 3 Punkte
              # ==================================================

              high_proximity_score = 0

              near_4w = (
                  distance_4w_high_pct is not None
                  and distance_4w_high_pct >= -5
              )

              near_52w = (
                  distance_52w_high_pct is not None
                  and distance_52w_high_pct >= -10
              )

              very_near_52w = (
                  distance_52w_high_pct is not None
                  and distance_52w_high_pct >= -5
              )

              if (
                  near_4w
                  and very_near_52w
              ):

                  high_proximity_score = 3

              elif (
                  near_4w
                  and near_52w
              ):

                  high_proximity_score = 2

              elif (
                  near_4w
                  or near_52w
              ):

                  high_proximity_score = 1


              # ==================================================
              # 22. KLARER TRIGGER
              # max. 2 Punkte
              # ==================================================

              trigger_score = 0

              if (
                  breakout_trigger is not None
                  and breakout_status
                  in [
                      "BREAKOUT",
                      "AT_TRIGGER",
                      "NEAR"
                  ]
              ):

                  trigger_score = 2

              elif (
                  breakout_trigger is not None
                  and breakout_status == "WATCH"
              ):

                  trigger_score = 1


              # ==================================================
              # 23. ECHTE TECHNISCHE BULLWERK-SÄULE
              # max. 20 Punkte
              # ==================================================

              technical_score = (
                  box_score
                  + proximity_score
                  + structure_score
                  + compression_score
                  + high_proximity_score
                  + trigger_score
              )

              technical_score = min(
                  technical_score,
                  20
              )


              # ==================================================
              # 24. Technischer Status
              # Nur zur leichteren Kontrolle
              # ==================================================

              if technical_score >= 17:

                  technical_grade = (
                      "VERY_STRONG"
                  )

              elif technical_score >= 14:

                  technical_grade = (
                      "STRONG"
                  )

              elif technical_score >= 10:

                  technical_grade = (
                      "CONSTRUCTIVE"
                  )

              elif technical_score >= 6:

                  technical_grade = (
                      "EARLY"
                  )

              else:

                  technical_grade = (
                      "WEAK"
                  )


              # ==================================================
              # 25. Historie kompakt speichern
              # ==================================================

              compact_history = []

              for row in historical[:260]:

                  compact_history.append({

                      "date":
                          row.get("date"),

                      "open":
                          safe_number(
                              row.get("open")
                          ),

                      "high":
                          safe_number(
                              row.get("high")
                          ),

                      "low":
                          safe_number(
                              row.get("low")
                          ),

                      "close":
                          safe_number(
                              row.get("close")
                          ),

                      "volume":
                          safe_number(
                              row.get("volume")
                          )

                  })


              # ==================================================
              # 26. Aktie speichern
              # ==================================================

              stocks.append({

                  "symbol":
                      symbol,

                  "name":
                      quote.get("name"),

                  "price":
                      current_price,

                  "change":
                      safe_number(
                          quote.get("change")
                      ),

                  "changePercentage":
                      safe_number(
                          quote.get(
                              "changePercentage"
                          )
                      ),

                  "volume":
                      current_volume,

                  "dayHigh":
                      current_day_high,

                  "dayLow":
                      current_day_low,


                  "technical": {

                      "breakoutTrigger20":
                          breakout_trigger,

                      "distanceToTriggerPct":
                          distance_trigger_pct,

                      "breakoutStatus":
                          breakout_status,

                      "triggerTouchedToday":
                          trigger_touched_today,

                      "high4WeekCalculated":
                          high_4w,

                      "distanceTo4WeekHighPct":
                          distance_4w_high_pct,

                      "high52WeekCalculated":
                          high_52w,

                      "distanceTo52WeekHighPct":
                          distance_52w_high_pct,

                      "ma20":
                          ma20,

                      "ma50":
                          ma50,

                      "distanceToMA20Pct":
                          distance_ma20_pct,

                      "distanceToMA50Pct":
                          distance_ma50_pct,

                      "aboveMA20":
                          above_ma20,

                      "aboveMA50":
                          above_ma50,

                      "ma20AboveMA50":
                          ma20_above_ma50,

                      "trendStatus":
                          trend_status,

                      "higherLow":
                          higher_low,

                      "averageVolume20":
                          avg_volume_20,

                      "volumeRatio20":
                          volume_ratio_20,

                      "volumeStatus":
                          volume_status,

                      "boxRange10Pct":
                          box_range_10_pct,

                      "recentRange5Pct":
                          recent_range_5_pct,

                      "previousRange5Pct":
                          previous_range_5_pct,

                      "compressionRatio":
                          compression_ratio,

                      "technicalScore":
                          technical_score,

                      "technicalGrade":
                          technical_grade,

                      "technicalBreakdown": {

                          "box":
                              box_score,

                          "proximity":
                              proximity_score,

                          "structure":
                              structure_score,

                          "compression":
                              compression_score,

                          "highProximity":
                              high_proximity_score,

                          "trigger":
                              trigger_score

                      },

                      "historyDays":
                          len(historical)

                  },


                  "history":
                      compact_history

              })


              # ==================================================
              # 27. GitHub Log
              # ==================================================

              print(
                  f"{symbol}: "
                  f"Preis={current_price} | "
                  f"Trigger={breakout_trigger} | "
                  f"Breakout={breakout_status} | "
                  f"Trend={trend_status} | "
                  f"Box={box_score}/5 | "
                  f"Proximity={proximity_score}/4 | "
                  f"Structure={structure_score}/3 | "
                  f"Compression={compression_score}/3 | "
                  f"Highs={high_proximity_score}/3 | "
                  f"TriggerScore={trigger_score}/2 | "
                  f"TECHNIK={technical_score}/20 "
                  f"({technical_grade})"
              )


          # ==================================================
          # 28. JSON erzeugen
          # ==================================================

          output = {

              "updated":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "source":
                  "Financial Modeling Prep",

              "version":
                  "bullwerk-market-data-v5",

              "scoreVersion":
                  "bullwerk-technical-v1",

              "stocks":
                  stocks

          }


          os.makedirs(
              "data",
              exist_ok=True
          )


          with open(
              "data/market-data.json",
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  output,
                  file,
                  ensure_ascii=False,
                  indent=2
              )


          print("")
          print("=" * 60)
          print(
              f"{len(stocks)} Aktien gespeichert."
          )
          print(
              "Bullwerk Market Data V5 erstellt."
          )
          print(
              "Technische Bullwerk-Säule: 0–20 Punkte."
          )
          print("=" * 60)

          PY


      - name: Neue Daten speichern
        run: |

          git config user.name \
            "Bullwerk Data Bot"

          git config user.email \
            "actions@github.com"

          git add \
            data/market-data.json

          if git diff --cached --quiet; then

            echo "Keine neuen Daten."

          else

            git commit \
              -m "Update Bullwerk market data v5"

            git push

          fi
