name: Update Bullwerk Market Data

on:
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * 1-5"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: FMP Daten abrufen und Kennzahlen berechnen
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.request
          import urllib.parse
          from datetime import datetime, timezone, timedelta

          api_key = os.environ["FMP_API_KEY"]

          symbols = [
              "AAPL",
              "MSFT",
              "NVDA",
              "AMD",
              "AMZN",
              "META",
              "GOOGL",
              "PLTR"
          ]

          stocks = []

          def get_json(url):
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Bullwerk-Markets/1.0"}
              )

              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.loads(response.read().decode("utf-8"))


          def safe_number(value):
              try:
                  if value is None:
                      return None
                  return float(value)
              except (TypeError, ValueError):
                  return None


          today = datetime.now(timezone.utc).date()
          history_start = today - timedelta(days=400)

          for symbol in symbols:

              print(f"Verarbeite {symbol} ...")

              quote = {}
              historical = []

              # ---------------------------------------
              # 1. Aktuelle Kursdaten
              # ---------------------------------------

              try:
                  quote_url = (
                      "https://financialmodelingprep.com/stable/quote"
                      f"?symbol={urllib.parse.quote(symbol)}"
                      f"&apikey={urllib.parse.quote(api_key)}"
                  )

                  quote_result = get_json(quote_url)

                  if isinstance(quote_result, list) and quote_result:
                      quote = quote_result[0]

                  elif isinstance(quote_result, dict):
                      quote = quote_result

              except Exception as error:
                  print(f"Quote-Fehler bei {symbol}: {error}")


              # ---------------------------------------
              # 2. Historische Tageskurse
              # ---------------------------------------

              try:
                  history_url = (
                      "https://financialmodelingprep.com/stable/historical-price-eod/full"
                      f"?symbol={urllib.parse.quote(symbol)}"
                      f"&from={history_start.isoformat()}"
                      f"&to={today.isoformat()}"
                      f"&apikey={urllib.parse.quote(api_key)}"
                  )

                  history_result = get_json(history_url)

                  if isinstance(history_result, list):
                      historical = history_result

                  elif isinstance(history_result, dict):

                      if isinstance(history_result.get("historical"), list):
                          historical = history_result["historical"]

                      elif isinstance(history_result.get("data"), list):
                          historical = history_result["data"]

              except Exception as error:
                  print(f"History-Fehler bei {symbol}: {error}")


              # ---------------------------------------
              # 3. Historische Daten sortieren
              # ---------------------------------------

              historical = [
                  row for row in historical
                  if isinstance(row, dict) and row.get("date")
              ]

              historical.sort(
                  key=lambda row: row.get("date", ""),
                  reverse=True
              )


              # ---------------------------------------
              # 4. Technische Kennzahlen
              # ---------------------------------------

              last_20 = historical[:20]
              last_252 = historical[:252]

              highs_20 = [
                  safe_number(row.get("high"))
                  for row in last_20
              ]

              highs_20 = [
                  value for value in highs_20
                  if value is not None
              ]

              highs_252 = [
                  safe_number(row.get("high"))
                  for row in last_252
              ]

              highs_252 = [
                  value for value in highs_252
                  if value is not None
              ]

              volumes_20 = [
                  safe_number(row.get("volume"))
                  for row in last_20
              ]

              volumes_20 = [
                  value for value in volumes_20
                  if value is not None
              ]

              high_20 = max(highs_20) if highs_20 else None
              high_52w = max(highs_252) if highs_252 else None

              avg_volume_20 = (
                  sum(volumes_20) / len(volumes_20)
                  if volumes_20
                  else None
              )

              current_price = safe_number(quote.get("price"))

              distance_20_high_pct = None

              if (
                  current_price is not None
                  and high_20 is not None
                  and high_20 != 0
              ):
                  distance_20_high_pct = (
                      (current_price / high_20) - 1
                  ) * 100


              # ---------------------------------------
              # 5. Nur kompakte Historie speichern
              # ---------------------------------------

              compact_history = []

              for row in historical[:260]:

                  compact_history.append({
                      "date": row.get("date"),
                      "open": safe_number(row.get("open")),
                      "high": safe_number(row.get("high")),
                      "low": safe_number(row.get("low")),
                      "close": safe_number(row.get("close")),
                      "volume": safe_number(row.get("volume"))
                  })


              # ---------------------------------------
              # 6. Aktie speichern
              # ---------------------------------------

              stocks.append({
                  "symbol": symbol,
                  "name": quote.get("name"),
                  "price": current_price,
                  "change": safe_number(quote.get("change")),
                  "changePercentage": safe_number(
                      quote.get("changePercentage")
                  ),
                  "volume": safe_number(quote.get("volume")),
                  "dayHigh": safe_number(quote.get("dayHigh")),
                  "dayLow": safe_number(quote.get("dayLow")),

                  "technical": {
                      "high20": high_20,
                      "high52WeekCalculated": high_52w,
                      "distanceTo20DayHighPct": distance_20_high_pct,
                      "averageVolume20": avg_volume_20,
                      "historyDays": len(historical)
                  },

                  "history": compact_history
              })

              print(
                  f"{symbol}: "
                  f"{len(historical)} historische Tage | "
                  f"20T-Hoch={high_20} | "
                  f"52W-Hoch={high_52w}"
              )


          output = {
              "updated": datetime.now(timezone.utc).isoformat(),
              "source": "Financial Modeling Prep",
              "version": "bullwerk-market-data-v2",
              "stocks": stocks
          }

          os.makedirs("data", exist_ok=True)

          with open(
              "data/market-data.json",
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  output,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          print("----------------------------------")
          print(f"{len(stocks)} Aktien gespeichert.")
          print("Bullwerk Market Data V2 erstellt.")
          print("----------------------------------")

          PY

      - name: Neue Daten speichern
        run: |
          git config user.name "Bullwerk Data Bot"
          git config user.email "actions@github.com"

          git add data/market-data.json

          if git diff --cached --quiet; then
            echo "Keine neuen Daten."
          else
            git commit -m "Update Bullwerk market data v2"
            git push
          fi
