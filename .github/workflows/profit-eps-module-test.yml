name: Bullwerk Profit EPS Module Test

on:
  workflow_dispatch:

jobs:
  test-profit-eps:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Profit EPS Modul testen
        run: |
          python - <<'PY'
          from scanner.sec_data import get_company_facts
          from scanner.profit_eps import get_profit_eps_data

          companies = {
              "AAPL": "0000320193",
              "MSFT": "0000789019",
              "NVDA": "0001045810",
              "AMD":  "0000002488",
          }

          print("=== BULLWERK PROFIT & EPS MODULE TEST ===")

          for symbol, cik in companies.items():
              print()
              print("=" * 70)
              print("Unternehmen:", symbol)

              facts = get_company_facts(cik)
              result = get_profit_eps_data(facts)

              print("PROFIT CONCEPT:", result["profit_concept"])
              print("PROFIT DATENSÄTZE:", len(result["profit_rows"]))
              print("EPS CONCEPT:", result["eps_concept"])
              print("EPS DATENSÄTZE:", len(result["eps_rows"]))

              if not result["profit_rows"]:
                  raise RuntimeError(
                      f"{symbol}: Keine Profit-Daten gefunden."
                  )

              if not result["eps_rows"]:
                  raise RuntimeError(
                      f"{symbol}: Keine EPS-Daten gefunden."
                  )

          print()
          print("=== TEST ERFOLGREICH ===")
          PY
