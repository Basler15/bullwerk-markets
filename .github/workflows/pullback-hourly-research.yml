name: Bullwerk Pullback Hourly Research (private)

on:
  workflow_dispatch:
  schedule:
    - cron: "13 7-21 * * 1-5"

permissions:
  contents: read

concurrency:
  group: bullwerk-pullback-hourly
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install yfinance pandas requests lxml
      - name: Scan for recent pullback formations
        run: python tests/pullback_hourly_research.py
