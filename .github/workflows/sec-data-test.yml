name: Bullwerk SEC Data Test

on:
  workflow_dispatch:

jobs:
  test-sec-data:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: SEC Datenmodul testen
        run: |
          python - <<'PY'
          from scanner.sec_data import get_company_facts

          # NVIDIA
          CIK = "1045810"

          print("=== BULLWERK SEC DATA TEST ===")
          print("Unternehmen: NVDA")
          print("CIK:", CIK)

          facts = get_company_facts(CIK)

          print("SEC-Daten erfolgreich geladen.")
          print("Unternehmensname:", facts.get("entityName"))
          print("CIK:", facts.get("cik"))

          us_gaap = facts.get("facts", {}).get("us-gaap", {})

          print("US-GAAP Concepts:", len(us_gaap))

          if us_gaap:
              print("TEST ERFOLGREICH")
          else:
              raise RuntimeError("Keine US-GAAP-Daten gefunden.")

          print("=== TEST BEENDET ===")
          PY
