name: Bullwerk Opening Range Historical Test (isolated)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install yfinance pandas
      - name: Verify 10 historical opening ranges for PLTR and NVDA
        run: python tests/opening_range_30m_verify.py
