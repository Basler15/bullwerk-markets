name: Bullwerk Intraday Range Watchlist (private test)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: python -m pip install yfinance pandas
      - name: Find 5-minute range watchlist
        run: python tests/intraday_range_watchlist.py
