name: Bullwerk ORB Trade Backtest (isolated)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install yfinance pandas
      - name: Evaluate historical ORB entries stops and targets
        run: python tests/orb_30m_trade_backtest.py
