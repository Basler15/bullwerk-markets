name: Bullwerk Score Integration Test V2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bullwerk-score-test:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Technical und Fundamental automatisch verbinden
        run: |
          python3 <<'PY'

          import json

          # ==================================================
          # BULLWERK SCORE – INTEGRATION V2
          #
          # Technical Setup / Darvas     0–20
          # Fundamental Momentum         0–20
          # ---------------------------------
          # Aktueller Bullwerk Teilscore 0–40
          #
          # Beide Werte werden automatisch aus den
          # Bullwerk-Datendateien geladen.
          # ==================================================

          # ==================================================
          # Technische Daten laden
          # ==================================================

          with open(
              "data/market-data.json",
              "r",
              encoding="utf-8"
          ) as file:

              market_data = json.load(file)

          # ==================================================
          # Fundamentaldaten laden
          # ==================================================

          with open(
              "data/fundamental-data.json",
              "r",
              encoding="utf-8"
          ) as file:

              fundamental_data = json.load(file)

          market_stocks = market_data.get(
              "stocks",
              []
          )

          fundamental_stocks = fundamental_data.get(
              "stocks",
              []
          )

          # ==================================================
          # Fundamentaldaten nach Symbol indexieren
          # ==================================================

          fundamental_by_symbol = {}

          for stock in fundamental_stocks:

              symbol = stock.get("symbol")

              if symbol:

                  fundamental_by_symbol[symbol] = stock

          # ==================================================
          # Kontrolle
          # ==================================================

          print("")
          print("=" * 78)
          print("BULLWERK SCORE – INTEGRATION V2")
          print("=" * 78)

          print(
              f"Technische Aktien geladen: "
              f"{len(market_stocks)}"
          )

          print(
              f"Fundamentale Aktien geladen: "
              f"{len(fundamental_stocks)}"
          )

          print("")

          results = []

          complete_count = 0
          incomplete_count = 0

          # ==================================================
          # Aktien zusammenführen
          # ==================================================

          for market_stock in market_stocks:

              symbol = market_stock.get(
                  "symbol"
              )

              technical = market_stock.get(
                  "technical",
                  {}
              )

              technical_score = technical.get(
                  "technicalScore"
              )

              fundamental_stock = (
                  fundamental_by_symbol.get(
                      symbol,
                      {}
                  )
              )

              fundamental_score = (
                  fundamental_stock.get(
                      "fundamentalScore"
                  )
              )

              # ==============================================
              # Teilscore 0–40
              # Nur wenn beide Säulen vorhanden sind
              # ==============================================

              partial_score_40 = None

              if (
                  technical_score is not None
                  and fundamental_score is not None
              ):

                  partial_score_40 = round(
                      float(technical_score)
                      + float(fundamental_score),
                      1
                  )

                  complete_count += 1

              else:

                  incomplete_count += 1

              # ==============================================
              # Breakdown übernehmen
              # ==============================================

              fundamental_breakdown = (
                  fundamental_stock.get(
                      "breakdown"
                  )
              )

              technical_breakdown = (
                  technical.get(
                      "technicalBreakdown"
                  )
              )

              result = {

                  "symbol":
                      symbol,

                  "technicalScore":
                      technical_score,

                  "fundamentalScore":
                      fundamental_score,

                  "partialScore40":
                      partial_score_40,

                  "available":
                      partial_score_40 is not None,

                  "technicalBreakdown":
                      technical_breakdown,

                  "fundamentalBreakdown":
                      fundamental_breakdown

              }

              results.append(result)

              # ==============================================
              # GitHub Log
              # ==============================================

              if partial_score_40 is not None:

                  print(
                      f"{symbol}: "
                      f"Technik={technical_score}/20 | "
                      f"Fundamental={fundamental_score}/20 | "
                      f"TEILSCORE={partial_score_40}/40"
                  )

              else:

                  print(
                      f"{symbol}: "
                      f"Technik={technical_score} | "
                      f"Fundamental={fundamental_score} | "
                      f"TEILSCORE=N/A"
                  )

          # ==================================================
          # Plausibilitätsprüfung
          # ==================================================

          print("")
          print("-" * 78)

          print(
              f"Vollständig verbunden: "
              f"{complete_count}"
          )

          print(
              f"Unvollständig: "
              f"{incomplete_count}"
          )

          # ==================================================
          # Testdatei erzeugen
          # ==================================================

          output = {

              "version":
                  "bullwerk-score-integration-v2",

              "maxScoreCurrentlyAvailable":
                  40,

              "pillarsCurrentlyConnected": [

                  {
                      "name":
                          "Technical Setup / Darvas",

                      "maxScore":
                          20
                  },

                  {
                      "name":
                          "Fundamental Momentum",

                      "maxScore":
                          20
                  }

              ],

              "technicalDataVersion":
                  market_data.get(
                      "version"
                  ),

              "fundamentalDataVersion":
                  fundamental_data.get(
                      "version"
                  ),

              "stocks":
                  results

          }

          with open(
              "bullwerk-score-test.json",
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  output,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          print("")
          print("=" * 78)

          if (
              complete_count == len(market_stocks)
              and incomplete_count == 0
          ):

              print(
                  "ERFOLG: Alle Aktien wurden "
                  "vollständig verbunden."
              )

          else:

              print(
                  "ACHTUNG: Mindestens eine Aktie "
                  "hat noch fehlende Daten."
              )

          print("=" * 78)

          PY

      - name: Ergebnis anzeigen
        run: |
          echo ""
          echo "===== bullwerk-score-test.json ====="
          cat bullwerk-score-test.json
