name: Bullwerk Pullback Volume Watch (private test)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install yfinance pandas
      - name: Scan green impulse and low-volume red pullbacks
        run: python tests/pullback_volume_watch.py
