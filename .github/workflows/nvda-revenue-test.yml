name: NVDA Revenue SEC Test

on:
  workflow_dispatch:

jobs:
  nvda-revenue-test:
    runs-on: ubuntu-latest

    steps:
      - name: NVDA Revenue-Daten der SEC untersuchen
        run: |
          python3 <<'PY'

          import json
          import urllib.request

          CIK = "0001045810"

          USER_AGENT = (
              "Bullwerk Markets "
              "contact: bullwerkmarkets@gmail.com"
          )

          url = (
              "https://data.sec.gov/"
              "api/xbrl/companyfacts/"
              f"CIK{CIK}.json"
          )

          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent": USER_AGENT,
                  "Accept": "application/json",
                  "Accept-Encoding": "identity"
              }
          )

          with urllib.request.urlopen(
              request,
              timeout=30
          ) as response:

              print(
                  "HTTP Status:",
                  response.status
              )

              facts = json.loads(
                  response.read().decode("utf-8")
              )


          print("")
          print("=" * 90)
          print("NVDA SEC REVENUE DIAGNOSE")
          print("=" * 90)

          print(
              "Unternehmen:",
              facts.get("entityName")
          )

          us_gaap = (
              facts
              .get("facts", {})
              .get("us-gaap", {})
          )


          # ------------------------------------------------------------
          # 1. Alle Concepts suchen, deren Name nach Umsatz aussieht
          # ------------------------------------------------------------

          keywords = [
              "revenue",
              "sales"
          ]

          candidates = []

          for concept_name, concept_data in us_gaap.items():

              name_lower = concept_name.lower()

              if any(
                  keyword in name_lower
                  for keyword in keywords
              ):

                  candidates.append(
                      (
                          concept_name,
                          concept_data
                      )
                  )


          print("")
          print(
              "Gefundene Revenue/Sales Concepts:",
              len(candidates)
          )


          # ------------------------------------------------------------
          # 2. Alle Kandidaten anzeigen
          # ------------------------------------------------------------

          for concept_name, concept_data in candidates:

              print("")
              print("-" * 90)

              print(
                  "CONCEPT:",
                  concept_name
              )

              print(
                  "LABEL:",
                  concept_data.get("label")
              )

              print(
                  "DESCRIPTION:",
                  concept_data.get("description")
              )

              units = concept_data.get(
                  "units",
                  {}
              )

              print(
                  "UNITS:",
                  list(units.keys())
              )


              # --------------------------------------------------------
              # 3. USD-Werte untersuchen
              # --------------------------------------------------------

              rows = units.get(
                  "USD",
                  []
              )

              if not rows:

                  print(
                      "Keine USD-Daten vorhanden."
                  )

                  continue


              valid_rows = []

              for row in rows:

                  if row.get("form") not in (
                      "10-Q",
                      "10-K"
                  ):
                      continue

                  if row.get("val") is None:
                      continue

                  if not row.get("end"):
                      continue

                  valid_rows.append(row)


              valid_rows.sort(
                  key=lambda x: (
                      x.get("end") or "",
                      x.get("filed") or ""
                  ),
                  reverse=True
              )


              print(
                  "10-Q/10-K Datensätze:",
                  len(valid_rows)
              )


              for row in valid_rows[:20]:

                  print(
                      row.get("end"),
                      "| start:",
                      row.get("start"),
                      "| form:",
                      row.get("form"),
                      "| FY:",
                      row.get("fy"),
                      "| FP:",
                      row.get("fp"),
                      "| filed:",
                      row.get("filed"),
                      "| value:",
                      row.get("val")
                  )


          # ------------------------------------------------------------
          # 4. Die drei Concepts aus Bullwerk V7 gezielt prüfen
          # ------------------------------------------------------------

          print("")
          print("=" * 90)
          print("BULLWERK V7 REVENUE CONCEPTS")
          print("=" * 90)


          bullwerk_concepts = [
              "RevenueFromContractWithCustomerExcludingAssessedTax",
              "SalesRevenueNet",
              "Revenues"
          ]


          for concept_name in bullwerk_concepts:

              print("")
              print(
                  "CONCEPT:",
                  concept_name
              )

              concept_data = us_gaap.get(
                  concept_name
              )

              if concept_data is None:

                  print(
                      "STATUS: NICHT VORHANDEN"
                  )

                  continue


              print(
                  "STATUS: VORHANDEN"
              )

              units = concept_data.get(
                  "units",
                  {}
              )

              print(
                  "UNITS:",
                  list(units.keys())
              )

              rows = units.get(
                  "USD",
                  []
              )

              print(
                  "USD Datensätze:",
                  len(rows)
              )

              recent = []

              for row in rows:

                  if row.get("form") not in (
                      "10-Q",
                      "10-K"
                  ):
                      continue

                  recent.append(row)


              recent.sort(
                  key=lambda x: (
                      x.get("end") or "",
                      x.get("filed") or ""
                  ),
                  reverse=True
              )


              for row in recent[:15]:

                  start = row.get("start")
                  end = row.get("end")

                  duration = None

                  if start and end:

                      from datetime import datetime

                      try:

                          start_date = datetime.strptime(
                              start,
                              "%Y-%m-%d"
                          ).date()

                          end_date = datetime.strptime(
                              end,
                              "%Y-%m-%d"
                          ).date()

                          duration = (
                              end_date
                              - start_date
                          ).days + 1

                      except ValueError:

                          pass


                  print(
                      end,
                      "| start:",
                      start,
                      "| duration:",
                      duration,
                      "| form:",
                      row.get("form"),
                      "| FY:",
                      row.get("fy"),
                      "| FP:",
                      row.get("fp"),
                      "| value:",
                      row.get("val")
                  )


          print("")
          print("=" * 90)
          print("NVDA Revenue SEC Test beendet.")
          print("=" * 90)

          PY
