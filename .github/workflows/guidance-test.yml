name: Bullwerk Guidance Test V6

on:
  workflow_dispatch:

jobs:
  guidance-test:
    runs-on: ubuntu-latest

    steps:
      - name: Guidance V6 vergleichen
        run: |
          python3 <<'PY'

          import json
          import re
          import time
          import urllib.request
          from html import unescape


          # ============================================================
          # BULLWERK MARKETS - GUIDANCE TEST V6
          #
          # NEU:
          # - zwei jüngste Earnings-8-Ks
          # - aktuelle + vorherige Guidance
          # - quantitative Guidance extrahieren
          # - gleiche Kennzahlen vergleichen
          #
          # Vorläufige Interpretation:
          # 3 = verbessert / erhöht
          # 2 = stabil / bestätigt
          # 1 = gemischt / vorsichtiger
          # 0 = gesenkt / verschlechtert
          # N/A = nicht zuverlässig vergleichbar
          #
          # NOCH TESTVERSION - NICHT FINAL EINGEFROREN
          # ============================================================


          COMPANIES = {
              "AAPL": "0000320193",
              "MSFT": "0000789019",
              "NVDA": "0001045810"
          }


          USER_AGENT = (
              "Bullwerk Markets "
              "contact: bullwerkmarkets@gmail.com"
          )


          # ============================================================
          # HTTP
          # ============================================================

          def request_bytes(url, accept="*/*"):

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": USER_AGENT,
                      "Accept": accept,
                      "Accept-Encoding": "identity"
                  }
              )

              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:

                  print(
                      "HTTP",
                      response.status,
                      url
                  )

                  return response.read()


          def get_json(url):

              return json.loads(
                  request_bytes(
                      url,
                      "application/json"
                  ).decode(
                      "utf-8",
                      errors="replace"
                  )
              )


          def get_text(url):

              return request_bytes(
                  url,
                  "text/html,*/*"
              ).decode(
                  "utf-8",
                  errors="replace"
              )


          # ============================================================
          # HTML -> TEXT
          # ============================================================

          def html_to_text(html):

              html = re.sub(
                  r"(?is)<script.*?>.*?</script>",
                  " ",
                  html
              )

              html = re.sub(
                  r"(?is)<style.*?>.*?</style>",
                  " ",
                  html
              )


              for tag in [
                  r"<br\s*/?>",
                  r"</p>",
                  r"</div>",
                  r"</tr>",
                  r"</li>",
                  r"</h1>",
                  r"</h2>",
                  r"</h3>"
              ]:

                  html = re.sub(
                      rf"(?i){tag}",
                      ". ",
                      html
                  )


              html = re.sub(
                  r"(?is)<[^>]+>",
                  " ",
                  html
              )

              text = unescape(html)

              text = text.replace(
                  "\xa0",
                  " "
              )

              text = re.sub(
                  r"\s+",
                  " ",
                  text
              )

              return text.strip()


          # ============================================================
          # SEC SUBMISSIONS
          # ============================================================

          def load_submissions(cik):

              return get_json(
                  "https://data.sec.gov/"
                  "submissions/"
                  f"CIK{cik}.json"
              )


          # ============================================================
          # ZWEI JÜNGSTE EARNINGS 8-Ks
          # ============================================================

          def latest_earnings_filings(
              data,
              limit=2
          ):

              recent = (
                  data.get("filings", {})
                      .get("recent", {})
              )


              accessions = recent.get(
                  "accessionNumber",
                  []
              )

              filing_dates = recent.get(
                  "filingDate",
                  []
              )

              report_dates = recent.get(
                  "reportDate",
                  []
              )

              forms = recent.get(
                  "form",
                  []
              )

              items_list = recent.get(
                  "items",
                  []
              )

              documents = recent.get(
                  "primaryDocument",
                  []
              )


              result = []


              count = min(
                  len(accessions),
                  len(filing_dates),
                  len(forms),
                  len(documents)
              )


              for i in range(count):

                  form = forms[i]

                  items = (
                      items_list[i]
                      if i < len(items_list)
                      else ""
                  )


                  if (
                      form in ("8-K", "8-K/A")
                      and "2.02" in items
                  ):

                      result.append({

                          "accession":
                              accessions[i],

                          "filing_date":
                              filing_dates[i],

                          "report_date":
                              (
                                  report_dates[i]
                                  if i < len(report_dates)
                                  else ""
                              ),

                          "items":
                              items,

                          "primary_document":
                              documents[i]
                      })


                      if len(result) >= limit:
                          break


              return result


          # ============================================================
          # ARCHIVE
          # ============================================================

          def archive_base(cik, accession):

              cik_number = str(
                  int(cik)
              )

              accession_clean = (
                  accession.replace(
                      "-",
                      ""
                  )
              )

              return (
                  "https://www.sec.gov/"
                  "Archives/edgar/data/"
                  f"{cik_number}/"
                  f"{accession_clean}/"
              )


          def load_filing_index(
              cik,
              accession
          ):

              base = archive_base(
                  cik,
                  accession
              )

              index = get_json(
                  base + "index.json"
              )

              return base, index


          # ============================================================
          # DOKUMENTE
          # ============================================================

          def get_html_files(index_data):

              items = (
                  index_data
                  .get("directory", {})
                  .get("item", [])
              )


              result = []


              for item in items:

                  name = (
                      item.get("name")
                      or ""
                  )


                  if name.lower().endswith(
                      (".htm", ".html")
                  ):

                      result.append(name)


              return result


          def document_priority(name):

              lower = name.lower()

              score = 0


              if "cfocommentary" in lower:
                  score += 150


              if (
                  "cfo" in lower
                  and "commentary" in lower
              ):
                  score += 150


              if "earningscommentary" in lower:
                  score += 140


              if (
                  "earnings" in lower
                  and "commentary" in lower
              ):
                  score += 140


              if "financialcommentary" in lower:
                  score += 130


              if "outlook" in lower:
                  score += 120


              if "ex99" in lower:
                  score += 100


              if "exhibit99" in lower:
                  score += 100


              if (
                  "99-1" in lower
                  or "99_1" in lower
                  or "99.1" in lower
              ):
                  score += 95


              if "earn" in lower:
                  score += 40


              if "release" in lower:
                  score += 35


              if "results" in lower:
                  score += 25


              if "index" in lower:
                  score -= 100


              if "header" in lower:
                  score -= 100


              return score


          def should_scan_document(
              name,
              primary_document
          ):

              lower = name.lower()

              primary = (
                  primary_document
                  or ""
              ).lower()


              if lower == primary:
                  return False


              if (
                  "index" in lower
                  or "header" in lower
              ):
                  return False


              if document_priority(name) >= 40:
                  return True


              if "commentary" in lower:
                  return True


              return False


          # ============================================================
          # GUIDANCE-TEXT FINDEN
          # ============================================================

          GUIDANCE_ANCHORS = [

              r"\boutlook for the first quarter\b",
              r"\boutlook for the second quarter\b",
              r"\boutlook for the third quarter\b",
              r"\boutlook for the fourth quarter\b",

              r"\boutlook for q1\b",
              r"\boutlook for q2\b",
              r"\boutlook for q3\b",
              r"\boutlook for q4\b",

              r"\bquarterly outlook\b",

              r"\bguidance for the first quarter\b",
              r"\bguidance for the second quarter\b",
              r"\bguidance for the third quarter\b",
              r"\bguidance for the fourth quarter\b",

              r"\bfull[- ]year outlook\b",
              r"\bfull[- ]year guidance\b"
          ]


          def find_guidance_region(text):

              lower = text.lower()


              positions = []


              for pattern in GUIDANCE_ANCHORS:

                  match = re.search(
                      pattern,
                      lower,
                      flags=re.I
                  )


                  if match:

                      positions.append(
                          match.start()
                      )


              if not positions:

                  return None


              start = min(
                  positions
              )


              # Genug Text für mehrere Guidance-Punkte,
              # aber nicht das ganze Dokument.

              end = min(
                  len(text),
                  start + 5000
              )


              return text[
                  start:end
              ]


          # ============================================================
          # ZAHLEN NORMALISIEREN
          # ============================================================

          def number(value):

              return float(
                  value.replace(
                      ",",
                      ""
                  )
              )


          # ============================================================
          # GUIDANCE EXTRAKTION
          # ============================================================

          def extract_guidance(region):

              if not region:
                  return {}


              result = {}

              text = region


              # --------------------------------------------------------
              # REVENUE
              #
              # Beispiele:
              # Revenue is expected to be $54.0 billion,
              # plus or minus 2%.
              #
              # Revenue expected between $x and $y billion.
              # --------------------------------------------------------

              revenue_center = re.search(

                  r"revenue.{0,100}?"
                  r"(?:expected|expect)"
                  r".{0,80}?"
                  r"\$\s*"
                  r"([\d,.]+)"
                  r"\s*"
                  r"(billion|million)",

                  text,
                  flags=re.I
              )


              if revenue_center:

                  value = number(
                      revenue_center.group(1)
                  )

                  unit = (
                      revenue_center
                      .group(2)
                      .lower()
                  )


                  if unit == "million":
                      value /= 1000


                  result[
                      "revenue_billions"
                  ] = value


              revenue_range = re.search(

                  r"revenue.{0,120}?"
                  r"\$\s*"
                  r"([\d,.]+)"
                  r"\s*(?:billion|million)?"
                  r".{0,30}?"
                  r"(?:to|-|and)"
                  r".{0,30}?"
                  r"\$?\s*"
                  r"([\d,.]+)"
                  r"\s*"
                  r"(billion|million)",

                  text,
                  flags=re.I
              )


              if revenue_range:

                  low = number(
                      revenue_range.group(1)
                  )

                  high = number(
                      revenue_range.group(2)
                  )

                  unit = (
                      revenue_range
                      .group(3)
                      .lower()
                  )


                  if unit == "million":

                      low /= 1000
                      high /= 1000


                  result[
                      "revenue_low_billions"
                  ] = low

                  result[
                      "revenue_high_billions"
                  ] = high

                  result[
                      "revenue_mid_billions"
                  ] = (
                      low + high
                  ) / 2


              # --------------------------------------------------------
              # GROSS MARGIN
              # --------------------------------------------------------

              gross_margin = re.search(

                  r"gross margins?"
                  r".{0,100}?"
                  r"(?:expected|expect)"
                  r".{0,80}?"
                  r"([\d.]+)\s*%",

                  text,
                  flags=re.I
              )


              if gross_margin:

                  result[
                      "gross_margin_pct"
                  ] = float(
                      gross_margin.group(1)
                  )


              # --------------------------------------------------------
              # OPERATING EXPENSES
              # --------------------------------------------------------

              opex = re.search(

                  r"operating expenses?"
                  r".{0,100}?"
                  r"(?:expected|expect)"
                  r".{0,100}?"
                  r"\$\s*"
                  r"([\d,.]+)"
                  r"\s*"
                  r"(billion|million)",

                  text,
                  flags=re.I
              )


              if opex:

                  value = number(
                      opex.group(1)
                  )

                  unit = (
                      opex.group(2)
                      .lower()
                  )


                  if unit == "million":
                      value /= 1000


                  result[
                      "operating_expenses_billions"
                  ] = value


              # --------------------------------------------------------
              # TAX RATE
              # --------------------------------------------------------

              tax_rate = re.search(

                  r"tax rates?"
                  r".{0,100}?"
                  r"(?:expected|expect)"
                  r".{0,100}?"
                  r"([\d.]+)\s*%",

                  text,
                  flags=re.I
              )


              if tax_rate:

                  result[
                      "tax_rate_pct"
                  ] = float(
                      tax_rate.group(1)
                  )


              return result


          # ============================================================
          # GUIDANCE AUS EINEM FILING
          # ============================================================

          def extract_from_filing(
              cik,
              filing
          ):

              base, index_data = (
                  load_filing_index(
                      cik,
                      filing[
                          "accession"
                      ]
                  )
              )


              files = (
                  get_html_files(
                      index_data
                  )
              )


              files.sort(
                  key=document_priority,
                  reverse=True
              )


              print(
                  "Filing:",
                  filing[
                      "filing_date"
                  ]
              )


              for name in files[:12]:

                  if not should_scan_document(
                      name,
                      filing[
                          "primary_document"
                      ]
                  ):

                      continue


                  print(
                      "Prüfe:",
                      name,
                      "| Priorität:",
                      document_priority(
                          name
                      )
                  )


                  try:

                      html = get_text(
                          base + name
                      )

                  except Exception as error:

                      print(
                          "Dokumentfehler:",
                          error
                      )

                      continue


                  text = html_to_text(
                      html
                  )


                  region = (
                      find_guidance_region(
                          text
                      )
                  )


                  if not region:

                      continue


                  guidance = (
                      extract_guidance(
                          region
                      )
                  )


                  if guidance:

                      print(
                          "Guidance-Dokument:",
                          name
                      )

                      print(
                          "Extrahiert:",
                          json.dumps(
                              guidance,
                              indent=2
                          )
                      )


                      return {
                          "filing_date":
                              filing[
                                  "filing_date"
                              ],

                          "document":
                              name,

                          "guidance":
                              guidance,

                          "text":
                              region[:1800]
                      }


              return None


          # ============================================================
          # VERGLEICH
          # ============================================================

          def percent_change(
              current,
              previous
          ):

              if previous == 0:
                  return None


              return (
                  (
                      current
                      - previous
                  )
                  / abs(previous)
                  * 100
              )


          def compare_guidance(
              current,
              previous
          ):

              if (
                  not current
                  or not previous
              ):

                  return {
                      "score": None,
                      "status": "N/A",
                      "reason":
                          "Aktuelle oder vorherige "
                          "Guidance fehlt."
                  }


              current_g = (
                  current[
                      "guidance"
                  ]
              )

              previous_g = (
                  previous[
                      "guidance"
                  ]
              )


              comparisons = []


              # --------------------------------------------------------
              # REVENUE
              # Höher = grundsätzlich positiv
              # --------------------------------------------------------

              current_revenue = (
                  current_g.get(
                      "revenue_mid_billions"
                  )
                  or current_g.get(
                      "revenue_billions"
                  )
              )

              previous_revenue = (
                  previous_g.get(
                      "revenue_mid_billions"
                  )
                  or previous_g.get(
                      "revenue_billions"
                  )
              )


              if (
                  current_revenue is not None
                  and previous_revenue is not None
              ):

                  change = percent_change(
                      current_revenue,
                      previous_revenue
                  )


                  comparisons.append({

                      "metric":
                          "Revenue",

                      "current":
                          current_revenue,

                      "previous":
                          previous_revenue,

                      "change":
                          change,

                      "direction":
                          (
                              1
                              if change > 1
                              else
                              -1
                              if change < -1
                              else
                              0
                          )
                  })


              # --------------------------------------------------------
              # GROSS MARGIN
              # Höher = positiv
              # --------------------------------------------------------

              if (
                  "gross_margin_pct"
                  in current_g
                  and
                  "gross_margin_pct"
                  in previous_g
              ):

                  current_value = (
                      current_g[
                          "gross_margin_pct"
                      ]
                  )

                  previous_value = (
                      previous_g[
                          "gross_margin_pct"
                      ]
                  )

                  diff = (
                      current_value
                      - previous_value
                  )


                  comparisons.append({

                      "metric":
                          "Gross Margin",

                      "current":
                          current_value,

                      "previous":
                          previous_value,

                      "change":
                          diff,

                      "direction":
                          (
                              1
                              if diff >= 0.25
                              else
                              -1
                              if diff <= -0.25
                              else
                              0
                          )
                  })


              # --------------------------------------------------------
              # OPERATING EXPENSES
              #
              # Noch NICHT als Richtung werten.
              # Höhere Kosten können bei starkem Wachstum
              # sinnvoll sein.
              # --------------------------------------------------------

              if (
                  "operating_expenses_billions"
                  in current_g
                  and
                  "operating_expenses_billions"
                  in previous_g
              ):

                  comparisons.append({

                      "metric":
                          "Operating Expenses",

                      "current":
                          current_g[
                              "operating_expenses_billions"
                          ],

                      "previous":
                          previous_g[
                              "operating_expenses_billions"
                          ],

                      "change":
                          percent_change(
                              current_g[
                                  "operating_expenses_billions"
                              ],
                              previous_g[
                                  "operating_expenses_billions"
                              ]
                          ),

                      "direction":
                          None
                  })


              # --------------------------------------------------------
              # NUR gerichtete Kennzahlen bewerten
              # --------------------------------------------------------

              directional = [

                  item

                  for item in comparisons

                  if item[
                      "direction"
                  ] is not None
              ]


              if not directional:

                  return {
                      "score": None,
                      "status": "N/A",
                      "reason":
                          "Keine direkt vergleichbare "
                          "gerichtete Kennzahl gefunden.",
                      "comparisons":
                          comparisons
                  }


              positive = sum(
                  1
                  for item in directional
                  if item[
                      "direction"
                  ] > 0
              )

              negative = sum(
                  1
                  for item in directional
                  if item[
                      "direction"
                  ] < 0
              )

              stable = sum(
                  1
                  for item in directional
                  if item[
                      "direction"
                  ] == 0
              )


              # --------------------------------------------------------
              # VORLÄUFIGE V6-LOGIK
              # --------------------------------------------------------

              if (
                  positive > 0
                  and negative == 0
              ):

                  score = 3

                  status = (
                      "IMPROVED"
                  )

                  reason = (
                      "Vergleichbare Guidance "
                      "hat sich verbessert."
                  )


              elif (
                  positive == 0
                  and negative == 0
                  and stable > 0
              ):

                  score = 2

                  status = (
                      "STABLE"
                  )

                  reason = (
                      "Vergleichbare Guidance "
                      "ist weitgehend stabil."
                  )


              elif (
                  positive > 0
                  and negative > 0
              ):

                  score = 1

                  status = (
                      "MIXED"
                  )

                  reason = (
                      "Guidance-Signale sind "
                      "gemischt."
                  )


              elif negative > 0:

                  score = 0

                  status = (
                      "WEAKER"
                  )

                  reason = (
                      "Vergleichbare Guidance "
                      "hat sich verschlechtert."
                  )


              else:

                  score = None

                  status = "N/A"

                  reason = (
                      "Kein belastbarer "
                      "Vergleich möglich."
                  )


              return {
                  "score":
                      score,

                  "status":
                      status,

                  "reason":
                      reason,

                  "comparisons":
                      comparisons
              }


          # ============================================================
          # HAUPTLAUF
          # ============================================================

          for symbol, cik in COMPANIES.items():

              print("")
              print("=" * 105)

              print(
                  "BULLWERK GUIDANCE V6:",
                  symbol
              )

              print("=" * 105)


              try:

                  submissions = (
                      load_submissions(
                          cik
                      )
                  )


                  print(
                      "Unternehmen:",
                      submissions.get(
                          "name"
                      )
                  )


                  filings = (
                      latest_earnings_filings(
                          submissions,
                          limit=2
                      )
                  )


                  print(
                      "Gefundene Earnings-Filings:",
                      len(filings)
                  )


                  if len(filings) < 2:

                      print(
                          "GUIDANCE SCORE: N/A"
                      )

                      print(
                          "Grund: Weniger als zwei "
                          "vergleichbare Earnings-Filings."
                      )

                      continue


                  print("")
                  print(
                      "AKTUELLE GUIDANCE"
                  )

                  print("-" * 105)


                  current = (
                      extract_from_filing(
                          cik,
                          filings[0]
                      )
                  )


                  print("")
                  print(
                      "VORHERIGE GUIDANCE"
                  )

                  print("-" * 105)


                  previous = (
                      extract_from_filing(
                          cik,
                          filings[1]
                      )
                  )


                  print("")
                  print("=" * 105)

                  print(
                      "GUIDANCE-VERGLEICH"
                  )

                  print("=" * 105)


                  result = (
                      compare_guidance(
                          current,
                          previous
                      )
                  )


                  comparisons = (
                      result.get(
                          "comparisons",
                          []
                      )
                  )


                  for item in comparisons:

                      print("")
                      print(
                          "Kennzahl:",
                          item[
                              "metric"
                          ]
                      )

                      print(
                          "Vorher:",
                          item[
                              "previous"
                          ]
                      )

                      print(
                          "Aktuell:",
                          item[
                              "current"
                          ]
                      )

                      print(
                          "Veränderung:",
                          item[
                              "change"
                          ]
                      )

                      print(
                          "Richtung:",
                          item[
                              "direction"
                          ]
                      )


                  print("")
                  print("=" * 105)

                  print(
                      "BULLWERK GUIDANCE "
                      "V6 ERGEBNIS"
                  )

                  print("=" * 105)


                  if (
                      result[
                          "score"
                      ]
                      is None
                  ):

                      print(
                          "GUIDANCE SCORE: N/A"
                      )


                  else:

                      print(
                          "GUIDANCE SCORE:",
                          f"{result['score']}/3"
                      )


                  print(
                      "STATUS:",
                      result[
                          "status"
                      ]
                  )

                  print(
                      "GRUND:",
                      result[
                          "reason"
                      ]
                  )


                  print("")
                  print(
                      "WICHTIG:"
                  )

                  print(
                      "V6 ist ein Vergleichstest. "
                      "Die 0-3-Regel wird erst "
                      "nach Gegenprüfung mehrerer "
                      "Unternehmen eingefroren."
                  )


              except Exception as error:

                  print(
                      "FEHLER bei",
                      symbol,
                      ":",
                      repr(error)
                  )


              print("")
              print(
                  symbol,
                  "abgeschlossen."
              )


              time.sleep(1)


          print("")
          print("=" * 105)

          print(
              "Bullwerk Guidance Test V6 beendet."
          )

          print("=" * 105)

          PY
