name: Bullwerk Guidance Test V3

on:
  workflow_dispatch:

jobs:
  guidance-test:
    runs-on: ubuntu-latest

    steps:
      - name: Echte Forward Guidance erkennen
        run: |
          python3 <<'PY'

          import json
          import re
          import time
          import urllib.request
          from html import unescape


          # ============================================================
          # BULLWERK MARKETS
          # GUIDANCE TEST V3
          #
          # Ziel:
          # - jüngste Earnings-8-K mit Item 2.02 finden
          # - Exhibit 99.1 / Earnings Release öffnen
          # - echte NEUE Zukunftsaussagen erkennen
          # - historische Guidance möglichst herausfiltern
          # - KEINE Punktevergabe
          # ============================================================


          COMPANIES = {
              "AAPL": "0000320193",
              "MSFT": "0000789019"
          }


          USER_AGENT = (
              "Bullwerk Markets "
              "contact: bullwerkmarkets@gmail.com"
          )


          # ============================================================
          # POSITIVE ZUKUNFTS-SIGNALE
          # ============================================================

          STRONG_FORWARD_PATTERNS = [

              r"\bwe expect\b",
              r"\bwe anticipate\b",
              r"\bwe forecast\b",
              r"\bwe project\b",
              r"\bwe estimate\b",

              r"\bcompany expects\b",
              r"\bcompany anticipates\b",
              r"\bcompany forecasts\b",

              r"\bmanagement expects\b",
              r"\bmanagement anticipates\b",

              r"\bfor the next quarter\b",
              r"\bfor the upcoming quarter\b",
              r"\bfor the coming quarter\b",

              r"\bnext quarter\b",
              r"\bnext fiscal year\b",
              r"\bnext fiscal quarter\b",

              r"\bfull[- ]year outlook\b",
              r"\bquarterly outlook\b",

              r"\bguidance for\b",
              r"\boutlook for\b",

              r"\bexpects revenue\b",
              r"\bexpect revenue\b",

              r"\bexpects.*operating margin\b",
              r"\bexpect.*operating margin\b",

              r"\bexpects.*gross margin\b",
              r"\bexpect.*gross margin\b",

              r"\bexpects.*earnings\b",
              r"\bexpect.*earnings\b"
          ]


          # ============================================================
          # HISTORISCHE / RÜCKBLICKENDE GUIDANCE
          #
          # Solche Formulierungen sollen NICHT als neue Guidance gelten.
          # ============================================================

          HISTORICAL_PATTERNS = [

              r"\bguidance provided\b",
              r"\bpreviously provided guidance\b",
              r"\bprevious guidance\b",
              r"\bprior guidance\b",

              r"\bcompared to our guidance\b",
              r"\bcompared with our guidance\b",

              r"\bversus our guidance\b",

              r"\bprovided on\b",

              r"\bpreviously announced\b",

              r"\blower[- ]than[- ]expected\b",
              r"\bhigher[- ]than[- ]expected\b",

              r"\bexceeded expectations\b",
              r"\bbelow expectations\b",

              r"\bresults.*compared\b",
              r"\bresults.*versus\b"
          ]


          # ============================================================
          # BEGRIFFE, DIE DEN INHALT INTERESSANT MACHEN
          # ============================================================

          BUSINESS_TERMS = [

              "revenue",
              "sales",
              "growth",
              "gross margin",
              "operating margin",
              "operating income",
              "earnings",
              "eps",
              "free cash flow",
              "cash flow",
              "capital expenditures",
              "capex",
              "expenses",
              "cloud",
              "services"
          ]


          # ============================================================
          # HTTP
          # ============================================================

          def request_bytes(url, accept="*/*"):

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": USER_AGENT,
                      "Accept": accept,
                      "Accept-Encoding": "identity"
                  }
              )

              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:

                  print(
                      "HTTP",
                      response.status,
                      url
                  )

                  return response.read()


          def get_json(url):

              raw = request_bytes(
                  url,
                  "application/json"
              )

              return json.loads(
                  raw.decode(
                      "utf-8",
                      errors="replace"
                  )
              )


          def get_text(url):

              raw = request_bytes(
                  url,
                  "text/html,*/*"
              )

              return raw.decode(
                  "utf-8",
                  errors="replace"
              )


          # ============================================================
          # HTML -> TEXT
          # ============================================================

          def html_to_text(html):

              html = re.sub(
                  r"(?is)<script.*?>.*?</script>",
                  " ",
                  html
              )

              html = re.sub(
                  r"(?is)<style.*?>.*?</style>",
                  " ",
                  html
              )

              html = re.sub(
                  r"(?i)<br\s*/?>",
                  ". ",
                  html
              )

              html = re.sub(
                  r"(?i)</p>",
                  ". ",
                  html
              )

              html = re.sub(
                  r"(?i)</div>",
                  ". ",
                  html
              )

              html = re.sub(
                  r"(?is)<[^>]+>",
                  " ",
                  html
              )

              text = unescape(html)

              text = text.replace(
                  "\xa0",
                  " "
              )

              text = re.sub(
                  r"\s+",
                  " ",
                  text
              )

              return text.strip()


          # ============================================================
          # SEC SUBMISSIONS
          # ============================================================

          def load_submissions(cik):

              url = (
                  "https://data.sec.gov/"
                  "submissions/"
                  f"CIK{cik}.json"
              )

              return get_json(url)


          # ============================================================
          # JÜNGSTE EARNINGS 8-K
          # ============================================================

          def latest_earnings_8k(data):

              recent = (
                  data.get("filings", {})
                      .get("recent", {})
              )


              accession_numbers = recent.get(
                  "accessionNumber",
                  []
              )

              filing_dates = recent.get(
                  "filingDate",
                  []
              )

              report_dates = recent.get(
                  "reportDate",
                  []
              )

              forms = recent.get(
                  "form",
                  []
              )

              items_list = recent.get(
                  "items",
                  []
              )

              documents = recent.get(
                  "primaryDocument",
                  []
              )


              count = min(
                  len(accession_numbers),
                  len(filing_dates),
                  len(forms),
                  len(documents)
              )


              for i in range(count):

                  form = forms[i]

                  items = (
                      items_list[i]
                      if i < len(items_list)
                      else ""
                  )


                  if (
                      form in ("8-K", "8-K/A")
                      and "2.02" in items
                  ):

                      return {

                          "accession":
                              accession_numbers[i],

                          "filing_date":
                              filing_dates[i],

                          "report_date":
                              (
                                  report_dates[i]
                                  if i < len(report_dates)
                                  else ""
                              ),

                          "form":
                              form,

                          "items":
                              items,

                          "primary_document":
                              documents[i]
                      }


              return None


          # ============================================================
          # ARCHIVE BASIS
          # ============================================================

          def archive_base(cik, accession):

              cik_number = str(
                  int(cik)
              )

              accession_clean = (
                  accession.replace(
                      "-",
                      ""
                  )
              )

              return (
                  "https://www.sec.gov/"
                  "Archives/edgar/data/"
                  f"{cik_number}/"
                  f"{accession_clean}/"
              )


          # ============================================================
          # FILING INDEX
          # ============================================================

          def load_filing_index(cik, accession):

              base = archive_base(
                  cik,
                  accession
              )

              index_url = (
                  base + "index.json"
              )

              return (
                  base,
                  get_json(index_url)
              )


          # ============================================================
          # HTML DATEIEN
          # ============================================================

          def get_html_files(index_data):

              items = (
                  index_data
                  .get("directory", {})
                  .get("item", [])
              )


              result = []


              for item in items:

                  name = (
                      item.get("name")
                      or ""
                  )

                  if name.lower().endswith(
                      (".htm", ".html")
                  ):

                      result.append(name)


              return result


          # ============================================================
          # EXHIBIT PRIORITÄT
          # ============================================================

          def document_priority(name):

              lower = name.lower()

              score = 0


              if "ex99" in lower:
                  score += 100

              if "exhibit99" in lower:
                  score += 100

              if "99-1" in lower:
                  score += 95

              if "99_1" in lower:
                  score += 95

              if "99.1" in lower:
                  score += 95

              if "earn" in lower:
                  score += 50

              if "release" in lower:
                  score += 40


              if "index" in lower:
                  score -= 20


              return score


          # ============================================================
          # TEXT IN SINNVOLLE BLÖCKE TEILEN
          # ============================================================

          def split_blocks(text):

              # Satzähnliche Trennung.
              # Nicht perfekt, aber deutlich besser
              # als reine Keyword-Suche.

              raw_blocks = re.split(
                  r"(?<=[.!?])\s+",
                  text
              )


              blocks = []


              for block in raw_blocks:

                  block = block.strip()


                  if len(block) < 30:
                      continue


                  if len(block) > 1800:

                      pieces = [
                          block[i:i + 1000]
                          for i in range(
                              0,
                              len(block),
                              1000
                          )
                      ]

                      blocks.extend(
                          pieces
                      )

                  else:

                      blocks.append(
                          block
                      )


              return blocks


          # ============================================================
          # PATTERN TEST
          # ============================================================

          def matches_any(
              text,
              patterns
          ):

              lower = text.lower()


              for pattern in patterns:

                  if re.search(
                      pattern,
                      lower,
                      flags=re.I
                  ):

                      return True


              return False


          # ============================================================
          # BUSINESS TERM TEST
          # ============================================================

          def business_relevance(text):

              lower = text.lower()


              hits = [

                  term

                  for term in BUSINESS_TERMS

                  if term in lower
              ]


              return hits


          # ============================================================
          # ZAHL / RANGE ERKENNEN
          # ============================================================

          def has_numeric_target(text):

              patterns = [

                  r"\$\s?\d",

                  r"\d+(?:\.\d+)?\s?%",

                  r"\d+(?:\.\d+)?\s*(?:billion|million)",

                  r"\d+(?:\.\d+)?\s*(?:to|-)\s*\d+(?:\.\d+)?\s?%",

                  r"\$\s?\d+(?:\.\d+)?\s*(?:to|-)\s*\$?\s?\d+(?:\.\d+)?"
              ]


              return any(
                  re.search(
                      pattern,
                      text,
                      flags=re.I
                  )
                  for pattern in patterns
              )


          # ============================================================
          # FORWARD BLOCKS FINDEN
          # ============================================================

          def find_forward_guidance(text):

              blocks = split_blocks(
                  text
              )


              results = []


              for index, block in enumerate(blocks):

                  if not matches_any(
                      block,
                      STRONG_FORWARD_PATTERNS
                  ):

                      continue


                  # Kontext: vorheriger + aktueller + nächster Satz
                  context_parts = []


                  if index > 0:
                      context_parts.append(
                          blocks[index - 1]
                      )


                  context_parts.append(
                      block
                  )


                  if index + 1 < len(blocks):
                      context_parts.append(
                          blocks[index + 1]
                      )


                  context = " ".join(
                      context_parts
                  )


                  historical = matches_any(
                      context,
                      HISTORICAL_PATTERNS
                  )


                  business_hits = (
                      business_relevance(
                          context
                      )
                  )


                  numeric = (
                      has_numeric_target(
                          context
                      )
                  )


                  # --------------------------------------------
                  # CONFIDENCE
                  #
                  # HIGH:
                  # echte Forward-Formulierung,
                  # kein historischer Kontext,
                  # Business-Kennzahl,
                  # Zahl/Range vorhanden
                  #
                  # MEDIUM:
                  # Forward + Business,
                  # aber keine konkrete Zahl
                  #
                  # REJECT:
                  # historischer Guidance-Kontext
                  # --------------------------------------------

                  if historical:

                      status = (
                          "REJECT_HISTORICAL"
                      )

                  elif (
                      business_hits
                      and numeric
                  ):

                      status = (
                          "HIGH"
                      )

                  elif business_hits:

                      status = (
                          "MEDIUM"
                      )

                  else:

                      status = (
                          "LOW"
                      )


                  results.append({

                      "status":
                          status,

                      "numeric":
                          numeric,

                      "business_hits":
                          business_hits,

                      "text":
                          context
                  })


              # Duplikate reduzieren
              unique = []

              seen = set()


              for item in results:

                  key = (
                      item["text"][:250]
                      .lower()
                  )


                  if key in seen:
                      continue


                  seen.add(key)

                  unique.append(
                      item
                  )


              return unique[:15]


          # ============================================================
          # HAUPTLAUF
          # ============================================================

          for symbol, cik in COMPANIES.items():

              print("")
              print("=" * 100)

              print(
                  "BULLWERK GUIDANCE V3:",
                  symbol
              )

              print("=" * 100)


              try:

                  submissions = (
                      load_submissions(
                          cik
                      )
                  )


                  print(
                      "Unternehmen:",
                      submissions.get(
                          "name"
                      )
                  )


                  filing = (
                      latest_earnings_8k(
                          submissions
                      )
                  )


                  if not filing:

                      print(
                          "Keine Earnings-8-K "
                          "mit Item 2.02 gefunden."
                      )

                      continue


                  print("")
                  print(
                      "Jüngste Earnings-8-K"
                  )

                  print(
                      "Filing Date:",
                      filing[
                          "filing_date"
                      ]
                  )

                  print(
                      "Report Date:",
                      filing[
                          "report_date"
                      ]
                  )

                  print(
                      "Items:",
                      filing[
                          "items"
                      ]
                  )


                  base, index_data = (
                      load_filing_index(
                          cik,
                          filing[
                              "accession"
                          ]
                      )
                  )


                  html_files = (
                      get_html_files(
                          index_data
                      )
                  )


                  html_files.sort(
                      key=document_priority,
                      reverse=True
                  )


                  print("")
                  print(
                      "Priorisierte Dokumente:"
                  )


                  for name in html_files[:8]:

                      print(
                          "-",
                          name,
                          "| Priorität:",
                          document_priority(
                              name
                          )
                      )


                  print("")
                  print("=" * 100)

                  print(
                      "ECHTE FORWARD-GUIDANCE-SUCHE"
                  )

                  print("=" * 100)


                  found_usable = False


                  for name in html_files[:8]:

                      priority = (
                          document_priority(
                              name
                          )
                      )


                      # Für Guidance bevorzugen wir
                      # Earnings Exhibits.
                      if priority < 40:
                          continue


                      url = (
                          base + name
                      )


                      try:

                          html = get_text(
                              url
                          )

                      except Exception as error:

                          print(
                              "Fehler beim Laden:",
                              name,
                              error
                          )

                          continue


                      text = html_to_text(
                          html
                      )


                      results = (
                          find_forward_guidance(
                              text
                          )
                      )


                      print("")
                      print(
                          "DOKUMENT:",
                          name
                      )

                      print(
                          "URL:",
                          url
                      )

                      print(
                          "Forward-Kandidaten:",
                          len(results)
                      )


                      if not results:

                          print(
                              "Keine Kandidaten."
                          )

                          continue


                      for number, item in enumerate(
                          results,
                          start=1
                      ):

                          print("")
                          print(
                              f"[{number}] "
                              f"STATUS: "
                              f"{item['status']}"
                          )

                          print(
                              "Konkrete Zahl/Range:",
                              item[
                                  "numeric"
                              ]
                          )

                          print(
                              "Business-Begriffe:",
                              ", ".join(
                                  item[
                                      "business_hits"
                                  ]
                              )
                              if item[
                                  "business_hits"
                              ]
                              else "-"
                          )

                          print(
                              "TEXT:"
                          )

                          print(
                              item[
                                  "text"
                              ]
                          )


                          if item[
                              "status"
                          ] in (
                              "HIGH",
                              "MEDIUM"
                          ):

                              found_usable = True


                      # Exhibit 99.1 reicht für
                      # diesen Test normalerweise aus.
                      if priority >= 90:
                          break


                  print("")
                  print("-" * 100)


                  if found_usable:

                      print(
                          "BULLWERK ERGEBNIS:",
                          "Neue Forward-Guidance "
                          "möglicherweise vorhanden."
                      )

                      print(
                          "STATUS:",
                          "PRÜFEN"
                      )

                  else:

                      print(
                          "BULLWERK ERGEBNIS:",
                          "Keine belastbare neue "
                          "Forward-Guidance im "
                          "Earnings Release erkannt."
                      )

                      print(
                          "STATUS:",
                          "N/A"
                      )

                      print(
                          "WICHTIG:",
                          "N/A bedeutet NICHT "
                          "0 Punkte."
                      )


              except Exception as error:

                  print(
                      "FEHLER bei",
                      symbol,
                      ":",
                      repr(error)
                  )


              print("")
              print(
                  symbol,
                  "abgeschlossen."
              )


              time.sleep(1)


          print("")
          print("=" * 100)

          print(
              "Bullwerk Guidance Test V3 beendet."
          )

          print("=" * 100)

          PY
