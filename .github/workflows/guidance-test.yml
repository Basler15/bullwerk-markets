name: Bullwerk Guidance Test V5

on:
  workflow_dispatch:

jobs:
  guidance-test:
    runs-on: ubuntu-latest

    steps:
      - name: Guidance V5 bewerten
        run: |
          python3 <<'PY'

          import json
          import re
          import time
          import urllib.request
          from html import unescape


          # ============================================================
          # BULLWERK MARKETS - GUIDANCE TEST V5
          #
          # Ziel:
          # 1. jüngste Earnings-8-K finden
          # 2. echte Earnings-/CFO-Commentary-Dokumente finden
          # 3. offizielle Guidance-Blöcke erkennen
          # 4. historische Guidance ausschließen
          # 5. Guidance vorläufig mit 0-3 bewerten
          #
          # WICHTIG:
          # N/A = nicht gemeldet / nicht zuverlässig erkennbar
          # N/A darf NICHT automatisch 0 Punkte bedeuten.
          # ============================================================


          COMPANIES = {
              "AAPL": "0000320193",
              "MSFT": "0000789019",
              "NVDA": "0001045810"
          }


          USER_AGENT = (
              "Bullwerk Markets "
              "contact: bullwerkmarkets@gmail.com"
          )


          # ============================================================
          # OFFIZIELLE GUIDANCE-ANKER
          #
          # Diese Muster sollen deutlich stärker gewichtet werden als
          # ein allgemeines "we expect".
          # ============================================================

          GUIDANCE_ANCHORS = [

              r"\boutlook for the (?:first|second|third|fourth) quarter\b",
              r"\boutlook for (?:q1|q2|q3|q4)\b",

              r"\boutlook for the next quarter\b",
              r"\bquarterly outlook\b",
              r"\bnext quarter outlook\b",

              r"\bguidance for the (?:first|second|third|fourth) quarter\b",
              r"\bguidance for (?:q1|q2|q3|q4)\b",
              r"\bguidance for the next quarter\b",

              r"\bfull[- ]year outlook\b",
              r"\bfull[- ]year guidance\b",

              r"\boutlook for fiscal (?:20)?\d{2}\b",
              r"\bguidance for fiscal (?:20)?\d{2}\b",

              r"\bfor the next fiscal quarter\b",
              r"\bfor the upcoming quarter\b",
              r"\bfor the coming quarter\b"
          ]


          # ============================================================
          # FORWARD LANGUAGE
          # ============================================================

          FORWARD_PATTERNS = [

              r"\bwe expect\b",
              r"\bwe anticipate\b",
              r"\bwe forecast\b",
              r"\bwe project\b",
              r"\bwe estimate\b",

              r"\bcompany expects\b",
              r"\bcompany anticipates\b",

              r"\brevenue is expected\b",
              r"\brevenue.*expected to be\b",

              r"\bgross margins?.*expected\b",
              r"\boperating margins?.*expected\b",
              r"\boperating expenses?.*expected\b",
              r"\boperating income.*expected\b",

              r"\bearnings.*expected\b",
              r"\beps.*expected\b",

              r"\btax rates?.*expected\b",
              r"\bcapital expenditures?.*expected\b"
          ]


          # ============================================================
          # HISTORISCHE GUIDANCE
          # ============================================================

          HISTORICAL_PATTERNS = [

              r"\bguidance provided\b",
              r"\bpreviously provided guidance\b",
              r"\bprevious guidance\b",
              r"\bprior guidance\b",

              r"\bcompared to our guidance\b",
              r"\bcompared with our guidance\b",
              r"\bversus our guidance\b",

              r"\bprovided on\b",

              r"\blower[- ]than[- ]expected\b",
              r"\bhigher[- ]than[- ]expected\b",

              r"\bexceeded expectations\b",
              r"\bbelow expectations\b",

              r"\bresults.*compared\b",
              r"\bresults.*versus\b"
          ]


          # ============================================================
          # KENNZAHLEN
          # ============================================================

          BUSINESS_TERMS = [

              "revenue",
              "sales",
              "growth",

              "gross margin",
              "gross margins",

              "operating margin",
              "operating margins",

              "operating income",

              "operating expense",
              "operating expenses",

              "earnings",
              "eps",

              "free cash flow",
              "cash flow",

              "capital expenditures",
              "capex",

              "tax rate",
              "tax rates"
          ]


          # ============================================================
          # HTTP
          # ============================================================

          def request_bytes(url, accept="*/*"):

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": USER_AGENT,
                      "Accept": accept,
                      "Accept-Encoding": "identity"
                  }
              )

              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:

                  print(
                      "HTTP",
                      response.status,
                      url
                  )

                  return response.read()


          def get_json(url):

              return json.loads(
                  request_bytes(
                      url,
                      "application/json"
                  ).decode(
                      "utf-8",
                      errors="replace"
                  )
              )


          def get_text(url):

              return request_bytes(
                  url,
                  "text/html,*/*"
              ).decode(
                  "utf-8",
                  errors="replace"
              )


          # ============================================================
          # HTML -> TEXT
          # ============================================================

          def html_to_text(html):

              html = re.sub(
                  r"(?is)<script.*?>.*?</script>",
                  " ",
                  html
              )

              html = re.sub(
                  r"(?is)<style.*?>.*?</style>",
                  " ",
                  html
              )

              for tag in [
                  r"<br\s*/?>",
                  r"</p>",
                  r"</div>",
                  r"</tr>",
                  r"</li>",
                  r"</h1>",
                  r"</h2>",
                  r"</h3>"
              ]:

                  html = re.sub(
                      rf"(?i){tag}",
                      ". ",
                      html
                  )


              html = re.sub(
                  r"(?is)<[^>]+>",
                  " ",
                  html
              )

              text = unescape(html)

              text = text.replace(
                  "\xa0",
                  " "
              )

              text = re.sub(
                  r"\s+",
                  " ",
                  text
              )

              return text.strip()


          # ============================================================
          # SEC SUBMISSIONS
          # ============================================================

          def load_submissions(cik):

              return get_json(
                  "https://data.sec.gov/"
                  "submissions/"
                  f"CIK{cik}.json"
              )


          # ============================================================
          # JÜNGSTE EARNINGS-8-K
          # ============================================================

          def latest_earnings_8k(data):

              recent = (
                  data.get("filings", {})
                      .get("recent", {})
              )

              accession = recent.get(
                  "accessionNumber",
                  []
              )

              filing_date = recent.get(
                  "filingDate",
                  []
              )

              report_date = recent.get(
                  "reportDate",
                  []
              )

              forms = recent.get(
                  "form",
                  []
              )

              items = recent.get(
                  "items",
                  []
              )

              documents = recent.get(
                  "primaryDocument",
                  []
              )


              count = min(
                  len(accession),
                  len(filing_date),
                  len(forms),
                  len(documents)
              )


              for i in range(count):

                  form = forms[i]

                  filing_items = (
                      items[i]
                      if i < len(items)
                      else ""
                  )


                  if (
                      form in ("8-K", "8-K/A")
                      and "2.02" in filing_items
                  ):

                      return {

                          "accession":
                              accession[i],

                          "filing_date":
                              filing_date[i],

                          "report_date":
                              (
                                  report_date[i]
                                  if i < len(report_date)
                                  else ""
                              ),

                          "items":
                              filing_items,

                          "primary_document":
                              documents[i]
                      }


              return None


          # ============================================================
          # SEC ARCHIVE
          # ============================================================

          def archive_base(cik, accession):

              cik_number = str(
                  int(cik)
              )

              accession_clean = (
                  accession.replace(
                      "-",
                      ""
                  )
              )

              return (
                  "https://www.sec.gov/"
                  "Archives/edgar/data/"
                  f"{cik_number}/"
                  f"{accession_clean}/"
              )


          def load_filing_index(cik, accession):

              base = archive_base(
                  cik,
                  accession
              )

              return (
                  base,
                  get_json(
                      base + "index.json"
                  )
              )


          # ============================================================
          # HTML-DATEIEN
          # ============================================================

          def get_html_files(index_data):

              result = []

              items = (
                  index_data
                  .get("directory", {})
                  .get("item", [])
              )


              for item in items:

                  name = (
                      item.get("name")
                      or ""
                  )

                  if name.lower().endswith(
                      (".htm", ".html")
                  ):

                      result.append(name)


              return result


          # ============================================================
          # DOKUMENT-PRIORITÄT
          # ============================================================

          def document_priority(name):

              lower = name.lower()

              score = 0


              if "cfocommentary" in lower:
                  score += 150

              if (
                  "cfo" in lower
                  and "commentary" in lower
              ):
                  score += 150


              if "earningscommentary" in lower:
                  score += 140

              if (
                  "earnings" in lower
                  and "commentary" in lower
              ):
                  score += 140


              if "financialcommentary" in lower:
                  score += 130


              if "outlook" in lower:
                  score += 120


              if "ex99" in lower:
                  score += 100

              if "exhibit99" in lower:
                  score += 100

              if "99-1" in lower:
                  score += 95

              if "99_1" in lower:
                  score += 95

              if "99.1" in lower:
                  score += 95


              if "earn" in lower:
                  score += 40

              if "release" in lower:
                  score += 35

              if "results" in lower:
                  score += 25


              if "index" in lower:
                  score -= 100

              if "header" in lower:
                  score -= 100


              return score


          def should_scan_document(
              name,
              primary_document
          ):

              lower = name.lower()

              primary = (
                  primary_document
                  or ""
              ).lower()


              if lower == primary:
                  return False


              if (
                  "index" in lower
                  or "header" in lower
              ):
                  return False


              if document_priority(name) >= 40:
                  return True


              if "commentary" in lower:
                  return True


              return False


          # ============================================================
          # HILFSFUNKTIONEN
          # ============================================================

          def matches_any(text, patterns):

              return any(
                  re.search(
                      pattern,
                      text,
                      flags=re.I
                  )
                  for pattern in patterns
              )


          def business_relevance(text):

              lower = text.lower()

              return [
                  term
                  for term in BUSINESS_TERMS
                  if term in lower
              ]


          def has_numeric_target(text):

              patterns = [

                  r"\$\s?\d",

                  r"\d+(?:\.\d+)?\s?%",

                  r"\d+(?:\.\d+)?\s*percent",

                  r"\d+(?:\.\d+)?\s*"
                  r"(?:billion|million)",

                  r"\d+(?:\.\d+)?\s*"
                  r"(?:to|-)\s*"
                  r"\d+(?:\.\d+)?\s?%",

                  r"\$\s?\d+(?:\.\d+)?\s*"
                  r"(?:to|-)\s*"
                  r"\$?\s?\d+(?:\.\d+)?",

                  r"\d+(?:\.\d+)?\s*"
                  r"(?:basis points|bps)",

                  r"plus or minus\s*"
                  r"\d+(?:\.\d+)?\s?%"
              ]


              return any(
                  re.search(
                      pattern,
                      text,
                      flags=re.I
                  )
                  for pattern in patterns
              )


          # ============================================================
          # TEXTBLÖCKE
          # ============================================================

          def split_blocks(text):

              blocks = re.split(
                  r"(?<=[.!?])\s+",
                  text
              )

              return [
                  block.strip()
                  for block in blocks
                  if len(
                      block.strip()
                  ) >= 25
              ]


          # ============================================================
          # GUIDANCE-BLÖCKE FINDEN
          # ============================================================

          def find_guidance_blocks(text):

              blocks = split_blocks(
                  text
              )

              results = []


              for index, block in enumerate(blocks):

                  anchor = matches_any(
                      block,
                      GUIDANCE_ANCHORS
                  )

                  forward = matches_any(
                      block,
                      FORWARD_PATTERNS
                  )


                  if not (
                      anchor
                      or forward
                  ):

                      continue


                  # Mehr Kontext nach vorne nehmen,
                  # weil Outlook-Überschrift häufig
                  # vor mehreren Guidance-Sätzen steht.

                  start = max(
                      0,
                      index - 1
                  )

                  end = min(
                      len(blocks),
                      index + 4
                  )


                  context = " ".join(
                      blocks[start:end]
                  )


                  context_anchor = (
                      matches_any(
                          context,
                          GUIDANCE_ANCHORS
                      )
                  )

                  context_forward = (
                      matches_any(
                          context,
                          FORWARD_PATTERNS
                      )
                  )

                  historical = (
                      matches_any(
                          context,
                          HISTORICAL_PATTERNS
                      )
                  )

                  numeric = (
                      has_numeric_target(
                          context
                      )
                  )

                  business_hits = (
                      business_relevance(
                          context
                      )
                  )


                  # --------------------------------------------
                  # CLASSIFICATION
                  # --------------------------------------------

                  if historical:

                      status = (
                          "REJECT_HISTORICAL"
                      )


                  elif (
                      context_anchor
                      and context_forward
                      and numeric
                      and business_hits
                  ):

                      status = (
                          "OFFICIAL_HIGH"
                      )


                  elif (
                      context_anchor
                      and business_hits
                  ):

                      status = (
                          "OFFICIAL_MEDIUM"
                      )


                  elif (
                      context_forward
                      and numeric
                      and business_hits
                  ):

                      status = (
                          "FORWARD_ONLY"
                      )


                  else:

                      status = "LOW"


                  results.append({

                      "status":
                          status,

                      "anchor":
                          context_anchor,

                      "forward":
                          context_forward,

                      "numeric":
                          numeric,

                      "business_hits":
                          business_hits,

                      "text":
                          context
                  })


              # Duplikate entfernen

              unique = []

              seen = set()


              for item in results:

                  normalized = re.sub(
                      r"\s+",
                      " ",
                      item["text"].lower()
                  )


                  key = normalized[:350]


                  if key in seen:
                      continue


                  seen.add(key)

                  unique.append(
                      item
                  )


              return unique[:20]


          # ============================================================
          # VORLÄUFIGER GUIDANCE-SCORE
          #
          # 3 = klare offizielle quantitative Guidance
          # 2 = klare offizielle Guidance, aber schwächer/teilweise
          # 1 = nur allgemeine Zukunftsaussage
          # 0 = belastbare negative/gesenkte Guidance
          # N/A = keine verwertbare Guidance
          #
          # ACHTUNG:
          # "0 = gesenkt" können wir erst zuverlässig verwenden,
          # wenn wir aktuelle mit vorheriger Guidance vergleichen.
          # Deshalb erzeugt V5 noch NICHT automatisch 0.
          # ============================================================

          def provisional_score(all_results):

              official_high = [
                  item
                  for item in all_results
                  if item["status"]
                  == "OFFICIAL_HIGH"
              ]

              official_medium = [
                  item
                  for item in all_results
                  if item["status"]
                  == "OFFICIAL_MEDIUM"
              ]

              forward_only = [
                  item
                  for item in all_results
                  if item["status"]
                  == "FORWARD_ONLY"
              ]


              if official_high:

                  return (
                      3,
                      "Klare offizielle "
                      "quantitative Forward-Guidance"
                  )


              if official_medium:

                  return (
                      2,
                      "Offizielle Forward-Guidance "
                      "erkannt"
                  )


              if forward_only:

                  return (
                      1,
                      "Allgemeine Forward-Aussage, "
                      "aber kein ausreichend klarer "
                      "Guidance-Block"
                  )


              return (
                  None,
                  "Keine belastbare neue Guidance "
                  "erkannt"
              )


          # ============================================================
          # HAUPTLAUF
          # ============================================================

          for symbol, cik in COMPANIES.items():

              print("")
              print("=" * 105)

              print(
                  "BULLWERK GUIDANCE V5:",
                  symbol
              )

              print("=" * 105)


              try:

                  submissions = (
                      load_submissions(
                          cik
                      )
                  )


                  print(
                      "Unternehmen:",
                      submissions.get(
                          "name"
                      )
                  )


                  filing = (
                      latest_earnings_8k(
                          submissions
                      )
                  )


                  if not filing:

                      print(
                          "Keine Earnings-8-K "
                          "mit Item 2.02 gefunden."
                      )

                      print(
                          "GUIDANCE SCORE: N/A"
                      )

                      continue


                  print("")
                  print(
                      "Jüngste Earnings-8-K"
                  )

                  print(
                      "Filing Date:",
                      filing[
                          "filing_date"
                      ]
                  )

                  print(
                      "Report Date:",
                      filing[
                          "report_date"
                      ]
                  )

                  print(
                      "Items:",
                      filing[
                          "items"
                      ]
                  )


                  base, index_data = (
                      load_filing_index(
                          cik,
                          filing[
                              "accession"
                          ]
                      )
                  )


                  html_files = (
                      get_html_files(
                          index_data
                      )
                  )


                  html_files.sort(
                      key=document_priority,
                      reverse=True
                  )


                  print("")
                  print(
                      "Dokumentauswahl:"
                  )


                  for name in html_files[:12]:

                      print(
                          "-",
                          name,
                          "| Priorität:",
                          document_priority(
                              name
                          ),
                          "| Scan:",
                          should_scan_document(
                              name,
                              filing[
                                  "primary_document"
                              ]
                          )
                      )


                  print("")
                  print("=" * 105)

                  print(
                      "OFFIZIELLE GUIDANCE-SUCHE"
                  )

                  print("=" * 105)


                  all_results = []

                  scanned = 0


                  for name in html_files[:12]:

                      if not should_scan_document(
                          name,
                          filing[
                              "primary_document"
                          ]
                      ):

                          continue


                      scanned += 1

                      url = (
                          base + name
                      )


                      try:

                          html = get_text(
                              url
                          )

                      except Exception as error:

                          print(
                              "Fehler beim Laden:",
                              name,
                              error
                          )

                          continue


                      text = html_to_text(
                          html
                      )


                      results = (
                          find_guidance_blocks(
                              text
                          )
                      )


                      print("")
                      print(
                          "DOKUMENT:",
                          name
                      )

                      print(
                          "URL:",
                          url
                      )

                      print(
                          "Guidance-Kandidaten:",
                          len(results)
                      )


                      for number, item in enumerate(
                          results,
                          start=1
                      ):

                          print("")
                          print(
                              f"[{number}] "
                              f"STATUS: "
                              f"{item['status']}"
                          )

                          print(
                              "Offizieller "
                              "Guidance-Anker:",
                              item["anchor"]
                          )

                          print(
                              "Forward-Sprache:",
                              item["forward"]
                          )

                          print(
                              "Zahl/Range:",
                              item["numeric"]
                          )

                          print(
                              "Kennzahlen:",
                              ", ".join(
                                  item[
                                      "business_hits"
                                  ]
                              )
                              if item[
                                  "business_hits"
                              ]
                              else "-"
                          )

                          print(
                              "TEXT:"
                          )

                          print(
                              item["text"]
                          )


                      all_results.extend(
                          results
                      )


                  score, reason = (
                      provisional_score(
                          all_results
                      )
                  )


                  print("")
                  print("=" * 105)

                  print(
                      "BULLWERK GUIDANCE "
                      "V5 ERGEBNIS"
                  )

                  print("=" * 105)

                  print(
                      "Geprüfte Dokumente:",
                      scanned
                  )


                  if score is None:

                      print(
                          "GUIDANCE SCORE: N/A"
                      )

                      print(
                          "Grund:",
                          reason
                      )

                      print(
                          "N/A wird später NICHT "
                          "wie 0 Punkte behandelt."
                      )


                  else:

                      print(
                          "VORLÄUFIGER "
                          "GUIDANCE SCORE:",
                          f"{score}/3"
                      )

                      print(
                          "Grund:",
                          reason
                      )


                  print("")
                  print(
                      "HINWEIS:"
                  )

                  print(
                      "V5 bewertet zunächst die "
                      "Qualität/Verfügbarkeit der "
                      "aktuellen Guidance."
                  )

                  print(
                      "Für die endgültige "
                      "Bullwerk-Regel "
                      "'raised / maintained / "
                      "cautious / lowered' "
                      "muss im nächsten Schritt "
                      "die aktuelle Guidance mit "
                      "der vorherigen Guidance "
                      "verglichen werden."
                  )


              except Exception as error:

                  print(
                      "FEHLER bei",
                      symbol,
                      ":",
                      repr(error)
                  )


              print("")
              print(
                  symbol,
                  "abgeschlossen."
              )


              time.sleep(1)


          print("")
          print("=" * 105)

          print(
              "Bullwerk Guidance Test V5 beendet."
          )

          print("=" * 105)

          PY
