
name: Bullwerk Morgenroutine - Tageslage

on:
  workflow_dispatch:
  schedule:
    # 07:30 Uhr in Deutschland, Sommer- und Winterzeit
    - cron: "30 5,6 * * 1-5"

permissions:
  contents: write

concurrency:
  group: bullwerk-tageslage
  cancel-in-progress: false

jobs:
  nachrichten:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Offizielle Nachrichten abrufen
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timedelta, timezone
          from email.utils import parsedate_to_datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          now = datetime.now(timezone.utc)
          berlin = now.astimezone(ZoneInfo("Europe/Berlin"))

          if os.environ.get("EVENT_NAME") == "schedule":
              if berlin.hour != 7:
                  print("Nicht 07 Uhr in Deutschland - Lauf übersprungen.")
                  raise SystemExit(0)

          feeds = {
              "Federal Reserve": "https://www.federalreserve.gov/feeds/press_all.xml",
              "BLS": "https://www.bls.gov/feed/bls_latest.rss",
              "BEA": "https://apps.bea.gov/rss/rss.xml"
          }

          meldungen = []
          erfolge = []
          fehler = []

          for quelle, url in feeds.items():
              try:
                  request = urllib.request.Request(
                      url,
                      headers={"User-Agent": "BullwerkMarkets/1.0"}
                  )
                  with urllib.request.urlopen(request, timeout=25) as response:
                      xml_data = response.read(2_000_000)

                  root = ET.fromstring(xml_data)

                  for item in root.findall(".//item"):
                      titel = (item.findtext("title") or "").strip()
                      link = (item.findtext("link") or "").strip()
                      datum = (item.findtext("pubDate") or "").strip()

                      if not titel or not link.startswith("https://"):
                          continue

                      try:
                          zeit = parsedate_to_datetime(datum)
                          if zeit.tzinfo is None:
                              zeit = zeit.replace(tzinfo=timezone.utc)
                          zeit = zeit.astimezone(timezone.utc)
                      except (ValueError, TypeError, IndexError):
                          continue

                      if not now - timedelta(days=7) <= zeit <= now + timedelta(hours=1):
                          continue

                      meldungen.append({
                          "quelle": quelle,
                          "titel": titel,
                          "link": link,
                          "veroeffentlicht": zeit.isoformat()
                      })

                  erfolge.append(quelle)
                  print(f"{quelle}: Abruf erfolgreich")

              except Exception as exc:
                  fehler.append({"quelle": quelle, "fehler": str(exc)})
                  print(f"{quelle}: Abruf fehlgeschlagen: {exc}")

          if not erfolge:
              raise RuntimeError("Keine Quelle erreichbar. Vorhandene Daten bleiben erhalten.")

          meldungen.sort(
              key=lambda x: x["veroeffentlicht"],
              reverse=True
          )

          daten = {
              "erstellt_am": berlin.isoformat(),
              "status": "quellensammlung",
              "hinweis": "Ungeprüfte Rohmeldungen, keine fertige Marktanalyse.",
              "erfolgreiche_quellen": erfolge,
              "fehlgeschlagene_quellen": fehler,
              "meldungen": meldungen[:20]
          }

          Path("tageslage-quellen.json").write_text(
              json.dumps(daten, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )

          print(f"{len(daten['meldungen'])} Meldungen gespeichert.")
          PY

      - name: Nachrichten speichern
        run: |
          if [ ! -f tageslage-quellen.json ]; then
            echo "Kein neuer Datenstand."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add tageslage-quellen.json

          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Bullwerk Tageslage: offizielle Nachrichten aktualisieren"
            git push
          fi
