name: Bullwerk Morgenroutine - Tageslage

on:
  workflow_dispatch:
  schedule:
    # Zwei UTC-Termine; Python waehlt 07 Uhr Berliner Zeit (Sommer/Winter).
    - cron: "30 5,6 * * 1-5"

permissions:
  contents: write

concurrency:
  group: bullwerk-tageslage
  cancel-in-progress: false

jobs:
  nachrichten:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Offizielle Meldungen und Konjunkturdaten abrufen und bewerten
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import csv
          import io
          import json
          import os
          import urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timedelta, timezone
          from email.utils import parsedate_to_datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          now = datetime.now(timezone.utc)
          berlin = now.astimezone(ZoneInfo("Europe/Berlin"))
          if os.environ.get("EVENT_NAME") == "schedule" and berlin.hour != 7:
              print("Nicht 07 Uhr in Deutschland - Lauf uebersprungen.")
              raise SystemExit(0)

          def download(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "BullwerkMarkets/1.0 (public economic data)",
                      "Accept": "application/xml,text/xml,text/csv,*/*",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return response.read(2_000_000)

          feeds = {
              "Federal Reserve": "https://www.federalreserve.gov/feeds/press_all.xml",
              "BEA": "https://apps.bea.gov/rss/rss.xml",
          }
          meldungen = []
          erfolge = []
          fehler = []

          for quelle, url in feeds.items():
              try:
                  root = ET.fromstring(download(url))
                  for item in root.findall(".//item"):
                      titel = (item.findtext("title") or "").strip()
                      link = (item.findtext("link") or "").strip()
                      datum = (item.findtext("pubDate") or "").strip()
                      if not titel or not link.startswith("https://"):
                          continue
                      try:
                          zeit = parsedate_to_datetime(datum)
                          if zeit.tzinfo is None:
                              zeit = zeit.replace(tzinfo=timezone.utc)
                          zeit = zeit.astimezone(timezone.utc)
                      except (TypeError, ValueError, IndexError):
                          continue
                      if now - timedelta(days=7) <= zeit <= now + timedelta(hours=1):
                          meldungen.append({
                              "quelle": quelle,
                              "titel": titel,
                              "link": link,
                              "veroeffentlicht": zeit.isoformat(),
                          })
                  erfolge.append(quelle)
                  print(f"{quelle}: RSS-Abruf erfolgreich")
              except Exception as exc:
                  fehler.append({"quelle": quelle, "fehler": str(exc)})
                  print(f"{quelle}: RSS-Abruf fehlgeschlagen: {exc}")

          # FRED ist eine alternative Quelle fuer BLS-Konjunktur-Messwerte.
          # Diese Daten sind keine BLS-Nachrichten und keine Erscheinungstermine.
          def fred_series(series_id):
              url = "https://fred.stlouisfed.org/graph/fredgraph.csv?id=" + series_id
              csv_text = download(url).decode("utf-8-sig")
              rows = list(csv.DictReader(io.StringIO(csv_text)))
              werte = []
              for row in rows:
                  datum = row.get("observation_date") or row.get("DATE")
                  raw = row.get(series_id)
                  if datum and raw and raw != ".":
                      try:
                          werte.append((datum, float(raw)))
                      except ValueError:
                          pass
              if not werte:
                  raise ValueError(f"Keine Beobachtungen fuer {series_id}")
              return werte

          konjunktur = {}
          try:
              cpi = fred_series("CPIAUCSL")
              datum, wert = cpi[-1]
              jahr, monat = map(int, datum[:7].split("-"))
              alter_monat = f"{jahr - 1:04d}-{monat:02d}"
              alt = next((v for d, v in cpi if d.startswith(alter_monat)), None)
              eintrag = {
                  "wert": round(wert, 3),
                  "datum": datum,
                  "quelle": "FRED/CPIAUCSL",
                  "einheit": "Index",
              }
              if alt is not None and alt != 0:
                  eintrag["veraenderung_12m_prozent"] = round((wert / alt - 1) * 100, 2)
              konjunktur["verbraucherpreise_cpi"] = eintrag
              erfolge.append("FRED/CPIAUCSL")
              print("FRED CPI: erfolgreich")
          except Exception as exc:
              fehler.append({"quelle": "FRED/CPIAUCSL", "fehler": str(exc)})
              print(f"FRED CPI: {exc}")

          try:
              arbeitslosigkeit = fred_series("UNRATE")
              datum, wert = arbeitslosigkeit[-1]
              konjunktur["arbeitslosenquote"] = {
                  "wert": round(wert, 2),
                  "datum": datum,
                  "quelle": "FRED/UNRATE (BLS)",
                  "einheit": "Prozent",
              }
              erfolge.append("FRED/UNRATE")
              print("FRED Arbeitslosenquote: erfolgreich")
          except Exception as exc:
              fehler.append({"quelle": "FRED/UNRATE", "fehler": str(exc)})
              print(f"FRED Arbeitslosenquote: {exc}")

          if not erfolge:
              raise RuntimeError(
                  "Keine Datenquelle erreichbar; vorhandene Datei bleibt unveraendert."
              )

          # Regelbasierte Themenklassifikation: kein KI-Urteil und kein Handelssignal.
          # Fuer einen Treffer zaehlt jeweils das hoechste Gewicht pro Thema.
          themen = {
              "Geldpolitik": {
                  "gewicht": 5,
                  "woerter": [
                      "federal funds", "interest rate", "discount rate",
                      "monetary policy", "fomc", "rate decision",
                      "policy rate", "balance sheet", "quantitative tightening",
                  ],
              },
              "Inflation": {
                  "gewicht": 5,
                  "woerter": [
                      "inflation", "consumer price", "price index",
                      "personal consumption expenditures", "pce price",
                      "producer price",
                  ],
              },
              "Arbeitsmarkt": {
                  "gewicht": 4,
                  "woerter": [
                      "employment", "unemployment", "nonfarm payroll",
                      "job openings", "labor market", "labour market",
                      "wages", "jobless claims",
                  ],
              },
              "Konjunktur": {
                  "gewicht": 4,
                  "woerter": [
                      "gross domestic product", "gdp", "economic growth",
                      "retail sales", "consumer spending", "industrial production",
                      "personal income", "economic activity",
                  ],
              },
              "Finanzsystem und Liquiditaet": {
                  "gewicht": 3,
                  "woerter": [
                      "financial stability", "liquidity", "banking system",
                      "credit conditions", "financial conditions",
                      "bank lending", "repo market",
                  ],
              },
          }
          ausschluss_woerter = [
              "enforcement action", "civil money penalty",
              "termination of enforcement", "consent order",
              "prohibition order",
          ]

          def bewerte(meldung):
              titel = meldung["titel"].casefold()
              treffer = []
              for thema, regel in themen.items():
                  if any(wort in titel for wort in regel["woerter"]):
                      treffer.append((thema, regel["gewicht"]))
              if not treffer:
                  return None
              if any(wort in titel for wort in ausschluss_woerter):
                  return None

              zeit = datetime.fromisoformat(meldung["veroeffentlicht"])
              alter_stunden = max(0, (now - zeit).total_seconds() / 3600)
              # Aktuellere Meldungen erhalten einen kleinen Zusatzbonus.
              aktualitaet = 2 if alter_stunden <= 24 else (1 if alter_stunden <= 72 else 0)
              score = min(10, max(gewicht for _, gewicht in treffer) + aktualitaet)
              return {
                  **meldung,
                  "themen": [thema for thema, _ in treffer],
                  "relevanz_score": score,
                  "bewertung": "Regelbasierte Vorauswahl anhand der Ueberschrift; nicht redaktionell geprueft.",
              }

          meldungen.sort(key=lambda x: x["veroeffentlicht"], reverse=True)
          bewertete = [ergebnis for m in meldungen if (ergebnis := bewerte(m))]
          bewertete.sort(
              key=lambda x: (x["relevanz_score"], x["veroeffentlicht"]),
              reverse=True,
          )

          daten = {
              "erstellt_am": berlin.isoformat(),
              "status": "quellensammlung_mit_vorauswahl",
              "hinweis": (
                  "Rohmeldungen und Messwerte mit regelbasierter Themen-Vorauswahl; "
                  "keine gepruefte Marktanalyse und keine Marktampel."
              ),
              "erfolgreiche_quellen": erfolge,
              "fehlgeschlagene_quellen": fehler,
              "konjunktur": konjunktur,
              "meldungen": meldungen[:20],
              "relevante_meldungen": bewertete[:5],
              "bewertungsmethode": "Schluesselwoerter in Ueberschriften plus Aktualitaetsbonus",
          }
          Path("tageslage-quellen.json").write_text(
              json.dumps(daten, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(
              f"{len(daten['meldungen'])} Meldungen; "
              f"{len(konjunktur)} Konjunkturindikatoren; "
              f"{len(daten['relevante_meldungen'])} relevante Meldungen gespeichert."
          )
          PY

      - name: Daten speichern
        run: |
          if [ ! -f tageslage-quellen.json ]; then
            echo "Kein neuer Datenstand."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tageslage-quellen.json
          if git diff --cached --quiet; then
            echo "Keine Aenderungen."
          else
            git commit -m "Bullwerk Tageslage: Meldungen, Konjunktur und Relevanz"
            git push
          fi
