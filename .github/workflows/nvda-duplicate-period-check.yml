name: NVDA Current Revenue Period Check

on:
  workflow_dispatch:

jobs:
  check-nvda-current-period:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: NVDA aktuellen Revenue Wert prüfen
        run: |
          python - <<'PY'
          from scanner.sec_data import get_company_facts
          from scanner.revenue import get_revenue_data


          CIK = "0001045810"

          TARGET_START = "2026-04-27"
          TARGET_END = "2026-07-26"
          TARGET_VALUE = 96221000000


          print("=" * 90)
          print("NVDA CURRENT REVENUE PERIOD CHECK")
          print("=" * 90)

          facts = get_company_facts(CIK)

          revenue = get_revenue_data(
              facts
          )

          print()
          print(
              "REVENUE CONCEPT:",
              revenue.get("concept")
          )

          rows = revenue.get(
              "rows",
              []
          )

          matches = []

          for row in rows:

              if (
                  row.get("start") == TARGET_START
                  and
                  row.get("end") == TARGET_END
              ):
                  matches.append(
                      row
                  )


          print()
          print(
              "GESUCHTER ZEITRAUM:",
              TARGET_START,
              "bis",
              TARGET_END
          )

          print(
              "ERWARTETER WERT:",
              TARGET_VALUE
          )

          print(
              "ANZAHL FUNDSTELLEN:",
              len(matches)
          )


          if not matches:
              raise RuntimeError(
                  "Kein SEC-Eintrag für "
                  "den gesuchten Zeitraum gefunden."
              )


          for number, row in enumerate(
              matches,
              start=1,
          ):

              print()
              print("-" * 90)

              print(
                  "EINTRAG:",
                  number
              )

              print(
                  "Wert:",
                  row.get("val")
              )

              print(
                  "Start:",
                  row.get("start")
              )

              print(
                  "Ende:",
                  row.get("end")
              )

              print(
                  "Filed:",
                  row.get("filed")
              )

              print(
                  "Form:",
                  row.get("form")
              )

              print(
                  "FY:",
                  row.get("fy")
              )

              print(
                  "FP:",
                  row.get("fp")
              )

              print(
                  "Frame:",
                  row.get("frame")
              )

              print(
                  "Accession:",
                  row.get("accn")
              )

              print(
                  "Wert entspricht 96,221 Mrd.:",
                  row.get("val") == TARGET_VALUE
              )


          exact_matches = [
              row
              for row in matches
              if row.get("val") == TARGET_VALUE
          ]


          print()
          print("=" * 90)

          print(
              "EXAKTE 96,221-MRD-FUNDSTELLEN:",
              len(exact_matches)
          )


          for row in exact_matches:

              print()
              print(
                  "96,221 MRD SEC CONTEXT:"
              )

              print(
                  "Start:",
                  row.get("start")
              )

              print(
                  "Ende:",
                  row.get("end")
              )

              print(
                  "Form:",
                  row.get("form")
              )

              print(
                  "Filed:",
                  row.get("filed")
              )

              print(
                  "FY:",
                  row.get("fy")
              )

              print(
                  "FP:",
                  row.get("fp")
              )

              print(
                  "Frame:",
                  row.get("frame")
              )

              print(
                  "Accession:",
                  row.get("accn")
              )


          if not exact_matches:
              raise RuntimeError(
                  "96,221 Mrd. wurden für diesen "
                  "Zeitraum nicht gefunden."
              )


          print()
          print("=" * 90)
          print("CHECK ERFOLGREICH")
          print("=" * 90)
          PY
