name: NVDA Duplicate Period Check

on:
  workflow_dispatch:

jobs:
  check-nvda-periods:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: NVDA doppelte SEC Perioden prüfen
        run: |
          python - <<'PY'
          from scanner.sec_data import get_company_facts
          from scanner.revenue import get_revenue_data


          CIK = "0001045810"

          TARGET_PERIODS = [
              (
                  "2025-04-28",
                  "2025-07-27",
              ),
              (
                  "2025-01-27",
                  "2025-04-27",
              ),
          ]


          print("=" * 90)
          print("NVDA DUPLICATE PERIOD CHECK")
          print("=" * 90)

          facts = get_company_facts(CIK)

          revenue = get_revenue_data(
              facts
          )

          print()
          print(
              "VERWENDETES REVENUE CONCEPT:",
              revenue.get("concept")
          )

          rows = revenue.get(
              "rows",
              []
          )


          for target_start, target_end in TARGET_PERIODS:

              print()
              print("=" * 90)

              print(
                  "GESUCHTER ZEITRAUM:",
                  target_start,
                  "bis",
                  target_end
              )

              matches = []

              for row in rows:

                  if (
                      row.get("start")
                      == target_start
                      and
                      row.get("end")
                      == target_end
                  ):
                      matches.append(
                          row
                      )


              print(
                  "ANZAHL FUNDSTELLEN:",
                  len(matches)
              )


              if not matches:

                  print(
                      "KEINE PASSENDEN "
                      "SEC-EINTRÄGE GEFUNDEN"
                  )

                  continue


              matches.sort(
                  key=lambda row:
                      row.get("filed", "")
              )


              unique_values = set()


              for number, row in enumerate(
                  matches,
                  start=1,
              ):

                  value = row.get(
                      "val"
                  )

                  unique_values.add(
                      value
                  )

                  print()
                  print(
                      "EINTRAG:",
                      number
                  )

                  print(
                      " Wert:",
                      value
                  )

                  print(
                      " Filed:",
                      row.get(
                          "filed"
                      )
                  )

                  print(
                      " Form:",
                      row.get(
                          "form"
                      )
                  )

                  print(
                      " FY:",
                      row.get(
                          "fy"
                      )
                  )

                  print(
                      " FP:",
                      row.get(
                          "fp"
                      )
                  )

                  print(
                      " Frame:",
                      row.get(
                          "frame"
                      )
                  )

                  print(
                      " Accession:",
                      row.get(
                          "accn"
                      )
                  )


              print()
              print(
                  "UNTERSCHIEDLICHE WERTE:",
                  len(unique_values)
              )

              print(
                  "WERTE:",
                  sorted(
                      unique_values
                  )
              )


              if len(unique_values) == 1:

                  print(
                      "ERGEBNIS: "
                      "Alle SEC-Fundstellen "
                      "melden denselben Wert."
                  )

              else:

                  print(
                      "ERGEBNIS: ACHTUNG - "
                      "Für denselben Zeitraum "
                      "existieren unterschiedliche Werte."
                  )


          print()
          print("=" * 90)
          print(
              "DUPLICATE PERIOD CHECK ABGESCHLOSSEN"
          )
          print("=" * 90)
          PY
